<link rel="stylesheet" href="../../../../styles/shared.css" />
<link rel="stylesheet" href="../../../../styles/ds.css" />
<link rel="stylesheet" href="../../../../data/design-system/company.css" />

<div style="background: var(--bg-0); overflow-x: clip; min-height: 100vh">
  <div class="mr-scope" style="padding-bottom: 88px">
    <header style="display: flex; align-items: center; justify-content: space-between; padding: 16px 16px 6px">
      <span style="font-size: 1.25rem; font-weight: 800; color: var(--text)">You</span>
      <div style="display: flex; gap: 8px; align-items: center">
        <button type="button" class="mr-nav-icon-btn" aria-label="Search"><i class="ph ph-magnifying-glass" aria-hidden="true"></i></button>
        <button type="button" class="mr-nav-icon-btn" aria-label="Settings"><i class="ph ph-gear" aria-hidden="true"></i></button>
      </div>
    </header>

    <div style="padding: 6px 16px 16px; display: flex; align-items: center; gap: 12px">
      <img src="https://i.pravatar.cc/72?img=11" alt="" style="width: 56px; height: 56px; border-radius: 50%; border: 1.5px solid rgba(255,255,255,0.12); object-fit: cover" />
      <div style="flex: 1; min-width: 0">
        <div style="font-size: 1.05rem; font-weight: 800; color: var(--text)">Brandon Unglaub</div>
        <button type="button" style="display: inline-flex; align-items: center; gap: 5px; margin-top: 2px; padding: 4px 10px; border-radius: 999px; background: rgba(255,255,255,0.06); border: 1px solid rgba(255,255,255,0.1); color: rgba(255,255,255,0.75); font-weight: 700; font-size: 0.7rem; cursor: pointer">
          <i class="ph ph-eye" style="font-size: 11px"></i> View public profile
        </button>
      </div>
    </div>

    <div style="padding: 0 16px 18px">
      <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 10px">
        <div style="height: 130px; border-radius: 18px; padding: 14px; display: flex; flex-direction: column; justify-content: space-between; background: linear-gradient(135deg, rgba(255,107,139,0.18), rgba(255,107,139,0.04)); border: 1px solid rgba(255,107,139,0.2); position: relative; overflow: hidden">
          <i class="ph-fill ph-bookmark-simple" style="font-size: 26px; color: #ff6b8b"></i>
          <div>
            <div style="font-size: 1rem; font-weight: 800; color: var(--text)">Saves</div>
            <div style="font-size: 0.74rem; color: rgba(255,255,255,0.6)">10 places · 2 lists</div>
          </div>
        </div>
        <div style="height: 130px; border-radius: 18px; padding: 14px; display: flex; flex-direction: column; justify-content: space-between; background: linear-gradient(135deg, rgba(91,165,255,0.18), rgba(91,165,255,0.04)); border: 1px solid rgba(91,165,255,0.2)">
          <i class="ph-fill ph-users-three" style="font-size: 26px; color: #5ba5ff"></i>
          <div>
            <div style="font-size: 1rem; font-weight: 800; color: var(--text)">Groups</div>
            <div style="font-size: 0.74rem; color: rgba(255,255,255,0.6)">3 active</div>
          </div>
        </div>
        <div style="height: 130px; border-radius: 18px; padding: 14px; display: flex; flex-direction: column; justify-content: space-between; background: linear-gradient(135deg, rgba(32,224,207,0.18), rgba(32,224,207,0.04)); border: 1px solid rgba(32,224,207,0.2)">
          <i class="ph-fill ph-calendar-check" style="font-size: 26px; color: #20e0cf"></i>
          <div>
            <div style="font-size: 1rem; font-weight: 800; color: var(--text)">Plans</div>
            <div style="font-size: 0.74rem; color: rgba(255,255,255,0.6)">4 upcoming</div>
          </div>
        </div>
        <div style="height: 130px; border-radius: 18px; padding: 14px; display: flex; flex-direction: column; justify-content: space-between; background: linear-gradient(135deg, rgba(245,196,81,0.18), rgba(245,196,81,0.04)); border: 1px solid rgba(245,196,81,0.2)">
          <i class="ph-fill ph-tag" style="font-size: 26px; color: #f5c451"></i>
          <div>
            <div style="font-size: 1rem; font-weight: 800; color: var(--text)">Interests</div>
            <div style="font-size: 0.74rem; color: rgba(255,255,255,0.6)">3 active</div>
          </div>
        </div>
        <div style="height: 130px; border-radius: 18px; padding: 14px; display: flex; flex-direction: column; justify-content: space-between; background: linear-gradient(135deg, rgba(156,77,255,0.18), rgba(156,77,255,0.04)); border: 1px solid rgba(156,77,255,0.2)">
          <i class="ph-fill ph-user-plus" style="font-size: 26px; color: #9c4dff"></i>
          <div>
            <div style="font-size: 1rem; font-weight: 800; color: var(--text)">Friends</div>
            <div style="font-size: 0.74rem; color: rgba(255,255,255,0.6)">42 · 3 new</div>
          </div>
        </div>
        <div style="height: 130px; border-radius: 18px; padding: 14px; display: flex; flex-direction: column; justify-content: space-between; background: rgba(255,255,255,0.03); border: 1px dashed rgba(255,255,255,0.14)">
          <i class="ph ph-plus-circle" style="font-size: 26px; color: rgba(255,255,255,0.6)"></i>
          <div>
            <div style="font-size: 1rem; font-weight: 800; color: var(--text)">New collection</div>
            <div style="font-size: 0.74rem; color: rgba(255,255,255,0.5)">Make your own</div>
          </div>
        </div>
      </div>
    </div>

    <div style="padding: 6px 16px 14px">
      <div style="font-size: 1rem; font-weight: 800; color: var(--text); padding-bottom: 10px">Lately</div>
      <div style="padding: 12px; border-radius: 14px; background: rgba(255,255,255,0.03); border: 1px solid rgba(255,255,255,0.06); display: flex; flex-direction: column; gap: 10px">
        <div style="display: flex; gap: 10px; align-items: center">
          <i class="ph-fill ph-bookmark-simple" style="color: #5ba5ff; font-size: 14px"></i>
          <div style="flex: 1; min-width: 0; font-size: 0.84rem; color: rgba(255,255,255,0.85); font-weight: 600">Saved <strong style="color: var(--text)">All Day Darling</strong> to Asheville</div>
          <span style="font-size: 0.7rem; color: rgba(255,255,255,0.4)">2h</span>
        </div>
        <div style="display: flex; gap: 10px; align-items: center">
          <i class="ph-fill ph-calendar-plus" style="color: #20e0cf; font-size: 14px"></i>
          <div style="flex: 1; min-width: 0; font-size: 0.84rem; color: rgba(255,255,255,0.85); font-weight: 600">Created <strong style="color: var(--text)">Wes Parker show</strong></div>
          <span style="font-size: 0.7rem; color: rgba(255,255,255,0.4)">1d</span>
        </div>
        <div style="display: flex; gap: 10px; align-items: center">
          <i class="ph-fill ph-user-plus" style="color: #9c4dff; font-size: 14px"></i>
          <div style="flex: 1; min-width: 0; font-size: 0.84rem; color: rgba(255,255,255,0.85); font-weight: 600">Sarah added you as a friend</div>
          <span style="font-size: 0.7rem; color: rgba(255,255,255,0.4)">2d</span>
        </div>
      </div>
    </div>

    <div style="position: fixed; left: 0; right: 0; bottom: 0; padding: 10px 8px 14px; background: linear-gradient(180deg, transparent, var(--bg-0) 35%)">
      <div class="mr-tab-bar" style="margin: 0 8px">
        <button type="button" class="mr-tab-item" aria-label="Plans"><i class="ph ph-calendar-blank" aria-hidden="true"></i></button>
        <button type="button" class="mr-tab-item" aria-label="Explore"><i class="ph ph-compass" aria-hidden="true"></i></button>
        <button type="button" class="mr-tab-item mr-tab-create" aria-label="Create"><i class="ph ph-plus-circle" aria-hidden="true"></i></button>
        <button type="button" class="mr-tab-item mr-tab-active" aria-label="You"><i class="ph-fill ph-user" aria-hidden="true"></i></button>
        <button type="button" class="mr-tab-item" aria-label="Chat"><i class="ph ph-chat-teardrop-text" aria-hidden="true"></i></button>
      </div>
    </div>
  </div>
</div>
