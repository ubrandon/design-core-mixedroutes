<link rel="stylesheet" href="../../../../styles/shared.css" />
<link rel="stylesheet" href="../../../../styles/ds.css" />
<link rel="stylesheet" href="../../../../data/design-system/company.css" />

<div style="background: var(--bg-0); overflow-x: clip; min-height: 100vh; position: relative">
  <div class="mr-scope" style="padding-bottom: 24px; opacity: 0.35; pointer-events: none">
    <header style="display: flex; align-items: center; justify-content: space-between; padding: 16px 16px 8px">
      <span style="font-size: 1.25rem; font-weight: 800; color: var(--text)">You</span>
      <button type="button" class="mr-nav-icon-btn" aria-label="Settings"><i class="ph ph-gear" aria-hidden="true"></i></button>
    </header>
    <div style="padding: 6px 16px 16px; display: flex; align-items: center; gap: 12px">
      <img src="https://i.pravatar.cc/72?img=11" alt="" style="width: 56px; height: 56px; border-radius: 50%; object-fit: cover" />
      <div>
        <div style="font-size: 1.05rem; font-weight: 800; color: var(--text)">Brandon Unglaub</div>
        <div style="font-size: 0.74rem; color: rgba(255,255,255,0.55)">@brandon</div>
      </div>
    </div>
    <div style="padding: 0 16px 14px; display: grid; grid-template-columns: 1fr 1fr; gap: 10px">
      <div style="height: 92px; border-radius: 16px; background: rgba(255,255,255,0.05)"></div>
      <div style="height: 92px; border-radius: 16px; background: rgba(255,255,255,0.05)"></div>
      <div style="height: 92px; border-radius: 16px; background: rgba(255,255,255,0.05)"></div>
      <div style="height: 92px; border-radius: 16px; background: rgba(255,255,255,0.05)"></div>
    </div>
  </div>

  <div style="position: absolute; inset: 0; background: rgba(0,0,0,0.55); pointer-events: none"></div>

  <div style="position: absolute; left: 0; right: 0; bottom: 0; padding: 0 8px 8px">
    <div style="background: #15263a; border-radius: 22px 22px 14px 14px; border: 1px solid rgba(255,255,255,0.08); overflow: hidden">
      <div style="display: flex; justify-content: center; padding: 8px 0">
        <div style="width: 36px; height: 4px; border-radius: 2px; background: rgba(255,255,255,0.18)"></div>
      </div>

      <div style="padding: 8px 18px 4px">
        <div style="font-size: 1.1rem; font-weight: 800; color: var(--text)">Who can see what</div>
        <div style="font-size: 0.78rem; color: rgba(255,255,255,0.55); margin-top: 4px">A quick map of your visibility</div>
      </div>

      <div style="padding: 14px 18px 8px; display: flex; flex-direction: column; gap: 8px">
        <div style="padding: 12px; border-radius: 12px; background: rgba(91,165,255,0.08); border: 1px solid rgba(91,165,255,0.18); display: flex; gap: 12px; align-items: center">
          <div style="width: 36px; height: 36px; border-radius: 10px; background: rgba(91,165,255,0.22); display: flex; align-items: center; justify-content: center">
            <i class="ph-fill ph-globe" style="color: #5ba5ff; font-size: 16px"></i>
          </div>
          <div style="flex: 1; min-width: 0">
            <div style="font-size: 0.88rem; font-weight: 800; color: var(--text)">Anyone</div>
            <div style="font-size: 0.74rem; color: rgba(255,255,255,0.6); margin-top: 2px">Name, photo, interests</div>
          </div>
          <i class="ph ph-caret-right" style="color: rgba(255,255,255,0.45); font-size: 13px"></i>
        </div>

        <div style="padding: 12px; border-radius: 12px; background: rgba(32,224,207,0.08); border: 1px solid rgba(32,224,207,0.18); display: flex; gap: 12px; align-items: center">
          <div style="width: 36px; height: 36px; border-radius: 10px; background: rgba(32,224,207,0.22); display: flex; align-items: center; justify-content: center">
            <i class="ph-fill ph-users-three" style="color: #20e0cf; font-size: 16px"></i>
          </div>
          <div style="flex: 1; min-width: 0">
            <div style="font-size: 0.88rem; font-weight: 800; color: var(--text)">Friends</div>
            <div style="font-size: 0.74rem; color: rgba(255,255,255,0.6); margin-top: 2px">Public lists, groups in common, plans</div>
          </div>
          <i class="ph ph-caret-right" style="color: rgba(255,255,255,0.45); font-size: 13px"></i>
        </div>

        <div style="padding: 12px; border-radius: 12px; background: rgba(255,107,139,0.08); border: 1px solid rgba(255,107,139,0.18); display: flex; gap: 12px; align-items: center">
          <div style="width: 36px; height: 36px; border-radius: 10px; background: rgba(255,107,139,0.22); display: flex; align-items: center; justify-content: center">
            <i class="ph-fill ph-lock-key" style="color: #ff6b8b; font-size: 16px"></i>
          </div>
          <div style="flex: 1; min-width: 0">
            <div style="font-size: 0.88rem; font-weight: 800; color: var(--text)">Only you</div>
            <div style="font-size: 0.74rem; color: rgba(255,255,255,0.6); margin-top: 2px">Drafts, private lists, history, saved places</div>
          </div>
          <i class="ph ph-caret-right" style="color: rgba(255,255,255,0.45); font-size: 13px"></i>
        </div>
      </div>

      <div style="padding: 4px 18px 14px">
        <button type="button" style="width: 100%; padding: 12px; border-radius: 14px; background: rgba(255,255,255,0.06); border: 1px solid rgba(255,255,255,0.12); color: var(--text); font-weight: 800; font-size: 0.88rem; cursor: pointer; display: inline-flex; align-items: center; justify-content: center; gap: 8px">
          <i class="ph ph-eye" style="font-size: 14px"></i> Preview your profile
        </button>
      </div>
    </div>
  </div>
</div>
