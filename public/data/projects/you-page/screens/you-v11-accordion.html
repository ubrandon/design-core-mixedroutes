<link rel="stylesheet" href="../../../../styles/shared.css" />
<link rel="stylesheet" href="../../../../styles/ds.css" />
<link rel="stylesheet" href="../../../../data/design-system/company.css" />

<div style="background: var(--bg-0); overflow-x: clip; min-height: 100vh">
  <div class="mr-scope" style="padding-bottom: 88px">
    <div style="display: flex; align-items: center; gap: 10px; padding: 14px 14px 12px">
      <div style="position: relative; flex: 0 0 auto">
        <img src="https://i.pravatar.cc/72?img=11" alt="" style="width: 34px; height: 34px; border-radius: 50%; object-fit: cover; border: 1.5px solid rgba(255,255,255,0.12)" />
        <span style="position: absolute; right: -2px; bottom: -2px; width: 10px; height: 10px; border-radius: 50%; background: #20e0cf; border: 2px solid var(--bg-0)"></span>
      </div>
      <div style="flex: 1; min-width: 0; line-height: 1.1">
        <div style="font-size: 0.92rem; font-weight: 800; color: var(--text)">Brandon</div>
        <div style="font-size: 0.66rem; color: rgba(255,255,255,0.5); margin-top: 1px">Your stuff · only you can see this</div>
      </div>
      <button type="button" style="padding: 6px; border-radius: 10px; background: transparent; border: 0; cursor: pointer; color: rgba(255,255,255,0.6)"><i class="ph ph-magnifying-glass" style="font-size: 16px"></i></button>
      <button type="button" class="mr-nav-icon-btn" aria-label="Settings" style="width: 32px; height: 32px"><i class="ph ph-gear" aria-hidden="true" style="font-size: 16px"></i></button>
    </div>

    <div style="padding: 6px 14px 16px">
      <div style="display: flex; gap: 6px; padding: 4px; border-radius: 12px; background: rgba(255,255,255,0.04); border: 1px solid rgba(255,255,255,0.06)">
        <button type="button" style="flex: 1; padding: 8px; border-radius: 8px; background: rgba(255,255,255,0.08); border: 0; color: var(--text); font-size: 0.74rem; font-weight: 800; cursor: pointer">All</button>
        <button type="button" style="flex: 1; padding: 8px; border-radius: 8px; background: transparent; border: 0; color: rgba(255,255,255,0.6); font-size: 0.74rem; font-weight: 700; cursor: pointer">Saved</button>
        <button type="button" style="flex: 1; padding: 8px; border-radius: 8px; background: transparent; border: 0; color: rgba(255,255,255,0.6); font-size: 0.74rem; font-weight: 700; cursor: pointer">Plans</button>
        <button type="button" style="flex: 1; padding: 8px; border-radius: 8px; background: transparent; border: 0; color: rgba(255,255,255,0.6); font-size: 0.74rem; font-weight: 700; cursor: pointer">Groups</button>
      </div>
    </div>

    <div style="padding: 0 14px 10px; display: flex; flex-direction: column; gap: 8px">
      <div style="border-radius: 16px; background: rgba(255,255,255,0.04); border: 1px solid rgba(255,255,255,0.07); overflow: hidden">
        <div style="padding: 14px; display: flex; align-items: center; gap: 12px">
          <span style="display: inline-flex; width: 36px; height: 36px; border-radius: 10px; background: rgba(255,107,139,0.18); align-items: center; justify-content: center"><i class="ph-fill ph-bookmark-simple" style="color: #ff6b8b; font-size: 16px"></i></span>
          <div style="flex: 1; min-width: 0">
            <div style="font-size: 0.92rem; font-weight: 800; color: var(--text)">Saved places</div>
            <div style="font-size: 0.7rem; color: rgba(255,255,255,0.55); margin-top: 1px">2 lists · 10 places</div>
          </div>
          <i class="ph ph-caret-up" style="color: rgba(255,255,255,0.5); font-size: 13px"></i>
        </div>
        <div style="padding: 0 14px 12px; display: flex; flex-direction: column; gap: 6px">
          <div style="display: flex; align-items: center; gap: 10px; padding: 8px 10px; border-radius: 10px; background: rgba(255,255,255,0.03)">
            <i class="ph-fill ph-heart" style="color: #ff6b8b; font-size: 14px"></i>
            <span style="flex: 1; font-size: 0.82rem; font-weight: 700; color: var(--text)">Favorites</span>
            <span style="font-size: 0.7rem; color: rgba(255,255,255,0.5)">7 · Private</span>
          </div>
          <div style="display: flex; align-items: center; gap: 10px; padding: 8px 10px; border-radius: 10px; background: rgba(255,255,255,0.03)">
            <i class="ph-fill ph-clipboard-text" style="color: #5ba5ff; font-size: 14px"></i>
            <span style="flex: 1; font-size: 0.82rem; font-weight: 700; color: var(--text)">Asheville</span>
            <span style="font-size: 0.7rem; color: rgba(255,255,255,0.5)">3 · Shared</span>
          </div>
          <button type="button" style="padding: 8px 10px; border-radius: 10px; background: transparent; border: 1px dashed rgba(255,255,255,0.14); color: rgba(255,255,255,0.55); font-size: 0.74rem; font-weight: 700; cursor: pointer; text-align: left">+ New list</button>
        </div>
      </div>

      <button type="button" style="display: flex; align-items: center; gap: 12px; padding: 14px; border-radius: 16px; background: rgba(255,255,255,0.04); border: 1px solid rgba(255,255,255,0.07); cursor: pointer; text-align: left">
        <span style="display: inline-flex; width: 36px; height: 36px; border-radius: 10px; background: rgba(32,224,207,0.18); align-items: center; justify-content: center"><i class="ph-fill ph-calendar-check" style="color: #20e0cf; font-size: 16px"></i></span>
        <div style="flex: 1; min-width: 0">
          <div style="font-size: 0.92rem; font-weight: 800; color: var(--text)">Plans</div>
          <div style="font-size: 0.7rem; color: rgba(255,255,255,0.55); margin-top: 1px">4 upcoming · next is Wes Parker, Apr 24</div>
        </div>
        <i class="ph ph-caret-down" style="color: rgba(255,255,255,0.5); font-size: 13px"></i>
      </button>

      <button type="button" style="display: flex; align-items: center; gap: 12px; padding: 14px; border-radius: 16px; background: rgba(255,255,255,0.04); border: 1px solid rgba(255,255,255,0.07); cursor: pointer; text-align: left">
        <span style="display: inline-flex; width: 36px; height: 36px; border-radius: 10px; background: rgba(156,77,255,0.18); align-items: center; justify-content: center"><i class="ph-fill ph-users-three" style="color: #9c4dff; font-size: 16px"></i></span>
        <div style="flex: 1; min-width: 0">
          <div style="font-size: 0.92rem; font-weight: 800; color: var(--text)">Groups</div>
          <div style="font-size: 0.7rem; color: rgba(255,255,255,0.55); margin-top: 1px">Hiking Crew, Concert Buds, Game Night</div>
        </div>
        <i class="ph ph-caret-down" style="color: rgba(255,255,255,0.5); font-size: 13px"></i>
      </button>

      <button type="button" style="display: flex; align-items: center; gap: 12px; padding: 14px; border-radius: 16px; background: rgba(255,255,255,0.04); border: 1px solid rgba(255,255,255,0.07); cursor: pointer; text-align: left">
        <span style="display: inline-flex; width: 36px; height: 36px; border-radius: 10px; background: rgba(245,196,81,0.18); align-items: center; justify-content: center"><i class="ph-fill ph-pencil-line" style="color: #f5c451; font-size: 16px"></i></span>
        <div style="flex: 1; min-width: 0">
          <div style="font-size: 0.92rem; font-weight: 800; color: var(--text)">Drafts</div>
          <div style="font-size: 0.7rem; color: rgba(255,255,255,0.55); margin-top: 1px">1 · Saturday brunch</div>
        </div>
        <span style="padding: 2px 7px; border-radius: 999px; background: rgba(245,196,81,0.18); color: #f5c451; font-size: 0.66rem; font-weight: 800">1</span>
      </button>

      <button type="button" style="display: flex; align-items: center; gap: 12px; padding: 14px; border-radius: 16px; background: rgba(255,255,255,0.04); border: 1px solid rgba(255,255,255,0.07); cursor: pointer; text-align: left">
        <span style="display: inline-flex; width: 36px; height: 36px; border-radius: 10px; background: rgba(91,165,255,0.18); align-items: center; justify-content: center"><i class="ph-fill ph-user-plus" style="color: #5ba5ff; font-size: 16px"></i></span>
        <div style="flex: 1; min-width: 0">
          <div style="font-size: 0.92rem; font-weight: 800; color: var(--text)">Friends</div>
          <div style="font-size: 0.7rem; color: rgba(255,255,255,0.55); margin-top: 1px">42 · 3 requests waiting</div>
        </div>
        <i class="ph ph-caret-down" style="color: rgba(255,255,255,0.5); font-size: 13px"></i>
      </button>
    </div>

    <div style="position: fixed; left: 0; right: 0; bottom: 0; padding: 10px 8px 14px; background: linear-gradient(180deg, transparent, var(--bg-0) 35%)">
      <div class="mr-tab-bar" style="margin: 0 8px">
        <button type="button" class="mr-tab-item" aria-label="Plans"><i class="ph ph-calendar-blank" aria-hidden="true"></i></button>
        <button type="button" class="mr-tab-item" aria-label="Explore"><i class="ph ph-compass" aria-hidden="true"></i></button>
        <button type="button" class="mr-tab-item mr-tab-create" aria-label="Create"><i class="ph ph-plus-circle" aria-hidden="true"></i></button>
        <button type="button" class="mr-tab-item mr-tab-active" aria-label="You"><i class="ph-fill ph-user" aria-hidden="true"></i></button>
        <button type="button" class="mr-tab-item" aria-label="Chat"><i class="ph ph-chat-teardrop-text" aria-hidden="true"></i></button>
      </div>
    </div>
  </div>
</div>
