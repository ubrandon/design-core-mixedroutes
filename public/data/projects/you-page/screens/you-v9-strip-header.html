<link rel="stylesheet" href="../../../../styles/shared.css" />
<link rel="stylesheet" href="../../../../styles/ds.css" />
<link rel="stylesheet" href="../../../../data/design-system/company.css" />

<div style="background: var(--bg-0); overflow-x: clip; min-height: 100vh">
  <div class="mr-scope" style="padding-bottom: 88px">
    <div style="display: flex; align-items: center; gap: 10px; padding: 12px 14px 10px">
      <img src="https://i.pravatar.cc/72?img=11" alt="" style="width: 32px; height: 32px; border-radius: 50%; object-fit: cover; border: 1.5px solid rgba(255,255,255,0.12); flex: 0 0 auto" />
      <div style="flex: 1; min-width: 0; line-height: 1.1">
        <div style="font-size: 0.92rem; font-weight: 800; color: var(--text)">Brandon</div>
        <div style="font-size: 0.66rem; color: rgba(255,255,255,0.45); font-weight: 700; margin-top: 1px">@brandon</div>
      </div>
      <button type="button" style="padding: 5px 10px; border-radius: 999px; background: rgba(255,255,255,0.06); border: 1px solid rgba(255,255,255,0.1); color: rgba(255,255,255,0.75); font-size: 0.68rem; font-weight: 800; cursor: pointer; display: inline-flex; align-items: center; gap: 4px">
        <i class="ph ph-eye" style="font-size: 11px"></i> View as
      </button>
      <button type="button" class="mr-nav-icon-btn" aria-label="Settings" style="width: 32px; height: 32px"><i class="ph ph-gear" aria-hidden="true" style="font-size: 16px"></i></button>
    </div>

    <div style="height: 1px; background: rgba(255,255,255,0.06); margin: 0 14px"></div>

    <div style="padding: 18px 16px 6px">
      <div style="font-size: 0.68rem; color: rgba(255,255,255,0.45); font-weight: 800; letter-spacing: 0.1em; text-transform: uppercase; margin-bottom: 4px">Today, you have</div>
      <div style="font-size: 1.55rem; font-weight: 800; color: var(--text); line-height: 1.15">3 things waiting<br/>and 1 draft to finish</div>
    </div>

    <div style="padding: 14px 16px 16px; display: flex; flex-direction: column; gap: 10px">
      <div style="display: flex; gap: 12px; padding: 14px; border-radius: 16px; background: rgba(245,196,81,0.08); border: 1px solid rgba(245,196,81,0.2); align-items: center">
        <i class="ph-fill ph-pencil-line" style="color: #f5c451; font-size: 22px"></i>
        <div style="flex: 1; min-width: 0">
          <div style="font-size: 0.92rem; font-weight: 800; color: var(--text)">Saturday brunch</div>
          <div style="font-size: 0.74rem; color: rgba(255,255,255,0.6); margin-top: 2px">Draft from 2 days ago · 3 of 5 invited</div>
        </div>
        <button type="button" style="padding: 8px 14px; border-radius: 999px; background: #f5c451; border: 0; color: #15263a; font-weight: 800; font-size: 0.76rem; cursor: pointer">Open</button>
      </div>
      <div style="display: flex; gap: 12px; padding: 14px; border-radius: 16px; background: rgba(91,165,255,0.08); border: 1px solid rgba(91,165,255,0.2); align-items: center">
        <i class="ph-fill ph-question" style="color: #5ba5ff; font-size: 22px"></i>
        <div style="flex: 1; min-width: 0">
          <div style="font-size: 0.92rem; font-weight: 800; color: var(--text)">RSVP to Jazz Night</div>
          <div style="font-size: 0.74rem; color: rgba(255,255,255,0.6); margin-top: 2px">Mike invited you · Thu 8 PM</div>
        </div>
      </div>
    </div>

    <div style="padding: 4px 16px 8px; display: flex; align-items: baseline; justify-content: space-between">
      <div style="font-size: 1rem; font-weight: 800; color: var(--text)">Your stuff</div>
      <div style="font-size: 0.7rem; color: rgba(255,255,255,0.5); font-weight: 700">Tap any to dig in</div>
    </div>
    <div style="padding: 0 16px 14px">
      <div style="display: flex; flex-direction: column; gap: 1px; border-radius: 16px; overflow: hidden; background: rgba(255,255,255,0.06)">
        <button type="button" style="display: flex; align-items: center; gap: 12px; padding: 14px; background: var(--bg-0); border: 0; cursor: pointer; text-align: left">
          <span style="display: inline-flex; width: 32px; height: 32px; border-radius: 10px; background: rgba(255,107,139,0.18); align-items: center; justify-content: center"><i class="ph-fill ph-bookmark-simple" style="color: #ff6b8b; font-size: 16px"></i></span>
          <span style="flex: 1; font-size: 0.9rem; font-weight: 800; color: var(--text)">Saved places</span>
          <span style="font-size: 0.74rem; color: rgba(255,255,255,0.5); font-weight: 700">2 lists · 10</span>
          <i class="ph ph-caret-right" style="color: rgba(255,255,255,0.4); font-size: 12px"></i>
        </button>
        <button type="button" style="display: flex; align-items: center; gap: 12px; padding: 14px; background: var(--bg-0); border: 0; cursor: pointer; text-align: left">
          <span style="display: inline-flex; width: 32px; height: 32px; border-radius: 10px; background: rgba(156,77,255,0.18); align-items: center; justify-content: center"><i class="ph-fill ph-users-three" style="color: #9c4dff; font-size: 16px"></i></span>
          <span style="flex: 1; font-size: 0.9rem; font-weight: 800; color: var(--text)">Groups</span>
          <span style="font-size: 0.74rem; color: rgba(255,255,255,0.5); font-weight: 700">3</span>
          <i class="ph ph-caret-right" style="color: rgba(255,255,255,0.4); font-size: 12px"></i>
        </button>
        <button type="button" style="display: flex; align-items: center; gap: 12px; padding: 14px; background: var(--bg-0); border: 0; cursor: pointer; text-align: left">
          <span style="display: inline-flex; width: 32px; height: 32px; border-radius: 10px; background: rgba(32,224,207,0.18); align-items: center; justify-content: center"><i class="ph-fill ph-calendar-check" style="color: #20e0cf; font-size: 16px"></i></span>
          <span style="flex: 1; font-size: 0.9rem; font-weight: 800; color: var(--text)">Plans</span>
          <span style="font-size: 0.74rem; color: rgba(255,255,255,0.5); font-weight: 700">4 upcoming</span>
          <i class="ph ph-caret-right" style="color: rgba(255,255,255,0.4); font-size: 12px"></i>
        </button>
        <button type="button" style="display: flex; align-items: center; gap: 12px; padding: 14px; background: var(--bg-0); border: 0; cursor: pointer; text-align: left">
          <span style="display: inline-flex; width: 32px; height: 32px; border-radius: 10px; background: rgba(245,196,81,0.18); align-items: center; justify-content: center"><i class="ph-fill ph-tag" style="color: #f5c451; font-size: 16px"></i></span>
          <span style="flex: 1; font-size: 0.9rem; font-weight: 800; color: var(--text)">Interests</span>
          <span style="font-size: 0.74rem; color: rgba(255,255,255,0.5); font-weight: 700">3</span>
          <i class="ph ph-caret-right" style="color: rgba(255,255,255,0.4); font-size: 12px"></i>
        </button>
      </div>
    </div>

    <div style="position: fixed; left: 0; right: 0; bottom: 0; padding: 10px 8px 14px; background: linear-gradient(180deg, transparent, var(--bg-0) 35%)">
      <div class="mr-tab-bar" style="margin: 0 8px">
        <button type="button" class="mr-tab-item" aria-label="Plans"><i class="ph ph-calendar-blank" aria-hidden="true"></i></button>
        <button type="button" class="mr-tab-item" aria-label="Explore"><i class="ph ph-compass" aria-hidden="true"></i></button>
        <button type="button" class="mr-tab-item mr-tab-create" aria-label="Create"><i class="ph ph-plus-circle" aria-hidden="true"></i></button>
        <button type="button" class="mr-tab-item mr-tab-active" aria-label="You"><i class="ph-fill ph-user" aria-hidden="true"></i></button>
        <button type="button" class="mr-tab-item" aria-label="Chat"><i class="ph ph-chat-teardrop-text" aria-hidden="true"></i></button>
      </div>
    </div>
  </div>
</div>
