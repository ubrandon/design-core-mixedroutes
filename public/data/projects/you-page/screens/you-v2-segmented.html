<link rel="stylesheet" href="../../../../styles/shared.css" />
<link rel="stylesheet" href="../../../../styles/ds.css" />
<link rel="stylesheet" href="../../../../data/design-system/company.css" />

<div style="background: var(--bg-0); overflow-x: clip; min-height: 100vh">
  <div class="mr-scope" style="padding-bottom: 88px">
    <header style="display: flex; align-items: center; justify-content: space-between; padding: 16px 16px 8px">
      <span style="font-size: 1.25rem; font-weight: 800; color: var(--text)">You</span>
      <div style="display: flex; gap: 8px">
        <button type="button" class="mr-nav-icon-btn" aria-label="Notifications"><i class="ph ph-bell" aria-hidden="true"></i></button>
        <button type="button" class="mr-nav-icon-btn" aria-label="Settings"><i class="ph ph-gear" aria-hidden="true"></i></button>
      </div>
    </header>

    <div style="padding: 4px 16px 14px">
      <div style="display: flex; padding: 4px; border-radius: 14px; background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.06)">
        <button type="button" style="flex: 1; padding: 10px; border-radius: 10px; background: rgba(245,196,81,0.18); border: 0; color: var(--text); font-weight: 800; font-size: 0.85rem; cursor: pointer; display: inline-flex; align-items: center; justify-content: center; gap: 6px">
          <i class="ph-fill ph-house" style="font-size: 14px; color: #f5c451"></i> Your stuff
        </button>
        <button type="button" style="flex: 1; padding: 10px; border-radius: 10px; background: transparent; border: 0; color: rgba(255,255,255,0.6); font-weight: 700; font-size: 0.85rem; cursor: pointer; display: inline-flex; align-items: center; justify-content: center; gap: 6px">
          <i class="ph ph-user-circle" style="font-size: 14px"></i> Profile
        </button>
      </div>
    </div>

    <div style="padding: 0 16px 14px">
      <div style="padding: 14px; border-radius: 16px; background: linear-gradient(135deg, rgba(91,165,255,0.16), rgba(32,224,207,0.08)); border: 1px solid rgba(91,165,255,0.18)">
        <div style="display: flex; align-items: center; gap: 12px">
          <img src="https://i.pravatar.cc/72?img=11" alt="" style="width: 48px; height: 48px; border-radius: 50%; border: 2px solid rgba(255,255,255,0.18); object-fit: cover" />
          <div style="flex: 1; min-width: 0">
            <div style="font-size: 1rem; font-weight: 800; color: var(--text)">Brandon</div>
            <div style="font-size: 0.76rem; color: rgba(255,255,255,0.6)">Your stuff is private by default</div>
          </div>
          <button type="button" style="padding: 8px 12px; border-radius: 999px; background: rgba(255,255,255,0.12); border: 1px solid rgba(255,255,255,0.18); color: var(--text); font-weight: 800; font-size: 0.74rem; cursor: pointer">Preview</button>
        </div>
      </div>
    </div>

    <div style="padding: 6px 16px 14px">
      <div style="display: flex; align-items: center; justify-content: space-between; padding-bottom: 10px">
        <span style="font-size: 1.05rem; font-weight: 800; color: var(--text)">Lists</span>
        <button type="button" style="font-size: 0.74rem; color: #f5c451; background: transparent; border: 0; font-weight: 800; letter-spacing: 0.06em; text-transform: uppercase; cursor: pointer">New</button>
      </div>
      <div class="ds-scroll-x" style="display: flex; gap: 10px">
        <div style="flex: 0 0 auto; width: 156px; padding: 14px; border-radius: 18px; background: linear-gradient(180deg, rgba(255,107,139,0.16), rgba(255,107,139,0.04)); border: 1px solid rgba(255,107,139,0.25)">
          <div style="width: 40px; height: 40px; border-radius: 12px; background: rgba(255,107,139,0.22); display: flex; align-items: center; justify-content: center; margin-bottom: 10px">
            <i class="ph-fill ph-heart" style="color: #ff6b8b; font-size: 20px"></i>
          </div>
          <div style="font-size: 0.95rem; font-weight: 800; color: var(--text)">Favorites</div>
          <div style="font-size: 0.74rem; color: rgba(255,255,255,0.6)">7 places · Private</div>
        </div>
        <div style="flex: 0 0 auto; width: 156px; padding: 14px; border-radius: 18px; background: linear-gradient(180deg, rgba(91,165,255,0.16), rgba(91,165,255,0.04)); border: 1px solid rgba(91,165,255,0.25)">
          <div style="width: 40px; height: 40px; border-radius: 12px; background: rgba(91,165,255,0.22); display: flex; align-items: center; justify-content: center; margin-bottom: 10px">
            <i class="ph-fill ph-clipboard-text" style="color: #5ba5ff; font-size: 20px"></i>
          </div>
          <div style="font-size: 0.95rem; font-weight: 800; color: var(--text)">Asheville</div>
          <div style="font-size: 0.74rem; color: rgba(255,255,255,0.6)">3 places · Shared</div>
        </div>
      </div>
    </div>

    <div style="padding: 6px 16px 14px">
      <div style="display: flex; align-items: center; justify-content: space-between; padding-bottom: 10px">
        <span style="font-size: 1.05rem; font-weight: 800; color: var(--text)">Groups</span>
        <button type="button" style="font-size: 0.74rem; color: #f5c451; background: transparent; border: 0; font-weight: 800; letter-spacing: 0.06em; text-transform: uppercase; cursor: pointer">New</button>
      </div>
      <div class="ds-scroll-x" style="display: flex; gap: 10px">
        <div style="flex: 0 0 auto; width: 130px; padding: 12px; border-radius: 16px; background: rgba(255,255,255,0.04); border: 1px solid rgba(255,255,255,0.06); text-align: center">
          <img src="https://images.unsplash.com/photo-1551632811-561732d1e306?w=160&q=70" alt="" style="width: 56px; height: 56px; border-radius: 50%; object-fit: cover; border: 2px solid rgba(255,255,255,0.12); margin-bottom: 8px" />
          <div style="font-size: 0.85rem; font-weight: 800; color: var(--text)">Hiking Crew</div>
          <div style="font-size: 0.7rem; color: rgba(255,255,255,0.55)">12 members</div>
        </div>
        <div style="flex: 0 0 auto; width: 130px; padding: 12px; border-radius: 16px; background: rgba(255,255,255,0.04); border: 1px solid rgba(255,255,255,0.06); text-align: center">
          <img src="https://images.unsplash.com/photo-1506157786151-b8491531f063?w=160&q=70" alt="" style="width: 56px; height: 56px; border-radius: 50%; object-fit: cover; border: 2px solid rgba(255,255,255,0.12); margin-bottom: 8px" />
          <div style="font-size: 0.85rem; font-weight: 800; color: var(--text)">Concert Buds</div>
          <div style="font-size: 0.7rem; color: rgba(255,255,255,0.55)">6 members</div>
        </div>
      </div>
    </div>

    <div style="padding: 6px 16px 14px">
      <div style="display: flex; align-items: center; justify-content: space-between; padding-bottom: 10px">
        <span style="font-size: 1.05rem; font-weight: 800; color: var(--text)">Plans</span>
        <span style="font-size: 0.74rem; color: rgba(255,255,255,0.55)">4 upcoming</span>
      </div>
      <div style="display: flex; flex-direction: column; gap: 8px">
        <div style="display: flex; gap: 12px; padding: 12px; border-radius: 14px; background: rgba(255,255,255,0.04); border: 1px solid rgba(255,255,255,0.06)">
          <div style="width: 44px; height: 44px; border-radius: 10px; background: rgba(245,196,81,0.18); display: flex; flex-direction: column; align-items: center; justify-content: center; flex: 0 0 auto">
            <span style="font-size: 0.6rem; color: #f5c451; font-weight: 800; letter-spacing: 0.06em; text-transform: uppercase">Apr</span>
            <span style="font-size: 1rem; color: var(--text); font-weight: 800; line-height: 1">24</span>
          </div>
          <div style="flex: 1; min-width: 0">
            <div style="font-size: 0.9rem; font-weight: 800; color: var(--text)">Wes Parker show</div>
            <div style="font-size: 0.74rem; color: rgba(255,255,255,0.55)">Static Age Records · 2 PM</div>
          </div>
        </div>
        <div style="display: flex; gap: 12px; padding: 12px; border-radius: 14px; background: rgba(255,255,255,0.04); border: 1px solid rgba(255,255,255,0.06)">
          <div style="width: 44px; height: 44px; border-radius: 10px; background: rgba(91,165,255,0.18); display: flex; flex-direction: column; align-items: center; justify-content: center; flex: 0 0 auto">
            <span style="font-size: 0.6rem; color: #5ba5ff; font-weight: 800; letter-spacing: 0.06em; text-transform: uppercase">May</span>
            <span style="font-size: 1rem; color: var(--text); font-weight: 800; line-height: 1">02</span>
          </div>
          <div style="flex: 1; min-width: 0">
            <div style="font-size: 0.9rem; font-weight: 800; color: var(--text)">Sunrise hike</div>
            <div style="font-size: 0.74rem; color: rgba(255,255,255,0.55)">Craggy Pinnacle · 7 AM</div>
          </div>
        </div>
      </div>
    </div>

    <div style="position: fixed; left: 0; right: 0; bottom: 0; padding: 10px 8px 14px; background: linear-gradient(180deg, transparent, var(--bg-0) 35%)">
      <div class="mr-tab-bar" style="margin: 0 8px">
        <button type="button" class="mr-tab-item" aria-label="Plans"><i class="ph ph-calendar-blank" aria-hidden="true"></i></button>
        <button type="button" class="mr-tab-item" aria-label="Explore"><i class="ph ph-compass" aria-hidden="true"></i></button>
        <button type="button" class="mr-tab-item mr-tab-create" aria-label="Create"><i class="ph ph-plus-circle" aria-hidden="true"></i></button>
        <button type="button" class="mr-tab-item mr-tab-active" aria-label="You"><i class="ph-fill ph-user" aria-hidden="true"></i></button>
        <button type="button" class="mr-tab-item" aria-label="Chat"><i class="ph ph-chat-teardrop-text" aria-hidden="true"></i></button>
      </div>
    </div>
  </div>
</div>
