<link rel="stylesheet" href="../../../../styles/shared.css" />
<link rel="stylesheet" href="../../../../styles/ds.css" />
<link rel="stylesheet" href="../../../../data/design-system/company.css" />

<div style="background: var(--bg-0); overflow-x: clip; min-height: 100vh">
  <div class="mr-scope" style="padding-bottom: 24px">
    <div style="position: sticky; top: 0; z-index: 5; padding: 10px 14px; display: flex; align-items: center; justify-content: space-between; background: linear-gradient(180deg, rgba(91,165,255,0.18), rgba(91,165,255,0.08)); border-bottom: 1px solid rgba(91,165,255,0.24); backdrop-filter: blur(12px)">
      <div style="display: inline-flex; align-items: center; gap: 8px">
        <i class="ph-fill ph-globe" style="color: #5ba5ff; font-size: 14px"></i>
        <span style="font-size: 0.78rem; color: var(--text); font-weight: 800">Previewing as someone not your friend</span>
      </div>
      <button type="button" style="padding: 6px 12px; border-radius: 999px; background: rgba(0,0,0,0.35); border: 1px solid rgba(255,255,255,0.18); color: var(--text); font-weight: 800; font-size: 0.74rem; cursor: pointer">Exit</button>
    </div>

    <div style="position: relative; padding: 18px 14px 20px; display: flex; flex-direction: column; align-items: center; background: radial-gradient(ellipse at top, rgba(91,165,255,0.14), transparent 70%)">
      <div style="position: absolute; top: 18px; left: 14px">
        <button type="button" class="mr-nav-icon-btn" aria-label="Back"><i class="ph ph-arrow-left" aria-hidden="true"></i></button>
      </div>
      <div style="position: absolute; top: 18px; right: 14px">
        <button type="button" class="mr-nav-icon-btn" aria-label="More"><i class="ph ph-dots-three-vertical" aria-hidden="true"></i></button>
      </div>

      <img src="https://i.pravatar.cc/200?img=11" alt="" style="width: 110px; height: 110px; border-radius: 50%; object-fit: cover; margin-top: 28px; border: 2px solid rgba(255,255,255,0.08)" />
      <h1 style="font-size: 1.45rem; font-weight: 800; color: var(--text); margin: 14px 0 4px">Brandon Unglaub</h1>
      <div style="font-size: 0.82rem; color: rgba(255,255,255,0.55)">@brandon</div>

      <div style="display: flex; gap: 10px; margin-top: 16px">
        <button type="button" class="btn btn-primary" style="padding: 10px 18px; border-radius: 999px; display: inline-flex; align-items: center; gap: 8px"><i class="ph-fill ph-user-plus" style="font-size: 14px"></i> Add friend</button>
      </div>
    </div>

    <div style="padding: 14px 16px 8px">
      <div style="font-size: 0.95rem; font-weight: 800; color: var(--text)">Interests</div>
    </div>
    <div style="padding: 8px 16px 14px; display: flex; gap: 8px; flex-wrap: wrap">
      <span style="display: inline-flex; align-items: center; gap: 5px; padding: 7px 14px; border-radius: 999px; background: rgba(255,255,255,0.06); border: 1px solid rgba(255,255,255,0.1); color: var(--text); font-weight: 700; font-size: 0.82rem">
        <i class="ph-fill ph-barbell" style="color: rgba(255,255,255,0.7); font-size: 12px"></i> Weightlifting
      </span>
      <span style="display: inline-flex; align-items: center; gap: 5px; padding: 7px 14px; border-radius: 999px; background: rgba(255,255,255,0.06); border: 1px solid rgba(255,255,255,0.1); color: var(--text); font-weight: 700; font-size: 0.82rem">
        <i class="ph-fill ph-storefront" style="color: rgba(255,255,255,0.7); font-size: 12px"></i> Flea Markets
      </span>
      <span style="display: inline-flex; align-items: center; gap: 5px; padding: 7px 14px; border-radius: 999px; background: rgba(255,255,255,0.06); border: 1px solid rgba(255,255,255,0.1); color: var(--text); font-weight: 700; font-size: 0.82rem">
        <i class="ph-fill ph-cake" style="color: rgba(255,255,255,0.7); font-size: 12px"></i> Baking
      </span>
    </div>

    <div style="padding: 0 16px 18px; display: flex; flex-direction: column; gap: 12px">
      <div style="padding: 18px; border-radius: 16px; background: rgba(255,255,255,0.03); border: 1px dashed rgba(255,255,255,0.12); display: flex; gap: 12px; align-items: center">
        <i class="ph ph-lock-key" style="color: rgba(255,255,255,0.45); font-size: 20px"></i>
        <div style="flex: 1; min-width: 0">
          <div style="font-size: 0.84rem; font-weight: 800; color: rgba(255,255,255,0.85)">Saved places are hidden</div>
          <div style="font-size: 0.74rem; color: rgba(255,255,255,0.5); margin-top: 2px">Only friends can see Brandon’s lists</div>
        </div>
      </div>
      <div style="padding: 18px; border-radius: 16px; background: rgba(255,255,255,0.03); border: 1px dashed rgba(255,255,255,0.12); display: flex; gap: 12px; align-items: center">
        <i class="ph ph-lock-key" style="color: rgba(255,255,255,0.45); font-size: 20px"></i>
        <div style="flex: 1; min-width: 0">
          <div style="font-size: 0.84rem; font-weight: 800; color: rgba(255,255,255,0.85)">Plans are hidden</div>
          <div style="font-size: 0.74rem; color: rgba(255,255,255,0.5); margin-top: 2px">Only friends can see what Brandon’s up to</div>
        </div>
      </div>
      <div style="padding: 18px; border-radius: 16px; background: rgba(255,255,255,0.03); border: 1px dashed rgba(255,255,255,0.12); display: flex; gap: 12px; align-items: center">
        <i class="ph ph-lock-key" style="color: rgba(255,255,255,0.45); font-size: 20px"></i>
        <div style="flex: 1; min-width: 0">
          <div style="font-size: 0.84rem; font-weight: 800; color: rgba(255,255,255,0.85)">Groups are hidden</div>
          <div style="font-size: 0.74rem; color: rgba(255,255,255,0.5); margin-top: 2px">Add Brandon as a friend to see shared groups</div>
        </div>
      </div>
    </div>
  </div>
</div>
