<link rel="stylesheet" href="../../../../styles/shared.css" />
<link rel="stylesheet" href="../../../../styles/ds.css" />
<link rel="stylesheet" href="../../../../data/design-system/company.css" />

<div style="background: var(--bg-0); overflow-x: clip; min-height: 100vh">
  <div class="mr-scope" style="padding-bottom: 88px">
    <div style="position: sticky; top: 0; z-index: 5; background: var(--bg-0); padding: 14px 14px 8px; border-bottom: 1px solid rgba(255,255,255,0.05)">
      <div style="display: flex; align-items: center; gap: 10px; margin-bottom: 12px">
        <img src="https://i.pravatar.cc/72?img=11" alt="" style="width: 30px; height: 30px; border-radius: 50%; object-fit: cover" />
        <span style="font-size: 0.92rem; font-weight: 800; color: var(--text)">Brandon</span>
        <span style="font-size: 0.66rem; color: rgba(255,255,255,0.4); font-weight: 700; padding: 2px 6px; border-radius: 6px; background: rgba(255,255,255,0.04); border: 1px solid rgba(255,255,255,0.06)">@brandon</span>
        <div style="flex: 1"></div>
        <button type="button" class="mr-nav-icon-btn" aria-label="Settings" style="width: 30px; height: 30px"><i class="ph ph-gear" aria-hidden="true" style="font-size: 15px"></i></button>
      </div>
      <div style="display: flex; gap: 6px; overflow-x: auto" class="ds-scroll-x">
        <button type="button" style="flex: 0 0 auto; display: inline-flex; align-items: center; gap: 6px; padding: 8px 14px; border-radius: 999px; background: var(--text); border: 0; color: var(--bg-0); font-weight: 800; font-size: 0.78rem; cursor: pointer">
          <i class="ph-fill ph-house" style="font-size: 12px"></i> Home
        </button>
        <button type="button" style="flex: 0 0 auto; display: inline-flex; align-items: center; gap: 6px; padding: 8px 14px; border-radius: 999px; background: rgba(255,255,255,0.06); border: 1px solid rgba(255,255,255,0.08); color: rgba(255,255,255,0.75); font-weight: 700; font-size: 0.78rem; cursor: pointer">
          <i class="ph-fill ph-bookmark-simple" style="font-size: 12px"></i> Saved <span style="opacity: 0.5">10</span>
        </button>
        <button type="button" style="flex: 0 0 auto; display: inline-flex; align-items: center; gap: 6px; padding: 8px 14px; border-radius: 999px; background: rgba(255,255,255,0.06); border: 1px solid rgba(255,255,255,0.08); color: rgba(255,255,255,0.75); font-weight: 700; font-size: 0.78rem; cursor: pointer">
          <i class="ph-fill ph-calendar-check" style="font-size: 12px"></i> Plans <span style="opacity: 0.5">4</span>
        </button>
        <button type="button" style="flex: 0 0 auto; display: inline-flex; align-items: center; gap: 6px; padding: 8px 14px; border-radius: 999px; background: rgba(255,255,255,0.06); border: 1px solid rgba(255,255,255,0.08); color: rgba(255,255,255,0.75); font-weight: 700; font-size: 0.78rem; cursor: pointer">
          <i class="ph-fill ph-users-three" style="font-size: 12px"></i> Groups <span style="opacity: 0.5">3</span>
        </button>
        <button type="button" style="flex: 0 0 auto; display: inline-flex; align-items: center; gap: 6px; padding: 8px 14px; border-radius: 999px; background: rgba(255,255,255,0.06); border: 1px solid rgba(255,255,255,0.08); color: rgba(255,255,255,0.75); font-weight: 700; font-size: 0.78rem; cursor: pointer">
          <i class="ph-fill ph-user-circle" style="font-size: 12px"></i> Profile
        </button>
      </div>
    </div>

    <div style="padding: 14px 14px 12px">
      <div style="font-size: 1.45rem; font-weight: 800; color: var(--text); line-height: 1.15">Hey Brandon —<br/><span style="color: rgba(255,255,255,0.55); font-weight: 800">here’s your stuff.</span></div>
    </div>

    <div style="padding: 0 14px 14px; display: flex; flex-direction: column; gap: 10px">
      <div style="padding: 14px; border-radius: 16px; background: linear-gradient(135deg, rgba(245,196,81,0.18), rgba(245,196,81,0.04)); border: 1px solid rgba(245,196,81,0.22)">
        <div style="font-size: 0.66rem; color: #f5c451; font-weight: 800; letter-spacing: 0.08em; text-transform: uppercase; margin-bottom: 6px">Pinned · finish later</div>
        <div style="font-size: 1rem; font-weight: 800; color: var(--text); margin-bottom: 4px">Saturday brunch draft</div>
        <div style="font-size: 0.74rem; color: rgba(255,255,255,0.65)">3 of 5 friends invited · started Tuesday</div>
      </div>

      <div style="padding: 14px; border-radius: 16px; background: rgba(255,255,255,0.04); border: 1px solid rgba(255,255,255,0.07)">
        <div style="display: flex; align-items: center; gap: 10px; margin-bottom: 12px">
          <i class="ph-fill ph-bookmark-simple" style="color: #ff6b8b; font-size: 16px"></i>
          <div style="font-size: 0.95rem; font-weight: 800; color: var(--text); flex: 1">Saved places</div>
          <button type="button" style="font-size: 0.7rem; color: rgba(255,255,255,0.5); background: transparent; border: 0; font-weight: 700; cursor: pointer">See all</button>
        </div>
        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 8px">
          <div style="padding: 10px 12px; border-radius: 12px; background: rgba(255,107,139,0.1); border: 1px solid rgba(255,107,139,0.18)">
            <div style="font-size: 0.82rem; font-weight: 800; color: var(--text)">Favorites</div>
            <div style="font-size: 0.66rem; color: rgba(255,255,255,0.55); margin-top: 2px">7 · Private</div>
          </div>
          <div style="padding: 10px 12px; border-radius: 12px; background: rgba(91,165,255,0.1); border: 1px solid rgba(91,165,255,0.18)">
            <div style="font-size: 0.82rem; font-weight: 800; color: var(--text)">Asheville</div>
            <div style="font-size: 0.66rem; color: rgba(255,255,255,0.55); margin-top: 2px">3 · Shared</div>
          </div>
        </div>
      </div>

      <div style="padding: 14px; border-radius: 16px; background: rgba(255,255,255,0.04); border: 1px solid rgba(255,255,255,0.07)">
        <div style="display: flex; align-items: center; gap: 10px; margin-bottom: 12px">
          <i class="ph-fill ph-calendar-check" style="color: #20e0cf; font-size: 16px"></i>
          <div style="font-size: 0.95rem; font-weight: 800; color: var(--text); flex: 1">Plans</div>
          <button type="button" style="font-size: 0.7rem; color: rgba(255,255,255,0.5); background: transparent; border: 0; font-weight: 700; cursor: pointer">See all</button>
        </div>
        <div style="display: flex; align-items: center; gap: 10px; padding: 10px 12px; border-radius: 12px; background: rgba(255,255,255,0.03)">
          <div style="width: 36px; height: 36px; border-radius: 9px; background: rgba(32,224,207,0.18); display: flex; flex-direction: column; align-items: center; justify-content: center">
            <span style="font-size: 0.5rem; color: #20e0cf; font-weight: 800; letter-spacing: 0.06em; text-transform: uppercase; line-height: 1">Apr</span>
            <span style="font-size: 0.88rem; color: var(--text); font-weight: 800; line-height: 1; margin-top: 1px">24</span>
          </div>
          <div style="flex: 1; min-width: 0">
            <div style="font-size: 0.84rem; font-weight: 800; color: var(--text)">Wes Parker show</div>
            <div style="font-size: 0.68rem; color: rgba(255,255,255,0.55); margin-top: 1px">Static Age Records</div>
          </div>
        </div>
      </div>
    </div>

    <div style="position: fixed; left: 0; right: 0; bottom: 0; padding: 10px 8px 14px; background: linear-gradient(180deg, transparent, var(--bg-0) 35%)">
      <div class="mr-tab-bar" style="margin: 0 8px">
        <button type="button" class="mr-tab-item" aria-label="Plans"><i class="ph ph-calendar-blank" aria-hidden="true"></i></button>
        <button type="button" class="mr-tab-item" aria-label="Explore"><i class="ph ph-compass" aria-hidden="true"></i></button>
        <button type="button" class="mr-tab-item mr-tab-create" aria-label="Create"><i class="ph ph-plus-circle" aria-hidden="true"></i></button>
        <button type="button" class="mr-tab-item mr-tab-active" aria-label="You"><i class="ph-fill ph-user" aria-hidden="true"></i></button>
        <button type="button" class="mr-tab-item" aria-label="Chat"><i class="ph ph-chat-teardrop-text" aria-hidden="true"></i></button>
      </div>
    </div>
  </div>
</div>
