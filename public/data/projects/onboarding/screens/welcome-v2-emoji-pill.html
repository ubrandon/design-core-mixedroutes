<style>
  .wpp-stage { display: block; position: relative; height: 52px; width: 100%; margin-top: 4px; }
  .wpp-line { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; gap: 10px; opacity: 0; animation: wpp-swap 10s ease-in-out infinite; }
  .wpp-line:nth-child(2) { animation-delay: 2.5s; }
  .wpp-line:nth-child(3) { animation-delay: 5s; }
  .wpp-line:nth-child(4) { animation-delay: 7.5s; }
  .wpp-pill { display: inline-flex; align-items: center; gap: 8px; padding: 6px 16px; border-radius: 999px; font-size: 22px; font-weight: 700; color: #ffffff; box-shadow: 0 4px 14px rgba(0,0,0,0.3); }
  @keyframes wpp-swap {
    0% { opacity: 0; transform: scale(0.85) translateY(10px); }
    5%, 21% { opacity: 1; transform: scale(1) translateY(0); }
    26%, 100% { opacity: 0; transform: scale(0.9) translateY(-10px); }
  }
</style>

      <img src="../img/white-logo.svg" alt="MixedRoutes" style="height: 88px; width: auto; filter: drop-shadow(0 2px 8px rgba(0,0,0,0.55)); margin-bottom: 8px;" />
      <h1 style="margin: 0; font-size: 32px; font-weight: 700; letter-spacing: 0.02em; line-height: 1.25; color: #ffffff; width: 100%;">
        Less &ldquo;someday.&rdquo; More

          <span class="wpp-line"><span class="wpp-pill" style="background: #7c3aed;"><span>&#127922;</span> game nights</span></span>
        </span>
      </h1>
      <div style="font-size: 16px; color: rgba(255,255,255,0.85); max-width: 300px; line-height: 1.3; margin-top: 6px;">Plans that actually happen.</div>
    </div>

    <div style="display: flex; flex-direction: column; gap: 11px; width: 100%; max-width: 300px;">
      <div style="display: flex; align-items: center; justify-content: center; gap: 11px; height: 52px; background: #ffffff; border-radius: 999px; color: #1a2332; font-size: 17px; font-weight: 700;">
        <img src="../img/apple-logo.png" alt="" style="width: 22px; height: 22px;" />
        Continue with Apple

        Continue with Google
