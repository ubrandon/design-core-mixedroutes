<link rel="stylesheet" href="../../../../styles/shared.css" />
<link rel="stylesheet" href="../../../../styles/ds.css" />
<link rel="stylesheet" href="../../../../data/design-system/company.css" />
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&display=swap" rel="stylesheet" />
<div style="background: #f2f2f7; height: 844px; display: flex; flex-direction: column; font-family: 'Geist', sans-serif; color: #1a2332; overflow: hidden;">

  <div style="display: flex; align-items: center; justify-content: space-between; height: 56px; padding: 0 16px; flex-shrink: 0;">
    <i class="ph ph-arrow-left" style="font-size: 24px; color: #1a2332;"></i>
    <div style="font-size: 17px; font-weight: 700;">Sign Up</div>
    <div style="width: 24px;"></div>
  </div>

  <div style="flex: 1; overflow: hidden; padding: 12px 16px 0;">
    <h1 style="margin: 0 0 5px; font-size: 36px; font-weight: 700; line-height: 1.15;">Sign up with email</h1>
    <div style="font-size: 16px; color: #5c6b7d; margin-bottom: 28px;">You'll verify this email in the next step.</div>

    <div style="display: flex; flex-direction: column; gap: 14px;">
      <div style="position: relative; height: 56px; border: 1.5px solid rgba(16,23,36,0.25); border-radius: 28px; background: #ffffff; display: flex; align-items: center; padding: 0 20px;">
        <span style="position: absolute; top: -8px; left: 20px; background: #f2f2f7; padding: 0 6px; font-size: 12px; font-weight: 600; color: #5c6b7d;">Email</span>
        <span style="font-size: 16px; flex: 1;">brandon@example.com</span>
      </div>
      <div>
        <div style="position: relative; height: 56px; border: 1.5px solid #0d9a8a; border-radius: 28px; background: #ffffff; display: flex; align-items: center; padding: 0 20px; gap: 6px;">
          <span style="position: absolute; top: -8px; left: 20px; background: #f2f2f7; padding: 0 6px; font-size: 12px; font-weight: 600; color: #0d9a8a;">Password</span>
          <span style="font-size: 16px; flex: 1; letter-spacing: 0.2em;">&bull;&bull;&bull;&bull;&bull;&bull;&bull;&bull;&bull;&bull;</span>
          <i class="ph ph-eye" style="font-size: 22px; color: #5c6b7d;"></i>
        </div>
        <div style="display: flex; align-items: center; gap: 6px; margin: 6px 0 0 20px;">
          <i class="ph-fill ph-check-circle" style="font-size: 16px; color: #0d9a8a;"></i>
          <span style="font-size: 13px; font-weight: 600; color: #0d9a8a;">At least 8 characters</span>
        </div>
      </div>
    </div>

    <div style="display: flex; align-items: flex-start; gap: 11px; padding: 16px; border-radius: 11px; background: #ffffff; border: 1px solid rgba(16,23,36,0.16); margin-top: 24px;">
      <i class="ph-fill ph-info" style="font-size: 22px; color: #5c6b7d; margin-top: 1px;"></i>
      <p style="margin: 0; font-size: 14px; line-height: 1.45; color: #5c6b7d;">
        By signing up you agree to our <span style="color: #06b6d4;">Terms</span> and <span style="color: #06b6d4;">Privacy Policy</span>.
      </p>
    </div>
  </div>

  <div style="flex-shrink: 0; padding: 8px 16px 20px; background: #f2f2f7;">
    <div style="height: 48px; border-radius: 999px; background: linear-gradient(145deg, #14b8a6, #3b82f6); color: #ffffff; font-size: 18px; font-weight: 700; display: flex; align-items: center; justify-content: center;">Create account</div>
    <div style="text-align: center; margin-top: 14px;">
      <span style="color: #5c6b7d; font-size: 14px;">Have an account? </span>
      <span style="color: #5c6b7d; font-size: 14px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.05rem;">Log in</span>
    </div>
  </div>
</div>
