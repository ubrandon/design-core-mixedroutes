<div style="background: #f2f2f7; height: 844px; display: flex; flex-direction: column; font-family: 'Geist', sans-serif; color: #1a2332; overflow: hidden;">

  <div style="display: flex; align-items: center; justify-content: space-between; height: 56px; padding: 0 16px; flex-shrink: 0;">
    <i class="ph ph-arrow-left" style="font-size: 24px; color: #1a2332;"></i>
    <div style="font-size: 17px; font-weight: 700;">Sign Up</div>
    <div style="width: 24px;"></div>
  </div>

  <div style="padding: 0 16px 20px; flex-shrink: 0;">
    <div style="display: flex; gap: 6px;">
      <div style="height: 4px; flex: 1; border-radius: 999px; background: linear-gradient(145deg, #14b8a6, #3b82f6);"></div>
      <div style="height: 4px; flex: 1; border-radius: 999px; background: linear-gradient(145deg, #14b8a6, #3b82f6);"></div>
      <div style="height: 4px; flex: 1; border-radius: 999px; background: rgba(16,23,36,0.12);"></div>
      <div style="height: 4px; flex: 1; border-radius: 999px; background: rgba(16,23,36,0.12);"></div>
    </div>
    <div style="font-size: 13px; font-weight: 600; color: #5c6b7d; margin-top: 8px;">Step 2 of 4</div>
  </div>

  <div style="flex: 1; overflow: hidden; padding: 0 16px; display: flex; flex-direction: column;">
    <h1 style="margin: 0 0 5px; font-size: 36px; font-weight: 700; line-height: 1.15;">Plans need people</h1>
    <div style="font-size: 16px; color: #5c6b7d; margin-bottom: 32px;">Sync your contacts to see which friends are already on MixedRoutes.</div>

    <div style="display: flex; justify-content: center; align-items: center; margin-bottom: 36px;">
      <div style="position: relative; width: 240px; height: 200px;">
        <img src="https://i.pravatar.cc/96?img=15" alt="" style="position: absolute; top: 0; left: 24px; width: 64px; height: 64px; border-radius: 50%; border: 3px solid #ffffff; box-shadow: 0 4px 14px rgba(16,23,36,0.15);" />
        <img src="https://i.pravatar.cc/96?img=47" alt="" style="position: absolute; top: 10px; right: 16px; width: 56px; height: 56px; border-radius: 50%; border: 3px solid #ffffff; box-shadow: 0 4px 14px rgba(16,23,36,0.15);" />
        <img src="https://i.pravatar.cc/96?img=32" alt="" style="position: absolute; bottom: 8px; left: 0; width: 56px; height: 56px; border-radius: 50%; border: 3px solid #ffffff; box-shadow: 0 4px 14px rgba(16,23,36,0.15);" />
        <img src="https://i.pravatar.cc/96?img=5" alt="" style="position: absolute; bottom: 0; right: 32px; width: 64px; height: 64px; border-radius: 50%; border: 3px solid #ffffff; box-shadow: 0 4px 14px rgba(16,23,36,0.15);" />
        <div style="position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); width: 84px; height: 84px; border-radius: 50%; background: linear-gradient(145deg, #14b8a6, #3b82f6); display: flex; align-items: center; justify-content: center; box-shadow: 0 8px 22px rgba(59,130,246,0.4);">
          <i class="ph-fill ph-users-three" style="font-size: 40px; color: #ffffff;"></i>
        </div>
      </div>
    </div>

    <div style="display: flex; flex-direction: column; gap: 14px;">
      <div style="display: flex; align-items: flex-start; gap: 14px;">
        <i class="ph-fill ph-check-circle" style="font-size: 22px; color: #0d9a8a; flex-shrink: 0; margin-top: 1px;"></i>
        <div style="font-size: 15px; color: #1a2332; line-height: 1.4;">Find friends already here, so your first plan has people in it</div>
      </div>
      <div style="display: flex; align-items: flex-start; gap: 14px;">
        <i class="ph-fill ph-lock" style="font-size: 22px; color: #5c6b7d; flex-shrink: 0; margin-top: 1px;"></i>
        <div style="font-size: 15px; color: #1a2332; line-height: 1.4;">Your contacts stay private. We never message anyone without you.</div>
      </div>
    </div>
  </div>

  <div style="flex-shrink: 0; padding: 8px 16px 20px; background: #f2f2f7;">
    <div style="height: 48px; border-radius: 999px; background: linear-gradient(145deg, #14b8a6, #3b82f6); color: #ffffff; font-size: 18px; font-weight: 700; display: flex; align-items: center; justify-content: center;">Find my friends</div>
    <div style="text-align: center; margin-top: 14px;">
      <span style="color: #5c6b7d; font-size: 14px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.05rem;">Skip for now</span>
