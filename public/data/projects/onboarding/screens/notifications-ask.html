<link rel="stylesheet" href="../../../../styles/shared.css" />
<link rel="stylesheet" href="../../../../styles/ds.css" />
<link rel="stylesheet" href="../../../../data/design-system/company.css" />
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&display=swap" rel="stylesheet" />
<div style="background: #f2f2f7; height: 844px; display: flex; flex-direction: column; font-family: 'Geist', sans-serif; color: #1a2332; overflow: hidden;">

  <div style="display: flex; align-items: center; justify-content: space-between; height: 56px; padding: 0 16px; flex-shrink: 0;">
    <i class="ph ph-arrow-left" style="font-size: 24px; color: #1a2332;"></i>
    <div style="font-size: 17px; font-weight: 700;">Almost done</div>
    <div style="width: 24px;"></div>
  </div>

  <div style="padding: 0 16px 20px; flex-shrink: 0;">
    <div style="display: flex; gap: 6px;">
      <div style="height: 4px; flex: 1; border-radius: 999px; background: linear-gradient(145deg, #14b8a6, #3b82f6);"></div>
      <div style="height: 4px; flex: 1; border-radius: 999px; background: linear-gradient(145deg, #14b8a6, #3b82f6);"></div>
      <div style="height: 4px; flex: 1; border-radius: 999px; background: linear-gradient(145deg, #14b8a6, #3b82f6);"></div>
      <div style="height: 4px; flex: 1; border-radius: 999px; background: linear-gradient(145deg, #14b8a6, #3b82f6);"></div>
    </div>
    <div style="font-size: 13px; font-weight: 600; color: #5c6b7d; margin-top: 8px;">Step 4 of 4</div>
  </div>

  <div style="flex: 1; overflow: hidden; padding: 0 16px; display: flex; flex-direction: column;">
    <h1 style="margin: 0 0 5px; font-size: 36px; font-weight: 700; line-height: 1.15;">Know when plans come together</h1>
    <div style="font-size: 16px; color: #5c6b7d; margin-bottom: 28px;">Get a ping when a friend invites you or RSVPs to your plan. That's it, no spam.</div>

    <div style="background: linear-gradient(160deg, #e4eefe, #d7f5f0); border-radius: 22px; padding: 28px 20px; margin-bottom: 24px;">
      <img src="../img/push-notification.png" alt="Example notification: Sara is in for Taco Tuesday" style="width: 100%; height: auto; display: block; border-radius: 16px; box-shadow: 0 12px 30px rgba(16,23,36,0.16);" />
    </div>

    <div style="display: flex; flex-direction: column; gap: 14px;">
      <div style="display: flex; align-items: flex-start; gap: 14px;">
        <i class="ph-fill ph-check-circle" style="font-size: 22px; color: #0d9a8a; flex-shrink: 0; margin-top: 1px;"></i>
        <div style="font-size: 15px; line-height: 1.4;">Only the stuff that matters: invites, RSVPs, and plan changes</div>
      </div>
      <div style="display: flex; align-items: flex-start; gap: 14px;">
        <i class="ph-fill ph-sliders" style="font-size: 22px; color: #5c6b7d; flex-shrink: 0; margin-top: 1px;"></i>
        <div style="font-size: 15px; line-height: 1.4;">You choose what pings you, and you can change it anytime</div>
      </div>
    </div>
  </div>

  <div style="flex-shrink: 0; padding: 8px 16px 20px; background: #f2f2f7;">
    <div style="height: 48px; border-radius: 999px; background: linear-gradient(145deg, #14b8a6, #3b82f6); color: #ffffff; font-size: 18px; font-weight: 700; display: flex; align-items: center; justify-content: center;">Turn on notifications</div>
    <div style="text-align: center; margin-top: 14px;">
      <span style="color: #5c6b7d; font-size: 14px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.05rem;">Maybe later</span>
    </div>
  </div>
</div>
