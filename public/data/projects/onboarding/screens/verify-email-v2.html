<link rel="stylesheet" href="../../../../styles/shared.css" />
<link rel="stylesheet" href="../../../../styles/ds.css" />
<link rel="stylesheet" href="../../../../data/design-system/company.css" />
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&display=swap" rel="stylesheet" />
<div style="background: #f2f2f7; height: 844px; display: flex; flex-direction: column; font-family: 'Geist', sans-serif; color: #1a2332; overflow: hidden;">

  <div style="display: flex; align-items: center; justify-content: space-between; height: 56px; padding: 0 16px; flex-shrink: 0;">
    <i class="ph ph-arrow-left" style="font-size: 24px; color: #1a2332;"></i>
    <div style="font-size: 17px; font-weight: 700;">Verify Email</div>
    <div style="width: 24px;"></div>
  </div>

  <div style="flex: 1; padding: 0 16px; display: flex; flex-direction: column; align-items: center; text-align: center;">
    <div style="margin: 32px 0 16px;">
      <i class="ph ph-envelope-simple" style="font-size: 104px; background: linear-gradient(145deg, #14b8a6, #3b82f6); -webkit-background-clip: text; background-clip: text; color: transparent;"></i>
    </div>

    <h1 style="margin: 0 0 11px; font-size: 36px; font-weight: 700; line-height: 1.15;">Check your email</h1>

    <p style="margin: 0 0 28px; font-size: 16px; line-height: 1.5; color: #5c6b7d;">
      We sent a verification link to <span style="font-weight: 700; color: #1a2332;">brandon@example.com</span>. Tap the link, then come back here.
    </p>

    <div style="width: 100%; padding: 16px; border-radius: 11px; background: #ffffff; border: 1px solid rgba(16,23,36,0.16); text-align: left;">
      <div style="display: flex; align-items: flex-start; gap: 11px;">
        <i class="ph-fill ph-info" style="font-size: 22px; color: #5c6b7d; margin-top: 1px;"></i>
        <p style="margin: 0; font-size: 14px; line-height: 1.45; color: #5c6b7d;">Don't see it? Check your spam, junk, or Promotions folder.</p>
      </div>
    </div>

    <div style="display: flex; align-items: center; gap: 8px; margin-top: 28px;">
      <i class="ph ph-circle-notch" style="font-size: 18px; color: #0d9a8a;"></i>
      <span style="font-size: 14px; font-weight: 600; color: #0d9a8a;">This screen updates on its own once you verify.</span>
    </div>
  </div>

  <div style="flex-shrink: 0; padding: 8px 16px 20px; background: #f2f2f7;">
    <div style="height: 48px; border-radius: 999px; background: linear-gradient(145deg, #14b8a6, #3b82f6); color: #ffffff; font-size: 18px; font-weight: 700; display: flex; align-items: center; justify-content: center;">Resend link</div>
    <div style="text-align: center; margin-top: 14px;">
      <span style="color: #5c6b7d; font-size: 14px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.05rem;">Change email</span>
    </div>
  </div>
</div>
