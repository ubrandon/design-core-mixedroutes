<link rel="stylesheet" href="../../../../styles/ds.css" />
<link rel="stylesheet" href="../../../../data/design-system/company.css" />

<style>
  .v5-scope { --v5-bg: #06080e; --v5-line: rgba(255,255,255,0.08); }
  .v5-scope, .v5-scope * { box-sizing: border-box; scrollbar-width: none; -ms-overflow-style: none; }
  .v5-scope::-webkit-scrollbar, .v5-scope *::-webkit-scrollbar { display: none; width: 0; height: 0; }
  .v5-wrap { background: var(--v5-bg); height: 844px; position: relative; overflow: hidden; display: flex; flex-direction: column; font-family: var(--font-body); }
  .v5-body { flex: 1; overflow-y: auto; padding-bottom: 8px; }

  .v5-header { display: grid; grid-template-columns: 1fr 28px; align-items: center; padding: 22px 20px 8px; }
  .v5-title { color: #fff; font-size: 1.7rem; font-weight: 850; letter-spacing: -0.01em; }
  .v5-close { background: transparent; border: 0; color: rgba(255,255,255,0.85); width: 28px; height: 28px; display: inline-flex; align-items: center; justify-content: center; padding: 0; }
  .v5-close i { font-size: 22px; }

  .v5-gcard { margin: 8px 20px 16px; padding: 14px 16px; border-radius: 18px; background: rgba(255,255,255,0.05); display: grid; grid-template-columns: 56px 1fr 28px; align-items: center; gap: 14px; position: relative; }
  .v5-gcard .gthumb { width: 56px; height: 56px; border-radius: 50%; overflow: hidden; background: rgba(255,255,255,0.08); }
  .v5-gcard .gthumb img { width: 100%; height: 100%; object-fit: cover; }
  .v5-gcard .gname { color: #fff; font-size: 1.1rem; font-weight: 850; line-height: 1.1; }
  .v5-gcard .gmeta { color: rgba(255,255,255,0.6); font-size: 0.88rem; font-weight: 700; margin-top: 4px; }
  .v5-gcard .gx { background: transparent; border: 0; width: 28px; height: 28px; color: rgba(255,255,255,0.55); display: inline-flex; align-items: center; justify-content: center; padding: 0; }
  .v5-gcard .gx i { font-size: 18px; }

  .v5-search { display: grid; grid-template-columns: 20px 1fr; align-items: center; gap: 10px; margin: 0 20px 16px; padding: 12px 15px; background: rgba(255,255,255,0.07); border-radius: 999px; }
  .v5-search i { color: rgba(255,255,255,0.54); font-size: 17px; }
  .v5-search input { width: 100%; border: 0; outline: 0; padding: 0; background: transparent; color: #fff; font: inherit; font-size: 0.94rem; }

  .v5-label { display: flex; align-items: baseline; justify-content: space-between; padding: 4px 20px 12px; color: rgba(255,255,255,0.72); font-size: 0.74rem; font-weight: 850; letter-spacing: 0.08em; text-transform: uppercase; }
  .v5-label .count { color: var(--neon-teal); text-transform: none; font-size: 0.84rem; letter-spacing: 0; font-weight: 850; }

  .v5-list { padding: 0 20px; display: flex; flex-direction: column; }
  .v5-row { display: grid; grid-template-columns: 44px 1fr 22px; align-items: center; gap: 13px; padding: 11px 8px; margin: 0 -4px; border-radius: 14px; }
  .v5-row.is-on { background: rgba(32,224,207,0.06); }
  .v5-row.is-off { opacity: 0.5; }
  .v5-row .av { width: 44px; height: 44px; border-radius: 50%; object-fit: cover; display: inline-flex; align-items: center; justify-content: center; background: var(--neon-teal); color: #061016; font-weight: 900; }
  .v5-row .av.muted { background: #4a5462; color: #fff; }
  .v5-name { color: #fff; font-size: 0.98rem; font-weight: 850; line-height: 1.15; }
  .v5-handle { color: rgba(255,255,255,0.5); font-size: 0.8rem; margin-top: 2px; }
  .v5-host { color: var(--neon-amber, #ffd25a); font-size: 0.78rem; font-weight: 850; margin-top: 2px; }
  .v5-noinv { color: rgba(255,255,255,0.5); font-size: 0.8rem; margin-top: 2px; }

  .v5-friendlock { margin: 18px 20px 8px; padding: 12px 14px; border-radius: 14px; background: rgba(255,255,255,0.04); border: 1px solid var(--v5-line); display: grid; grid-template-columns: 20px 1fr; align-items: center; gap: 12px; }
  .v5-friendlock i { color: rgba(255,255,255,0.55); font-size: 17px; }
  .v5-friendlock .txt { color: rgba(255,255,255,0.72); font-size: 0.86rem; font-weight: 700; line-height: 1.3; }
  .v5-friendlock .txt b { color: #fff; font-weight: 850; }

  .v5-cta { padding: 14px 20px 22px; display: grid; grid-template-columns: 1fr 1.5fr; gap: 12px; }
  .v5-cta button { min-height: 50px; border: 0; border-radius: 999px; color: #fff; font-size: 0.98rem; font-weight: 850; }
  .v5-cta .ghost { background: rgba(255,255,255,0.08); }
  .v5-cta .primary { background: linear-gradient(135deg, var(--neon-teal), var(--neon-blue)); }
</style>

<div class="mr-scope v5-scope">
  <div class="v5-wrap">
    <div class="v5-body">
      <header class="v5-header">
        <div class="v5-title">Invite more</div>
        <button type="button" class="v5-close" aria-label="Close"><i class="ph ph-x"></i></button>
      </header>

      <div class="v5-gcard">
        <div class="gthumb"><img src="https://images.unsplash.com/photo-1464822759023-fed622ff2c3b?auto=format&fit=crop&w=200&h=200&q=80" alt="" loading="lazy" /></div>
        <div>
          <div class="gname">Lake House</div>
          <div class="gmeta">5 of 8 invited</div>
        </div>
      </div>

      <div class="v5-search">
        <i class="ph ph-magnifying-glass"></i>
        <input type="search" placeholder="Search Lake House members" />
      </div>

      <div class="v5-label"><span>Not yet invited</span><span class="count">Select all</span></div>
      <div class="v5-list">
        <div class="v5-row">
          <img class="av" src="https://i.pravatar.cc/96?img=33" alt="" loading="lazy" />
          <div><div class="v5-name">Soren Vale</div><div class="v5-handle">@sorenvale</div></div>
          <span class="mr-checkbox"><i class="ph ph-square"></i></span>
        </div>
        <div class="v5-row">
          <img class="av" src="https://i.pravatar.cc/96?img=22" alt="" loading="lazy" />
          <div><div class="v5-name">Iris Mae</div><div class="v5-handle">@irismae</div></div>
          <span class="mr-checkbox"><i class="ph ph-square"></i></span>
        </div>
        <div class="v5-row">
          <span class="av muted">PS</span>
          <div><div class="v5-name">Piper Sol</div><div class="v5-handle">@pipersol</div></div>
          <span class="mr-checkbox"><i class="ph ph-square"></i></span>
        </div>
      </div>

      <div class="v5-friendlock">
        <i class="ph ph-lock-simple"></i>
        <div class="txt">To invite friends outside <b>Lake House</b>, switch the plan over.</div>
      </div>
    </div>

    <div class="v5-cta">
      <button type="button" class="ghost">Cancel</button>
      <button type="button" class="primary">Invite 0</button>
    </div>
  </div>
</div>
