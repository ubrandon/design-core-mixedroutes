<link rel="stylesheet" href="../../../../styles/ds.css" />
<link rel="stylesheet" href="../../../../data/design-system/company.css" />

<style>
  .sp-scope { --sp-bg: #06080e; --sp-soft: rgba(255,255,255,0.06); --sp-line: rgba(255,255,255,0.1); }
  .sp-scope, .sp-scope * { box-sizing: border-box; scrollbar-width: none; -ms-overflow-style: none; }
  .sp-scope::-webkit-scrollbar, .sp-scope *::-webkit-scrollbar { display: none; width: 0; height: 0; }
  .sp-wrap { background: var(--sp-bg); height: 844px; position: relative; overflow: hidden; display: flex; flex-direction: column; font-family: var(--font-body); }
  .sp-body { flex: 1; overflow-y: auto; padding-bottom: 8px; }
  .sp-header { display: grid; grid-template-columns: 32px 1fr 32px; align-items: center; gap: 10px; padding: 18px 18px 12px; }
  .sp-icon-btn { width: 32px; height: 32px; border: 0; border-radius: 999px; background: transparent; color: rgba(255,255,255,0.86); display: inline-flex; align-items: center; justify-content: center; padding: 0; }
  .sp-icon-btn i { font-size: 22px; }
  .sp-title { text-align: center; color: #fff; font-size: 1rem; font-weight: 800; }
  .sp-headline { padding: 4px 20px 12px; }
  .sp-headline h1 { margin: 0 0 4px; color: #fff; font-size: 1.55rem; line-height: 1.12; font-weight: 850; letter-spacing: 0; }
  .sp-headline p { margin: 0; color: rgba(255,255,255,0.58); font-size: 0.88rem; line-height: 1.4; }
  .sp-search { display: grid; grid-template-columns: 20px 1fr; align-items: center; gap: 10px; margin: 0 20px 14px; padding: 12px 15px; background: rgba(255,255,255,0.07); border-radius: 999px; }
  .sp-search i { color: rgba(255,255,255,0.54); font-size: 17px; }
  .sp-search input { width: 100%; border: 0; outline: 0; padding: 0; background: transparent; color: #fff; font: inherit; font-size: 0.94rem; }
  .sp-context { margin: 0 20px 14px; padding: 4px; border-radius: 999px; background: rgba(255,255,255,0.06); display: grid; grid-template-columns: 1fr 1fr; gap: 4px; }
  .sp-context span { min-height: 34px; border-radius: 999px; display: inline-flex; align-items: center; justify-content: center; color: rgba(255,255,255,0.58); font-size: 0.86rem; font-weight: 800; }
  .sp-context .is-active { color: #061016; background: var(--neon-teal); }
  .sp-group-pill { margin: 0 20px 14px; padding: 12px 14px; border-radius: 16px; background: rgba(32,224,207,0.08); border: 1px solid rgba(32,224,207,0.36); display: grid; grid-template-columns: 48px 1fr 24px; align-items: center; gap: 12px; }
  .sp-group-pill img { width: 48px; height: 48px; border-radius: 14px; object-fit: cover; }
  .sp-group-pill .name { color: #fff; font-size: 1rem; line-height: 1.1; font-weight: 850; }
  .sp-group-pill .meta { color: var(--neon-teal); font-size: 0.82rem; font-weight: 800; margin-top: 2px; }
  .sp-group-pill i { color: rgba(255,255,255,0.62); font-size: 20px; }
  .sp-label { display: flex; align-items: center; justify-content: space-between; padding: 4px 20px 8px; color: rgba(255,255,255,0.74); font-size: 0.76rem; font-weight: 850; letter-spacing: 0.06em; text-transform: uppercase; }
  .sp-scope-tabs { margin: 0 20px 14px; display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .sp-scope-tab { min-height: 64px; border-radius: 16px; border: 1px solid var(--sp-line); background: rgba(255,255,255,0.035); color: #fff; padding: 11px 12px; text-align: left; }
  .sp-scope-tab .top { display: flex; align-items: center; justify-content: space-between; font-size: 0.92rem; font-weight: 850; }
  .sp-scope-tab .sub { color: rgba(255,255,255,0.52); font-size: 0.76rem; margin-top: 3px; line-height: 1.25; }
  .sp-scope-tab.is-active { border: 2px solid var(--neon-teal); background: rgba(32,224,207,0.08); padding: 10px 11px; }
  .sp-scope-tab.is-active .top i { color: var(--neon-teal); }
  .sp-list { padding: 0 20px; display: flex; flex-direction: column; }
  .sp-row { display: grid; grid-template-columns: 44px 1fr 22px; align-items: center; gap: 12px; padding: 10px 4px; }
  .sp-row.is-on { background: rgba(32,224,207,0.08); border-radius: 12px; padding-left: 10px; padding-right: 10px; margin: 0 -6px; }
  .sp-row img, .sp-avatar { width: 44px; height: 44px; border-radius: 50%; object-fit: cover; display: inline-flex; align-items: center; justify-content: center; background: var(--neon-teal); color: #061016; font-weight: 900; }
  .sp-name { color: #fff; font-size: 0.96rem; font-weight: 850; line-height: 1.15; }
  .sp-meta { color: rgba(255,255,255,0.52); font-size: 0.8rem; margin-top: 2px; }
  .sp-check { width: 22px; height: 22px; border-radius: 6px; border: 1.5px solid rgba(255,255,255,0.26); display: inline-flex; align-items: center; justify-content: center; }
  .sp-check.is-on { border-color: var(--neon-teal); background: var(--neon-teal); color: #061016; }
  .sp-check i { font-size: 13px; }
  .sp-cta { padding: 12px 20px 20px; display: grid; grid-template-columns: 1fr 1.35fr; gap: 12px; }
  .sp-cta button { min-height: 48px; border: 0; border-radius: 999px; color: #fff; font-size: 0.96rem; font-weight: 850; }
  .sp-cta .ghost { background: rgba(255,255,255,0.08); }
  .sp-cta .primary { background: linear-gradient(135deg, var(--neon-teal), var(--neon-blue)); }
</style>

<div class="mr-scope sp-scope">
  <div class="sp-wrap">
    <div class="sp-body">
      <header class="sp-header">
        <button type="button" class="sp-icon-btn" aria-label="Back"><i class="ph ph-arrow-left"></i></button>
        <div class="sp-title">Invite</div>
        <button type="button" class="sp-icon-btn" aria-label="Close"><i class="ph ph-x"></i></button>
      </header>

      <div class="sp-headline">
        <h1>Who's going?</h1>
        <p>This plan belongs to Family. Invite everyone, or narrow it to members.</p>
      </div>

      <div class="sp-search">
        <i class="ph ph-magnifying-glass"></i>
        <input type="search" placeholder="Search Family members" />
      </div>

      <div class="sp-context">
        <span>People</span>
        <span class="is-active">Group</span>
      </div>

      <div class="sp-group-pill">
        <img src="https://images.unsplash.com/photo-1464822759023-fed622ff2c3b?auto=format&fit=crop&w=200&h=200&q=80" alt="" loading="lazy" />
        <div><div class="name">Family</div><div class="meta">Group plan</div></div>
        <i class="ph ph-caret-down"></i>
      </div>

      <div class="sp-label">Invite scope</div>
      <div class="sp-scope-tabs">
        <button type="button" class="sp-scope-tab is-active">
          <span class="top">All members <i class="ph-fill ph-check-circle"></i></span>
          <span class="sub">Current and future Family members</span>
        </button>
        <button type="button" class="sp-scope-tab">
          <span class="top">Selected</span>
          <span class="sub">Only checked members below</span>
        </button>
      </div>

      <div class="sp-label"><span>Family members</span><span>8 invited</span></div>
      <div class="sp-list">
        <div class="sp-row is-on">
          <img src="https://i.pravatar.cc/96?img=12" alt="" loading="lazy" />
          <div><div class="sp-name">Nova Finch</div><div class="sp-meta">Family member</div></div>
          <span class="sp-check is-on"><i class="ph-fill ph-check"></i></span>
        </div>
        <div class="sp-row is-on">
          <span class="sp-avatar">M</span>
          <div><div class="sp-name">Milo Wren</div><div class="sp-meta">Host</div></div>
          <span class="sp-check is-on"><i class="ph-fill ph-check"></i></span>
        </div>
        <div class="sp-row is-on">
          <img src="https://i.pravatar.cc/96?img=49" alt="" loading="lazy" />
          <div><div class="sp-name">Lila Quill</div><div class="sp-meta">Family member</div></div>
          <span class="sp-check is-on"><i class="ph-fill ph-check"></i></span>
        </div>
        <div class="sp-row is-on">
          <img src="https://i.pravatar.cc/96?img=33" alt="" loading="lazy" />
          <div><div class="sp-name">Soren Vale</div><div class="sp-meta">Family member</div></div>
          <span class="sp-check is-on"><i class="ph-fill ph-check"></i></span>
        </div>
      </div>
    </div>

    <div class="sp-cta">
      <button type="button" class="ghost">Cancel</button>
      <button type="button" class="primary">Invite Family</button>
    </div>
  </div>
</div>
