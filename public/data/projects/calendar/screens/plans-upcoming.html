<link rel="stylesheet" href="../../../../styles/shared.css" />
<link rel="stylesheet" href="../../../../styles/ds.css" />
<link rel="stylesheet" href="../../../../data/design-system/company.css" />

<style>
  .cal-scope, .cal-scope * { scrollbar-width: none; -ms-overflow-style: none; box-sizing: border-box; }
  .cal-scope::-webkit-scrollbar, .cal-scope *::-webkit-scrollbar { display: none; width: 0; height: 0; }

  .cal-scope .cal-wrap { background: var(--bg-0); min-height: 844px; position: relative; padding-bottom: 12px; }

  .cal-scope .cal-top { display: flex; align-items: center; justify-content: space-between; padding: 22px 16px 14px; }
  .cal-scope .cal-title { font-size: 1.75rem; font-weight: 800; letter-spacing: -0.02em; color: var(--text); }
  .cal-scope .cal-top-actions { display: flex; align-items: center; gap: 16px; }
  .cal-scope .cal-top-actions i { font-size: 22px; color: rgba(255,255,255,0.85); cursor: pointer; }

  .cal-scope .cal-filters { display: flex; gap: 8px; overflow-x: auto; flex-wrap: nowrap; padding: 4px 16px 16px; }
  .cal-scope .cal-filters .mr-chip { flex: 0 0 auto; white-space: nowrap; cursor: pointer; }
  .cal-scope .cal-filters .mr-chip i { font-size: 15px; }

  .cal-scope .cal-section { font-size: 1.2rem; font-weight: 800; letter-spacing: -0.01em; color: var(--text); padding: 16px 16px 12px; }

  .cal-scope .cal-list { padding: 0 16px; }
  .cal-scope .cal-list .mr-plan-rows { max-width: none; margin-bottom: 14px; }
  .cal-scope .mr-plan-row-title { line-height: 1.25; }
  .cal-scope .mr-plan-row-meta { flex-wrap: nowrap; }
  .cal-scope .mr-plan-row-when-where-item { min-width: 0; }
  .cal-scope .mr-plan-row-when-where-item span { white-space: nowrap; }

  .cal-scope .cal-newplan { position: fixed; right: 16px; bottom: 92px; z-index: 8; display: inline-flex; align-items: center; gap: 10px; padding: 14px 22px; border-radius: 999px; border: 0; cursor: pointer;
    background: linear-gradient(120deg, #46c7e8, #6aa9f5); color: #fff; font-size: 1rem; font-weight: 800; box-shadow: 0 10px 28px rgba(70,160,232,0.4); }
  .cal-scope .cal-newplan i { font-size: 19px; }

  .cal-scope .cal-tabwrap { position: sticky; bottom: 0; z-index: 5; padding-top: 8px; background: linear-gradient(180deg, transparent, var(--bg-0) 34%); }
  .cal-scope .mr-tab-item--avatar { padding: 2px 4px; }
  .cal-scope .mr-tab-avatar { width: 36px; height: 36px; border-radius: 50%; object-fit: cover; display: block; opacity: 0.92; }
  .cal-scope .mr-tab-item--avatar.mr-tab-active .mr-tab-avatar { opacity: 1; border: 2px solid var(--neon-teal); }
</style>

<div class="cal-scope mr-scope">
  <div class="cal-wrap">
    <div class="cal-top">
      <div class="cal-title">Plans</div>
      <div class="cal-top-actions">
        <i class="ph ph-bell" aria-hidden="true"></i>
        <i class="ph ph-gear-six" aria-hidden="true"></i>
      </div>
    </div>

    <div class="cal-filters">
      <button type="button" class="mr-chip mr-chip-active"><i class="ph-fill ph-calendar-blank"></i> Upcoming</button>
      <button type="button" class="mr-chip"><i class="ph ph-bookmark-simple"></i> Ideas</button>
      <button type="button" class="mr-chip"><i class="ph ph-envelope-simple"></i> Invites (0)</button>
      <button type="button" class="mr-chip"><i class="ph ph-clock"></i> Past</button>
      <button type="button" class="mr-chip"><i class="ph ph-thumbs-down"></i> Declined</button>
    </div>

    <div class="cal-section">Today</div>
    <div class="cal-list">
     <div class="mr-plan-rows">
      <div class="mr-plan-row mr-plan-row--photo-blur" style="--mr-plan-row-bg: url(https://images.unsplash.com/photo-1551632811-561732d1e306?auto=format&fit=crop&w=320&h=320&q=80);">
        <div class="mr-plan-row-media" style="background-image: url(https://images.unsplash.com/photo-1551632811-561732d1e306?auto=format&fit=crop&w=280&h=280&q=80);" aria-hidden="true"></div>
        <div class="mr-plan-row-content">
          <div class="plan-card-mini-time">TODAY &bull; 2 PM</div>
          <div class="mr-plan-row-title">Sunset Trail Hike</div>
          <div class="mr-plan-row-meta">
            <div class="mr-plan-row-when-where-item mr-plan-row-when-where-item--solo">
              <i class="ph-fill ph-map-pin" aria-hidden="true"></i>
              <span>Red Rock Canyon</span>
            </div>
            <div class="mr-plan-row-avatar-stack" aria-hidden="true">
              <div class="plan-card-mini-avatar-stack">
                <img class="plan-card-mini-avatar" src="https://i.pravatar.cc/48?img=12" alt="" loading="lazy" />
              </div>
            </div>
          </div>
        </div>
      </div>

      <div class="mr-plan-row mr-plan-row--photo-blur" style="--mr-plan-row-bg: url(https://images.unsplash.com/photo-1499696010180-025ef6e1a8f9?auto=format&fit=crop&w=320&h=320&q=80);">
        <div class="mr-plan-row-media" style="background-image: url(https://images.unsplash.com/photo-1499696010180-025ef6e1a8f9?auto=format&fit=crop&w=280&h=280&q=80);" aria-hidden="true"></div>
        <div class="mr-plan-row-content">
          <div class="plan-card-mini-time">FRI, MAY 29TH TO TODAY</div>
          <div class="mr-plan-row-title">Family Weekend Away</div>
          <div class="mr-plan-row-meta">
            <div class="mr-plan-row-when-where-item mr-plan-row-when-where-item--solo">
              <i class="ph-fill ph-map-pin" aria-hidden="true"></i>
              <span>Lakeside Retreat</span>
            </div>
            <div class="mr-plan-row-avatar-stack" aria-hidden="true">
              <div class="plan-card-mini-avatar-stack">
                <img class="plan-card-mini-avatar" src="https://i.pravatar.cc/48?img=33" alt="" loading="lazy" />
              </div>
            </div>
          </div>
        </div>
      </div>
     </div>
    </div>

    <div class="cal-section">Next Week</div>
    <div class="cal-list">
     <div class="mr-plan-rows">
      <div class="mr-plan-row mr-plan-row--photo-blur" style="--mr-plan-row-bg: url(https://images.unsplash.com/photo-1470229722913-7c0e2dbbafd3?auto=format&fit=crop&w=320&h=320&q=80);">
        <div class="mr-plan-row-media" style="background-image: url(https://images.unsplash.com/photo-1470229722913-7c0e2dbbafd3?auto=format&fit=crop&w=280&h=280&q=80);" aria-hidden="true"></div>
        <div class="mr-plan-row-content">
          <div class="plan-card-mini-time">THU, JUN 4TH &bull; 7 PM</div>
          <div class="mr-plan-row-title">Live Music Night</div>
          <div class="mr-plan-row-meta">
            <div class="mr-plan-row-when-where-item mr-plan-row-when-where-item--solo">
              <i class="ph-fill ph-map-pin" aria-hidden="true"></i>
              <span>Savannah Theatre</span>
            </div>
            <div class="mr-plan-row-avatar-stack" aria-hidden="true">
              <div class="plan-card-mini-avatar-stack">
                <img class="plan-card-mini-avatar" src="https://i.pravatar.cc/48?img=15" alt="" loading="lazy" />
              </div>
            </div>
          </div>
        </div>
      </div>
     </div>
    </div>

    <button type="button" class="cal-newplan">
      <i class="ph-fill ph-calendar-plus" aria-hidden="true"></i>
      New plan
    </button>

    <div style="height: 96px"></div>

    <div class="cal-tabwrap">
      <div class="mr-tab-bar" style="margin: 0 8px 0">
        <button type="button" class="mr-tab-item" aria-label="Home">
          <i class="ph ph-house" aria-hidden="true"></i>
        </button>
        <button type="button" class="mr-tab-item" aria-label="Explore">
          <i class="ph ph-compass" aria-hidden="true"></i>
        </button>
        <button type="button" class="mr-tab-item mr-tab-item--avatar" aria-label="You">
          <img class="mr-tab-avatar" src="https://i.pravatar.cc/72?img=11" alt="" width="36" height="36" loading="lazy" />
        </button>
        <button type="button" class="mr-tab-item mr-tab-active" aria-label="Calendar">
          <i class="ph-fill ph-calendar-blank" aria-hidden="true"></i>
        </button>
        <button type="button" class="mr-tab-item" aria-label="Messages">
          <i class="ph ph-chat-teardrop-text" aria-hidden="true"></i>
        </button>
      </div>
    </div>
  </div>
</div>

<script>
  (function () {
    const scope = document.querySelector('.cal-scope');
    if (!scope) return;
    scope.querySelectorAll('.cal-filters .mr-chip').forEach(function (pill) {
      pill.addEventListener('click', function () {
        scope.querySelectorAll('.cal-filters .mr-chip').forEach(function (p) { p.classList.remove('mr-chip-active'); });
        pill.classList.add('mr-chip-active');
      });
    });
  })();
</script>
