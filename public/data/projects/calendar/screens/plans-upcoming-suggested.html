<style>
  .calsg-scope, .calsg-scope * { scrollbar-width: none; -ms-overflow-style: none; box-sizing: border-box; }
  .calsg-scope::-webkit-scrollbar, .calsg-scope *::-webkit-scrollbar { display: none; width: 0; height: 0; }

  .calsg-scope .cal-wrap { background: var(--bg-0); min-height: 844px; position: relative; padding-bottom: 12px; }

  .calsg-scope .cal-top { display: flex; align-items: center; justify-content: space-between; padding: 22px 16px 14px; }
  .calsg-scope .cal-title { font-size: 1.75rem; font-weight: 800; letter-spacing: -0.02em; color: var(--text); }
  .calsg-scope .cal-top-actions { display: flex; align-items: center; gap: 16px; }
  .calsg-scope .cal-top-actions i { font-size: 22px; color: rgba(255,255,255,0.85); cursor: pointer; }

  .calsg-scope .cal-filters { display: flex; gap: 8px; overflow-x: auto; flex-wrap: nowrap; padding: 4px 16px 16px; }
  .calsg-scope .cal-filters .mr-chip { flex: 0 0 auto; white-space: nowrap; cursor: pointer; }
  .calsg-scope .cal-filters .mr-chip i { font-size: 15px; }

  .calsg-scope .calsg-invite { margin: 0 16px 4px; border-radius: 16px; padding: 13px 14px; display: flex; gap: 12px; align-items: center; cursor: pointer;
    background: linear-gradient(120deg, rgba(70,199,232,0.14), rgba(106,169,245,0.08));
    border: 1px solid rgba(70,199,232,0.35); }
  .calsg-scope .calsg-invite-faces { display: flex; flex-shrink: 0; }
  .calsg-scope .calsg-invite-faces img { width: 34px; height: 34px; border-radius: 50%; object-fit: cover; border: 2px solid var(--bg-0); }
  .calsg-scope .calsg-invite-faces img + img { margin-left: -10px; }
  .calsg-scope .calsg-invite-body { flex: 1; min-width: 0; }
  .calsg-scope .calsg-invite-title { font-size: 0.95rem; font-weight: 800; color: var(--text); line-height: 1.25; }
  .calsg-scope .calsg-invite-desc { font-size: 0.78rem; color: rgba(255,255,255,0.6); margin-top: 1px; line-height: 1.3; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .calsg-scope .calsg-invite-count { flex-shrink: 0; min-width: 24px; height: 24px; padding: 0 7px; border-radius: 999px; display: flex; align-items: center; justify-content: center;
    background: linear-gradient(120deg, #46c7e8, #6aa9f5); color: #fff; font-size: 0.8rem; font-weight: 800; }
  .calsg-scope .calsg-invite-caret { font-size: 14px; color: rgba(255,255,255,0.5); flex-shrink: 0; }

  .calsg-scope .cal-section { font-size: 1.2rem; font-weight: 800; letter-spacing: -0.01em; color: var(--text); padding: 16px 16px 12px; }

  .calsg-scope .cal-list { padding: 0 16px; }
  .calsg-scope .cal-list .mr-plan-rows { max-width: none; margin-bottom: 14px; }
  .calsg-scope .mr-plan-row-title { line-height: 1.25; }
  .calsg-scope .mr-plan-row-meta { flex-wrap: nowrap; }
  .calsg-scope .mr-plan-row-when-where-item { min-width: 0; }
  .calsg-scope .mr-plan-row-when-where-item span { white-space: nowrap; }

  .calsg-scope .calsg-declined { width: 100%; display: flex; align-items: center; gap: 8px; padding: 10px 12px; margin: 2px 0 6px; border-radius: 12px; border: 1px dashed rgba(255,255,255,0.14); background: transparent; cursor: pointer;
    font-size: 0.85rem; font-weight: 700; color: rgba(255,255,255,0.55); text-align: left; }
  .calsg-scope .calsg-declined i { font-size: 16px; color: rgba(255,255,255,0.45); }
  .calsg-scope .calsg-declined-label { flex: 1; }
  .calsg-scope .calsg-declined-caret { transition: transform 0.18s ease; }
  .calsg-scope .calsg-declined.is-open .calsg-declined-caret { transform: rotate(180deg); }

  .calsg-scope .calsg-declined-panel { display: none; }
  .calsg-scope .calsg-declined-panel.is-open { display: block; }
  .calsg-scope .calsg-declined-panel .mr-plan-row { opacity: 0.45; filter: saturate(0.6); }

  .calsg-scope .cal-newplan { position: fixed; right: 16px; bottom: 92px; z-index: 8; display: inline-flex; align-items: center; gap: 10px; padding: 14px 22px; border-radius: 999px; border: 0; cursor: pointer;
    background: linear-gradient(120deg, #46c7e8, #6aa9f5); color: #fff; font-size: 1rem; font-weight: 800; }
  .calsg-scope .cal-newplan i { font-size: 19px; }

  .calsg-scope .cal-tabwrap { position: sticky; bottom: 0; z-index: 5; padding-top: 8px; background: linear-gradient(180deg, transparent, var(--bg-0) 34%); }
  .calsg-scope .mr-tab-item--avatar { padding: 2px 4px; }
  .calsg-scope .mr-tab-avatar { width: 36px; height: 36px; border-radius: 50%; object-fit: cover; display: block; opacity: 0.92; }
  .calsg-scope .mr-tab-item--avatar.mr-tab-active .mr-tab-avatar { opacity: 1; border: 2px solid var(--neon-teal); }
</style>

<div class="calsg-scope mr-scope">
  <div class="cal-wrap">
    <div class="cal-top">
      <div class="cal-title">Plans</div>
      <div class="cal-top-actions">
        <i class="ph ph-bell" aria-hidden="true"></i>
        <i class="ph ph-gear-six" aria-hidden="true"></i>
      </div>
    </div>

    <div class="cal-filters">
      <button type="button" class="mr-chip mr-chip-active"><i class="ph-fill ph-calendar-blank"></i> Upcoming</button>
      <button type="button" class="mr-chip"><i class="ph ph-bookmark-simple"></i> Ideas</button>
      <button type="button" class="mr-chip"><i class="ph ph-clock"></i> Past</button>
    </div>

    <div class="calsg-invite" role="button">
      <div class="calsg-invite-faces" aria-hidden="true">
        <img src="https://i.pravatar.cc/68?img=32" alt="" loading="lazy" />
        <img src="https://i.pravatar.cc/68?img=15" alt="" loading="lazy" />
        <img src="https://i.pravatar.cc/68?img=47" alt="" loading="lazy" />
      </div>
      <div class="calsg-invite-body">
        <div class="calsg-invite-title">3 invites waiting</div>
        <div class="calsg-invite-desc">Renee, Sam and 1 other invited you</div>
      </div>
      <span class="calsg-invite-count">3</span>
      <i class="calsg-invite-caret ph ph-caret-right" aria-hidden="true"></i>
    </div>

    <div class="cal-section">Today</div>
    <div class="cal-list">
     <div class="mr-plan-rows">
      <div class="mr-plan-row mr-plan-row--photo-blur" style="--mr-plan-row-bg: url(https://images.unsplash.com/photo-1551632811-561732d1e306?auto=format&fit=crop&w=320&h=320&q=80);">
        <div class="mr-plan-row-media" style="background-image: url(https://images.unsplash.com/photo-1551632811-561732d1e306?auto=format&fit=crop&w=280&h=280&q=80);" aria-hidden="true"></div>
        <div class="mr-plan-row-content">
          <div class="plan-card-mini-time">TODAY &bull; 2 PM</div>
          <div class="mr-plan-row-title">Sunset Trail Hike</div>
          <div class="mr-plan-row-meta">
            <div class="mr-plan-row-when-where-item mr-plan-row-when-where-item--solo">
              <i class="ph-fill ph-map-pin" aria-hidden="true"></i>
              <span>Red Rock Canyon</span>
            </div>
            <div class="mr-plan-row-avatar-stack" aria-hidden="true">
              <div class="plan-card-mini-avatar-stack">
                <img class="plan-card-mini-avatar" src="https://i.pravatar.cc/48?img=12" alt="" loading="lazy" />
              </div>
            </div>
          </div>
        </div>
      </div>

      <div class="mr-plan-row mr-plan-row--photo-blur" style="--mr-plan-row-bg: url(https://images.unsplash.com/photo-1499696010180-025ef6e1a8f9?auto=format&fit=crop&w=320&h=320&q=80);">
        <div class="mr-plan-row-media" style="background-image: url(https://images.unsplash.com/photo-1499696010180-025ef6e1a8f9?auto=format&fit=crop&w=280&h=280&q=80);" aria-hidden="true"></div>
        <div class="mr-plan-row-content">
          <div class="plan-card-mini-time">FRI, MAY 29TH TO TODAY</div>
          <div class="mr-plan-row-title">Family Weekend Away</div>
          <div class="mr-plan-row-meta">
            <div class="mr-plan-row-when-where-item mr-plan-row-when-where-item--solo">
              <i class="ph-fill ph-map-pin" aria-hidden="true"></i>
              <span>Lakeside Retreat</span>
            </div>
            <div class="mr-plan-row-avatar-stack" aria-hidden="true">
              <div class="plan-card-mini-avatar-stack">
                <img class="plan-card-mini-avatar" src="https://i.pravatar.cc/48?img=33" alt="" loading="lazy" />
              </div>
            </div>
          </div>
        </div>
      </div>
     </div>

     <button type="button" class="calsg-declined" data-declined-toggle>
       <i class="ph ph-eye-slash" aria-hidden="true"></i>
       <span class="calsg-declined-label">1 declined</span>
       <i class="ph ph-caret-down calsg-declined-caret" aria-hidden="true"></i>

     <div class="calsg-declined-panel" data-declined-panel>
      <div class="mr-plan-rows">
       <div class="mr-plan-row mr-plan-row--photo-blur" style="--mr-plan-row-bg: url(https://images.unsplash.com/photo-1543007630-9710e4a00a20?auto=format&fit=crop&w=320&h=320&q=80);">
         <div class="mr-plan-row-media" style="background-image: url(https://images.unsplash.com/photo-1543007630-9710e4a00a20?auto=format&fit=crop&w=280&h=280&q=80);" aria-hidden="true"></div>
         <div class="mr-plan-row-content">
           <div class="plan-card-mini-time">TODAY &bull; 8 PM</div>
           <div class="mr-plan-row-title">Trivia Night</div>
           <div class="mr-plan-row-meta">
             <div class="mr-plan-row-when-where-item mr-plan-row-when-where-item--solo">
               <i class="ph-fill ph-map-pin" aria-hidden="true"></i>
               <span>Corner Tavern</span>
             </div>
             <div class="mr-plan-row-avatar-stack" aria-hidden="true">
               <div class="plan-card-mini-avatar-stack">
                 <img class="plan-card-mini-avatar" src="https://i.pravatar.cc/48?img=22" alt="" loading="lazy" />
               </div>
             </div>
           </div>
         </div>
       </div>
      </div>
     </div>
    </div>

    <div class="cal-section">Next Week</div>
    <div class="cal-list">
     <div class="mr-plan-rows">
      <div class="mr-plan-row mr-plan-row--photo-blur" style="--mr-plan-row-bg: url(https://images.unsplash.com/photo-1470229722913-7c0e2dbbafd3?auto=format&fit=crop&w=320&h=320&q=80);">
        <div class="mr-plan-row-media" style="background-image: url(https://images.unsplash.com/photo-1470229722913-7c0e2dbbafd3?auto=format&fit=crop&w=280&h=280&q=80);" aria-hidden="true"></div>
        <div class="mr-plan-row-content">
          <div class="plan-card-mini-time">THU, JUN 4TH &bull; 7 PM</div>
          <div class="mr-plan-row-title">Live Music Night</div>
          <div class="mr-plan-row-meta">
            <div class="mr-plan-row-when-where-item mr-plan-row-when-where-item--solo">
              <i class="ph-fill ph-map-pin" aria-hidden="true"></i>
              <span>Savannah Theatre</span>
            </div>
            <div class="mr-plan-row-avatar-stack" aria-hidden="true">
              <div class="plan-card-mini-avatar-stack">
                <img class="plan-card-mini-avatar" src="https://i.pravatar.cc/48?img=15" alt="" loading="lazy" />
              </div>
            </div>
          </div>
        </div>
      </div>
     </div>
    </div>

    <button type="button" class="cal-newplan">
      <i class="ph-fill ph-calendar-plus" aria-hidden="true"></i>
      New plan
    </button>

    <div style="height: 96px"></div>

    <div class="cal-tabwrap">
      <div class="mr-tab-bar" style="margin: 0 8px 0">
        <button type="button" class="mr-tab-item" aria-label="Home">
          <i class="ph ph-house" aria-hidden="true"></i>
        </button>
        <button type="button" class="mr-tab-item" aria-label="Explore">
          <i class="ph ph-compass" aria-hidden="true"></i>
        </button>
        <button type="button" class="mr-tab-item mr-tab-item--avatar" aria-label="You">
          <img class="mr-tab-avatar" src="https://i.pravatar.cc/72?img=11" alt="" width="36" height="36" loading="lazy" />
        </button>
        <button type="button" class="mr-tab-item mr-tab-active" aria-label="Calendar">
          <i class="ph-fill ph-calendar-blank" aria-hidden="true"></i>
        </button>
        <button type="button" class="mr-tab-item" aria-label="Messages">
          <i class="ph ph-chat-teardrop-text" aria-hidden="true"></i>
        </button>
      </div>
    </div>
  </div>
</div>

<script>
  (function () {
    const scope = document.querySelector('.calsg-scope');
    if (!scope) return;

    scope.querySelectorAll('.cal-filters .mr-chip').forEach(function (pill) {
      pill.addEventListener('click', function () {
        scope.querySelectorAll('.cal-filters .mr-chip').forEach(function (p) { p.classList.remove('mr-chip-active'); });
        pill.classList.add('mr-chip-active');
      });
    });

    const toggle = scope.querySelector('[data-declined-toggle]');
    const panel = scope.querySelector('[data-declined-panel]');
    if (toggle && panel) {
      toggle.addEventListener('click', function () {
        const open = panel.classList.toggle('is-open');
        toggle.classList.toggle('is-open', open);
        toggle.querySelector('.calsg-declined-label').textContent = open ? 'Hide declined' : '1 declined';
      });
    }
  })();
</script>
