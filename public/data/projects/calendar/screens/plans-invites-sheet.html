<link rel="stylesheet" href="../../../../styles/shared.css" />
<link rel="stylesheet" href="../../../../styles/ds.css" />
<link rel="stylesheet" href="../../../../data/design-system/company.css" />

<style>
  .ivsheet-scope, .ivsheet-scope * { scrollbar-width: none; -ms-overflow-style: none; box-sizing: border-box; }
  .ivsheet-scope::-webkit-scrollbar, .ivsheet-scope *::-webkit-scrollbar { display: none; width: 0; height: 0; }

  .ivsheet-scope .ivs-wrap { background: var(--bg-0); min-height: 844px; position: relative; overflow: hidden; }

  .ivsheet-scope .ivs-dim { position: absolute; inset: 0; background-size: cover; background-position: center; filter: brightness(0.4) saturate(0.8); }
  .ivsheet-scope .ivs-dim-shade { position: absolute; inset: 0; background: linear-gradient(180deg, rgba(8,10,14,0.5), rgba(8,10,14,0.85)); }

  .ivsheet-scope .ivs-sheet { position: absolute; left: 0; right: 0; bottom: 0; max-height: 86%; display: flex; flex-direction: column;
    background: var(--bg-0); border-radius: 26px 26px 0 0; border-top: 1px solid rgba(255,255,255,0.08); box-shadow: 0 -16px 50px rgba(0,0,0,0.5); }
  .ivsheet-scope .ivs-grab { width: 38px; height: 5px; border-radius: 999px; background: rgba(255,255,255,0.18); margin: 10px auto 4px; }

  .ivsheet-scope .ivs-head { padding: 8px 18px 12px; display: flex; align-items: flex-start; justify-content: space-between; }
  .ivsheet-scope .ivs-head-title { font-size: 1.3rem; font-weight: 800; letter-spacing: -0.02em; color: var(--text); }
  .ivsheet-scope .ivs-head-sub { font-size: 0.84rem; color: rgba(255,255,255,0.55); margin-top: 2px; }
  .ivsheet-scope .ivs-close { width: 32px; height: 32px; border-radius: 50%; border: 0; cursor: pointer; background: rgba(255,255,255,0.07); color: rgba(255,255,255,0.75); font-size: 16px; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }

  .ivsheet-scope .ivs-list { overflow-y: auto; padding: 2px 16px 0; }

  .ivsheet-scope .ivs-item { margin-bottom: 16px; }
  .ivsheet-scope .ivs-item.is-handled .mr-plan-row { opacity: 0.42; }

  .ivsheet-scope .ivs-item .mr-plan-rows { max-width: none; margin-bottom: 0; }
  .ivsheet-scope .ivs-item .mr-plan-row { align-items: stretch; }
  .ivsheet-scope .ivs-item .mr-plan-row-media { align-self: stretch; }
  .ivsheet-scope .ivs-item .mr-plan-row-meta { flex-wrap: nowrap; }
  .ivsheet-scope .ivs-item .mr-plan-row-when-where-item span { white-space: nowrap; }

  .ivsheet-scope .ivs-row-actions { display: flex; gap: 8px; margin-top: 11px; }
  .ivsheet-scope .ivs-mini { display: inline-flex; align-items: center; justify-content: center; gap: 6px; padding: 9px 14px; border-radius: 12px; font-size: 0.86rem; font-weight: 800; cursor: pointer; border: 1px solid transparent; }
  .ivsheet-scope .ivs-mini i { font-size: 15px; }
  .ivsheet-scope .ivs-mini-leave { background: rgba(255,255,255,0.05); border-color: rgba(255,255,255,0.1); color: rgba(255,255,255,0.65); }
  .ivsheet-scope .ivs-mini-accept { background: linear-gradient(135deg, #24b8aa, #4c87cf); color: #fff; flex: 1; }

  .ivsheet-scope .ivs-status { display: none; align-items: center; gap: 6px; margin-top: 9px; font-size: 0.84rem; font-weight: 800; }
  .ivsheet-scope .ivs-status.is-shown { display: inline-flex; }
  .ivsheet-scope .ivs-status.accept { color: var(--neon-teal); }
  .ivsheet-scope .ivs-status.maybe { color: rgba(255,255,255,0.7); }
  .ivsheet-scope .ivs-status.decline { color: rgba(255,255,255,0.5); }

  .ivsheet-scope .ivs-foot { padding: 12px 18px calc(14px + env(safe-area-inset-bottom)); }
  .ivsheet-scope .ivs-foot-btn { width: 100%; padding: 14px; border-radius: 14px; border: 1px solid rgba(255,255,255,0.12); cursor: pointer; background: #162433; color: rgba(255,255,255,0.92); font-size: 0.96rem; font-weight: 800; }
</style>

<div class="ivsheet-scope mr-scope">
  <div class="ivs-wrap">
    <div class="ivs-dim" style="background-image: url(https://images.unsplash.com/photo-1414235077428-338989a2e8c0?auto=format&fit=crop&w=600&q=70)"></div>
    <div class="ivs-dim-shade"></div>

    <div class="ivs-sheet">
      <div class="ivs-grab"></div>
      <div class="ivs-head">
        <div>
          <div class="ivs-head-title">Your invites</div>
          <div class="ivs-head-sub"><span class="ivs-pending-count">3</span> waiting on your reply</div>
        </div>
        <button type="button" class="ivs-close" aria-label="Close"><i class="ph ph-x"></i></button>
      </div>

      <div class="ivs-list">
        <div class="ivs-item" data-item>
          <div class="mr-plan-rows">
            <div class="mr-plan-row mr-plan-row--photo-blur" style="--mr-plan-row-bg: url(https://images.unsplash.com/photo-1414235077428-338989a2e8c0?auto=format&fit=crop&w=320&h=320&q=80);">
              <div class="mr-plan-row-media" style="background-image: url(https://images.unsplash.com/photo-1414235077428-338989a2e8c0?auto=format&fit=crop&w=280&h=280&q=80);" aria-hidden="true"></div>
              <div class="mr-plan-row-content">
                <div class="plan-card-mini-time">SAT, JUN 6TH &bull; 7:30 PM</div>
                <div class="mr-plan-row-title">Rooftop Dinner Party</div>
                <div class="mr-plan-row-meta">
                  <div class="mr-plan-row-when-where-item mr-plan-row-when-where-item--solo">
                    <i class="ph-fill ph-map-pin" aria-hidden="true"></i>
                    <span>The Highline Rooftop</span>
                  </div>
                  <div class="mr-plan-row-avatar-stack" aria-hidden="true">
                    <div class="plan-card-mini-avatar-stack">
                      <img class="plan-card-mini-avatar" src="https://i.pravatar.cc/48?img=32" alt="" loading="lazy" />
                    </div>
                  </div>
                </div>
                <div class="ivs-row-actions">
                  <button type="button" class="ivs-mini ivs-mini-leave" data-act="decline"><i class="ph ph-sign-out"></i> Leave</button>
                  <button type="button" class="ivs-mini ivs-mini-accept" data-act="accept"><i class="ph ph-check"></i> RSVP</button>
                </div>
                <div class="ivs-status"><i></i><span></span></div>
              </div>
            </div>
          </div>
        </div>

        <div class="ivs-item" data-item>
          <div class="mr-plan-rows">
            <div class="mr-plan-row mr-plan-row--photo-blur" style="--mr-plan-row-bg: url(https://images.unsplash.com/photo-1470229722913-7c0e2dbbafd3?auto=format&fit=crop&w=320&h=320&q=80);">
              <div class="mr-plan-row-media" style="background-image: url(https://images.unsplash.com/photo-1470229722913-7c0e2dbbafd3?auto=format&fit=crop&w=280&h=280&q=80);" aria-hidden="true"></div>
              <div class="mr-plan-row-content">
                <div class="plan-card-mini-time">SUN, JUN 7TH &bull; 10 AM</div>
                <div class="mr-plan-row-title">Morning Trail Run</div>
                <div class="mr-plan-row-meta">
                  <div class="mr-plan-row-when-where-item mr-plan-row-when-where-item--solo">
                    <i class="ph-fill ph-map-pin" aria-hidden="true"></i>
                    <span>Riverside Park Loop</span>
                  </div>
                  <div class="mr-plan-row-avatar-stack" aria-hidden="true">
                    <div class="plan-card-mini-avatar-stack">
                      <img class="plan-card-mini-avatar" src="https://i.pravatar.cc/48?img=15" alt="" loading="lazy" />
                    </div>
                  </div>
                </div>
                <div class="ivs-row-actions">
                  <button type="button" class="ivs-mini ivs-mini-leave" data-act="decline"><i class="ph ph-sign-out"></i> Leave</button>
                  <button type="button" class="ivs-mini ivs-mini-accept" data-act="accept"><i class="ph ph-check"></i> RSVP</button>
                </div>
                <div class="ivs-status"><i></i><span></span></div>
              </div>
            </div>
          </div>
        </div>

        <div class="ivs-item" data-item>
          <div class="mr-plan-rows">
            <div class="mr-plan-row mr-plan-row--photo-blur" style="--mr-plan-row-bg: url(https://images.unsplash.com/photo-1533174072545-7a4b6ad7a6c3?auto=format&fit=crop&w=320&h=320&q=80);">
              <div class="mr-plan-row-media" style="background-image: url(https://images.unsplash.com/photo-1533174072545-7a4b6ad7a6c3?auto=format&fit=crop&w=280&h=280&q=80);" aria-hidden="true"></div>
              <div class="mr-plan-row-content">
                <div class="plan-card-mini-time">FRI, JUN 12TH &bull; 8 PM</div>
                <div class="mr-plan-row-title">Game Night</div>
                <div class="mr-plan-row-meta">
                  <div class="mr-plan-row-when-where-item mr-plan-row-when-where-item--solo">
                    <i class="ph-fill ph-map-pin" aria-hidden="true"></i>
                    <span>Renee's Place · Westgate</span>
                  </div>
                  <div class="mr-plan-row-avatar-stack" aria-hidden="true">
                    <div class="plan-card-mini-avatar-stack">
                      <img class="plan-card-mini-avatar" src="https://i.pravatar.cc/48?img=47" alt="" loading="lazy" />
                    </div>
                  </div>
                </div>
                <div class="ivs-row-actions">
                  <button type="button" class="ivs-mini ivs-mini-leave" data-act="decline"><i class="ph ph-sign-out"></i> Leave</button>
                  <button type="button" class="ivs-mini ivs-mini-accept" data-act="accept"><i class="ph ph-check"></i> RSVP</button>
                </div>
                <div class="ivs-status"><i></i><span></span></div>
              </div>
            </div>
          </div>
        </div>
      </div>

      <div class="ivs-foot">
        <button type="button" class="ivs-foot-btn">Decide later</button>
      </div>
    </div>
  </div>
</div>

<script>
  (function () {
    const scope = document.querySelector('.ivsheet-scope');
    if (!scope) return;
    const countEl = scope.querySelector('.ivs-pending-count');
    const labels = {
      accept: { cls: 'accept', icon: 'ph-fill ph-check-circle', text: "You're going" },
      decline: { cls: 'decline', icon: 'ph-fill ph-sign-out', text: 'You left this plan' }
    };

    function refreshCount() {
      countEl.textContent = scope.querySelectorAll('.ivs-item:not(.is-handled)').length;
    }

    scope.querySelectorAll('.ivs-item').forEach(function (item) {
      item.querySelectorAll('[data-act]').forEach(function (btn) {
        btn.addEventListener('click', function () {
          const r = labels[btn.dataset.act];
          item.classList.add('is-handled');
          item.querySelector('.ivs-row-actions').style.display = 'none';
          const status = item.querySelector('.ivs-status');
          status.className = 'ivs-status is-shown ' + r.cls;
          status.querySelector('i').className = r.icon;
          status.querySelector('span').textContent = r.text;
          refreshCount();
        });
      });
    });
  })();
</script>
