<link rel="stylesheet" href="../../../../styles/shared.css" />
<link rel="stylesheet" href="../../../../styles/ds.css" />
<link rel="stylesheet" href="../../../../data/design-system/company.css" />

<div style="background: var(--bg-0); overflow-x: clip; min-height: 100vh">
  <div class="mr-scope">
    <div style="position: relative; padding: 18px 14px 20px; display: flex; flex-direction: column; align-items: center; background: radial-gradient(ellipse at top, rgba(91,165,255,0.18), transparent 70%)">
      <div style="position: absolute; top: 18px; left: 14px">
        <button type="button" class="mr-nav-icon-btn" aria-label="Back">
          <i class="ph ph-arrow-left" aria-hidden="true"></i>
        </button>
      </div>
      <div style="position: absolute; top: 18px; right: 14px; display: flex; gap: 6px">
        <button type="button" class="mr-nav-icon-btn" aria-label="Edit profile"><i class="ph ph-pencil-simple" aria-hidden="true"></i></button>
        <button type="button" class="mr-nav-icon-btn" aria-label="Settings"><i class="ph ph-gear" aria-hidden="true"></i></button>
      </div>

      <img src="https://i.pravatar.cc/200?img=11" alt="" style="width: 110px; height: 110px; border-radius: 50%; object-fit: cover; margin-top: 28px; border: 2px solid rgba(255,255,255,0.08)" />
      <h1 style="font-size: 1.45rem; font-weight: 800; color: var(--text); margin: 14px 0 4px">Brandon Unglaub</h1>
      <div style="font-size: 0.82rem; color: rgba(255,255,255,0.55)">@brandon · Joined Feb 2026</div>
    </div>

    <div style="padding: 14px 16px 8px; display: flex; align-items: center; justify-content: space-between">
      <div style="font-size: 0.95rem; font-weight: 800; color: var(--text)">Interests</div>
      <button type="button" style="font-size: 0.78rem; color: #f5c451; background: transparent; border: 0; font-weight: 800; cursor: pointer; letter-spacing: 0.04em; text-transform: uppercase">Edit</button>
    </div>
    <div style="padding: 0 16px 14px; display: flex; gap: 8px; flex-wrap: wrap">
      <span style="display: inline-flex; align-items: center; gap: 5px; padding: 7px 14px; border-radius: 999px; background: rgba(255,255,255,0.06); border: 1px solid rgba(255,255,255,0.1); color: var(--text); font-weight: 700; font-size: 0.82rem">
        <i class="ph-fill ph-barbell" style="color: #5ba5ff; font-size: 12px"></i> Weightlifting
      </span>
      <span style="display: inline-flex; align-items: center; gap: 5px; padding: 7px 14px; border-radius: 999px; background: rgba(255,255,255,0.06); border: 1px solid rgba(255,255,255,0.1); color: var(--text); font-weight: 700; font-size: 0.82rem">
        <i class="ph-fill ph-storefront" style="color: #5ba5ff; font-size: 12px"></i> Flea Markets
      </span>
      <span style="display: inline-flex; align-items: center; gap: 5px; padding: 7px 14px; border-radius: 999px; background: rgba(255,255,255,0.06); border: 1px solid rgba(255,255,255,0.1); color: var(--text); font-weight: 700; font-size: 0.82rem">
        <i class="ph-fill ph-cake" style="color: #5ba5ff; font-size: 12px"></i> Baking
      </span>
    </div>

    <div style="padding: 14px 16px 8px; display: flex; align-items: center; justify-content: space-between">
      <div>
        <div style="font-size: 0.95rem; font-weight: 800; color: var(--text)">Saved places</div>
        <div style="font-size: 0.74rem; color: rgba(255,255,255,0.5); margin-top: 2px">2 lists · 10 places</div>
      </div>
      <button type="button" style="font-size: 0.78rem; color: #f5c451; background: transparent; border: 0; font-weight: 800; cursor: pointer; letter-spacing: 0.04em; text-transform: uppercase; display: inline-flex; align-items: center; gap: 4px">
        <i class="ph-bold ph-plus" style="font-size: 11px"></i> New
      </button>
    </div>

    <div style="padding: 0 16px 14px; display: flex; gap: 10px; overflow-x: auto" class="ds-scroll-x">
      <button type="button" style="flex: 0 0 auto; width: 156px; padding: 14px; border-radius: 18px; background: linear-gradient(180deg, rgba(255,107,139,0.16), rgba(255,107,139,0.04)); border: 1px solid rgba(255,107,139,0.25); cursor: pointer; text-align: left; display: flex; flex-direction: column; gap: 8px">
        <div style="width: 40px; height: 40px; border-radius: 12px; background: rgba(255,107,139,0.22); display: flex; align-items: center; justify-content: center">
          <i class="ph-fill ph-heart" style="color: #ff6b8b; font-size: 22px"></i>
        </div>
        <div>
          <div style="font-size: 0.95rem; font-weight: 800; color: var(--text); margin-bottom: 2px">Favorites</div>
          <div style="font-size: 0.74rem; color: rgba(255,255,255,0.6)">7 places · Private</div>
        </div>
      </button>

      <button type="button" style="flex: 0 0 auto; width: 156px; padding: 14px; border-radius: 18px; background: linear-gradient(180deg, rgba(91,165,255,0.16), rgba(91,165,255,0.04)); border: 1px solid rgba(91,165,255,0.25); cursor: pointer; text-align: left; display: flex; flex-direction: column; gap: 8px">
        <div style="width: 40px; height: 40px; border-radius: 12px; background: rgba(91,165,255,0.22); display: flex; align-items: center; justify-content: center">
          <i class="ph-fill ph-clipboard-text" style="color: #5ba5ff; font-size: 22px"></i>
        </div>
        <div>
          <div style="font-size: 0.95rem; font-weight: 800; color: var(--text); margin-bottom: 2px">Asheville</div>
          <div style="display: flex; align-items: center; gap: 5px; font-size: 0.74rem; color: rgba(255,255,255,0.6)">
            <span>3 places</span>
            <span style="color: rgba(255,255,255,0.3)">·</span>
            <div style="display: flex">
              <img src="https://i.pravatar.cc/20?img=14" alt="" style="width: 14px; height: 14px; border-radius: 50%; border: 1.5px solid #0a1f30" />
              <img src="https://i.pravatar.cc/20?img=32" alt="" style="width: 14px; height: 14px; border-radius: 50%; border: 1.5px solid #0a1f30; margin-left: -4px" />
            </div>
          </div>
        </div>
      </button>

      <button type="button" style="flex: 0 0 auto; width: 156px; padding: 14px; border-radius: 18px; background: rgba(255,255,255,0.04); border: 1px dashed rgba(255,255,255,0.15); cursor: pointer; text-align: left; display: flex; flex-direction: column; gap: 8px; justify-content: center; align-items: center; min-height: 132px">
        <div style="width: 40px; height: 40px; border-radius: 12px; background: rgba(255,255,255,0.04); display: flex; align-items: center; justify-content: center">
          <i class="ph ph-plus" style="color: rgba(255,255,255,0.5); font-size: 20px"></i>
        </div>
        <div style="font-size: 0.82rem; color: rgba(255,255,255,0.6); font-weight: 700">New list</div>
      </button>
    </div>

    <div style="padding: 14px 16px 8px; display: flex; align-items: center; justify-content: space-between">
      <div style="font-size: 0.95rem; font-weight: 800; color: var(--text)">Plans</div>
      <button type="button" style="font-size: 0.78rem; color: rgba(255,255,255,0.6); background: transparent; border: 0; font-weight: 700; cursor: pointer">See all</button>
    </div>

    <div style="padding: 0 16px 24px; display: flex; gap: 10px; overflow-x: auto" class="ds-scroll-x">
      <div style="flex: 0 0 auto; width: 232px; height: 184px; border-radius: 18px; overflow: hidden; position: relative">
        <img src="https://images.unsplash.com/photo-1510915361894-db8b60106cb1?w=600&q=70" alt="" style="position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover" />
        <div style="position: absolute; inset: 0; background: linear-gradient(180deg, rgba(0,0,0,0) 40%, rgba(0,0,0,0.85))"></div>
        <div style="position: absolute; left: 12px; right: 12px; bottom: 12px">
          <div style="font-size: 0.62rem; color: rgba(255,255,255,0.7); font-weight: 800; letter-spacing: 0.06em; text-transform: uppercase; margin-bottom: 4px">Fri Apr 24 · 2 PM</div>
          <div style="font-size: 1rem; font-weight: 800; color: var(--text); margin-bottom: 2px">Wes Parker</div>
          <div style="display: inline-flex; align-items: center; gap: 4px; font-size: 0.74rem; color: rgba(255,255,255,0.7)">
            <i class="ph ph-map-pin" style="font-size: 11px"></i> Static Age Records
          </div>
        </div>
      </div>
      <div style="flex: 0 0 auto; width: 232px; height: 184px; border-radius: 18px; overflow: hidden; position: relative">
        <img src="https://images.unsplash.com/photo-1507525428034-b723cf961d3e?w=600&q=70" alt="" style="position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover" />
        <div style="position: absolute; inset: 0; background: linear-gradient(180deg, rgba(0,0,0,0) 40%, rgba(0,0,0,0.85))"></div>
        <div style="position: absolute; left: 12px; right: 12px; bottom: 12px">
          <div style="font-size: 0.62rem; color: rgba(255,255,255,0.7); font-weight: 800; letter-spacing: 0.06em; text-transform: uppercase; margin-bottom: 4px">Sun Mar 7</div>
          <div style="font-size: 1rem; font-weight: 800; color: var(--text); margin-bottom: 2px">Carnaval on the Mile</div>
          <div style="display: inline-flex; align-items: center; gap: 4px; font-size: 0.74rem; color: rgba(255,255,255,0.7)">
            <i class="ph ph-map-pin" style="font-size: 11px"></i> Miracle Mile
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
