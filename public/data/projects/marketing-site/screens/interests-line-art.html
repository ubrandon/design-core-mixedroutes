<style>
  .ila { position: relative; width: 300px; overflow: hidden; background: linear-gradient(160deg, #15619d 0%, #1b86bb 52%, #27a7cd 100%); font-family: "Geist", -apple-system, sans-serif; box-sizing: border-box; padding: 22px; }
  .ila * { box-sizing: border-box; }
  .ila-title { margin: 0; font-size: 19px; font-weight: 600; letter-spacing: -0.01em; color: #ffffff; }
  .ila-sub { margin: 4px 0 0; font-size: 12px; font-weight: 500; color: rgba(255, 255, 255, 0.85); }
  .ila-cards { display: flex; flex-direction: column; gap: 12px; margin-top: 16px; }
  .ila-card { border-radius: 16px; background: #0e2a3d; padding: 10px 8px; box-shadow: 0 8px 20px rgba(4, 26, 46, 0.35); overflow: hidden; }
  .ila-art svg { display: block; width: 100%; height: auto; }
</style>
