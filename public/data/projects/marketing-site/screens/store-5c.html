<style>
  .st5c { position: relative; width: 1284px; height: 2778px; overflow: hidden; background: #f5f2ec; font-family: "Geist", -apple-system, sans-serif; box-sizing: border-box; }
  .st5c * { box-sizing: border-box; }
  .st5c-texture { position: absolute; inset: 0; z-index: 0; pointer-events: none; }
  .st5c-texture svg { display: block; width: 100%; height: 100%; }
  .st5c-headline { position: absolute; top: 170px; left: 0; right: 0; z-index: 1; margin: 0; text-align: center; font-size: 124px; font-weight: 800; line-height: 1.06; letter-spacing: -0.02em; color: #1a2332; }
  .st5c-headline i { font-style: normal; background: linear-gradient(145deg, #14b8a6, #3b82f6); -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent; }
  .st5c-sub { position: absolute; top: 462px; left: 0; right: 0; z-index: 1; margin: 0; text-align: center; font-size: 56px; font-weight: 400; color: #5c6b7d; }
  .st5c-phone { position: absolute; top: 650px; left: 162px; z-index: 2; width: 960px; height: 1960px; border-radius: 130px; background: #1a1a1c; border: 5px solid #55555a; padding: 20px; box-shadow: 0 60px 140px rgba(26, 35, 50, 0.3); }
  .st5c-screen { position: relative; width: 100%; height: 100%; border-radius: 112px; background: #f2f2f7; overflow: hidden; padding: 50px 46px 0; }
  .st5c-island { position: absolute; top: 44px; left: 50%; transform: translateX(-50%); width: 260px; height: 72px; border-radius: 60px; background: #000; z-index: 5; }
  .st5c-header { display: flex; align-items: center; justify-content: space-between; margin-top: 60px; }
  .st5c-header h2 { margin: 0; font-size: 48px; font-weight: 800; color: #1a2332; }
  .st5c-header i { font-size: 48px; color: #1a2332; -webkit-text-stroke: 2px #1a2332; }
  .st5c-banner { position: relative; height: 300px; margin-top: 28px; border-radius: 48px; overflow: hidden; }
  .st5c-banner img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
  .st5c-banner-btns { position: absolute; left: 0; right: 0; bottom: 48px; display: flex; align-items: center; justify-content: center; gap: 14px; }
  .st5c-banner-btn { display: inline-flex; align-items: center; justify-content: center; gap: 14px; height: 84px; padding: 0 32px; border-radius: 24px; background: rgba(97, 97, 97, 0.2); backdrop-filter: blur(8px); border: 3px solid rgba(255, 255, 255, 0.2); color: #ffffff; font-size: 28px; font-weight: 700; text-shadow: 0 2px 8px rgba(0, 0, 0, 0.55); }
  .st5c-banner-btn i { font-size: 40px; filter: drop-shadow(0 2px 4px rgba(0, 0, 0, 0.55)); }
  .st5c-name { position: relative; display: flex; align-items: center; margin-top: 24px; min-height: 128px; padding: 0 112px; border-radius: 64px; background: rgba(118, 118, 128, 0.12); }
  .st5c-name .st5c-smiley { position: absolute; left: 40px; font-size: 44px; }
  .st5c-name .st5c-clear { position: absolute; right: 40px; font-size: 48px; color: #070c13; }
  .st5c-name b { font-size: 44px; font-weight: 400; color: #1a2332; }
  .st5c-tags { display: flex; gap: 14px; margin-top: 14px; }
  .st5c-chip { display: inline-flex; align-items: center; gap: 14px; height: 72px; padding: 0 28px; border-radius: 100px; background: #e4eefe; border: 3px solid rgba(0, 0, 0, 0.16); color: #1a2332; font-size: 28px; font-weight: 400; }
  .st5c-chip i { font-size: 36px; }
  .st5c-chip.is-on { background: #101724; border-color: rgba(0, 0, 0, 0.16); color: #e8edf5; font-weight: 700; }
  .st5c-h2 { margin: 24px 0 0; font-size: 44px; font-weight: 800; color: #101724; }

  /* Details reimagined as playful popups floating over the phone */
  .st5c-pop { position: absolute; z-index: 3; display: flex; align-items: center; gap: 36px; width: 880px; padding: 40px 48px 40px 40px; border-radius: 56px; background: #ffffff; border: 3px solid rgba(0, 0, 0, 0.1); box-shadow: 0 30px 60px rgba(26, 35, 50, 0.16), 0 70px 140px rgba(26, 35, 50, 0.16); }
  .st5c-pop-icon { flex: none; width: 136px; height: 136px; border-radius: 40px; display: flex; align-items: center; justify-content: center; font-size: 68px; }
  .st5c-pop-label { display: block; font-size: 27px; font-weight: 800; letter-spacing: 0.08em; text-transform: uppercase; color: #8a93a3; }
  .st5c-pop-value { display: block; margin-top: 8px; font-size: 42px; font-weight: 800; color: #1a2332; white-space: nowrap; }
  .st5c-pop-where { top: 1652px; left: 84px; transform: rotate(-2.5deg); }
  .st5c-pop-where .st5c-pop-body { flex: 1; min-width: 0; }
  .st5c-pop-where .st5c-pop-go { background: #e4eefe; color: #1a6fb5; }
  .st5c-pop-map { flex: none; width: 148px; height: 148px; border-radius: 40px; overflow: hidden; }
  .st5c-pop-map svg { display: block; width: 100%; height: 100%; }
  .st5c-pop-wear { top: 1805px; left: 322px; transform: rotate(2deg); }
  .st5c-pop-wear .st5c-pop-icon { background: #e4eefe; }
  .st5c-pop-link { top: 2010px; left: 140px; transform: rotate(-1.5deg); }
  .st5c-pop-link .st5c-pop-body { flex: 1; min-width: 0; }
  .st5c-pop-link img { flex: none; width: 148px; height: 148px; border-radius: 40px; object-fit: cover; }
  .st5c-pop-url { display: inline-flex; align-items: center; gap: 10px; margin-top: 12px; font-size: 30px; font-weight: 700; letter-spacing: 0.05em; text-transform: uppercase; text-decoration: underline; text-underline-offset: 6px; color: #e8880a; }
  .st5c-pop-go { flex: none; width: 104px; height: 104px; border-radius: 50%; background: #fdeeda; display: flex; align-items: center; justify-content: center; color: #e8880a; font-size: 54px; }
  .st5c-share { position: absolute; left: 46px; right: 46px; bottom: 64px; display: flex; align-items: center; justify-content: center; height: 112px; border-radius: 999px; background: linear-gradient(145deg, #14b8a6, #3b82f6); color: #ffffff; font-size: 38px; font-weight: 700; }
</style>
