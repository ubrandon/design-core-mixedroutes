<link rel="stylesheet" href="../../../../styles/shared.css" />
<link rel="stylesheet" href="../../../../styles/ds.css" />
<link rel="stylesheet" href="../../../../data/design-system/company.css" />
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" />
<style>
  .stfg { position: relative; width: 1024px; height: 500px; overflow: hidden; background: #f5f2ec; font-family: "Geist", -apple-system, sans-serif; box-sizing: border-box; }
  .stfg * { box-sizing: border-box; }
  .stfg-texture { position: absolute; inset: 0; z-index: 0; pointer-events: none; }
  .stfg-texture svg { display: block; width: 100%; height: 100%; }

  .stfg-headline { position: absolute; top: 78px; left: 68px; z-index: 2; margin: 0; font-size: 88px; font-weight: 800; line-height: 1.04; letter-spacing: -0.025em; color: #1a2332; }
  .stfg-headline i { font-style: normal; background: linear-gradient(145deg, #14b8a6, #3b82f6); -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent; }
  .stfg-sub { position: absolute; top: 296px; left: 70px; z-index: 2; margin: 0; max-width: 440px; font-size: 29px; font-weight: 400; line-height: 1.4; color: #5c6b7d; }

  .stfg-stack { position: absolute; top: 26px; right: 48px; z-index: 3; width: 470px; height: 640px; transform: rotate(-5deg); transform-origin: center; }
  .stfg-card { position: absolute; left: 0; width: 470px; border-radius: 30px; background: #ffffff; box-shadow: 0 34px 70px rgba(26, 35, 50, 0.32), 0 12px 28px rgba(26, 35, 50, 0.16); padding: 24px 32px 24px; }
  .stfg-card.is-lead .stfg-card-title { font-size: 38px; }
  .stfg-card.is-lead .stfg-card-loc { font-size: 26px; }
  .stfg-card:nth-child(1) { top: 10px; z-index: 3; }
  .stfg-card:nth-child(2) { top: 169px; z-index: 2; }
  .stfg-card:nth-child(3) { top: 293px; z-index: 1; }

  .stfg-card-head { display: flex; align-items: center; justify-content: space-between; }
  .stfg-card-foot { display: flex; align-items: center; justify-content: space-between; margin-top: 16px; }
  .stfg-card-foot .stfg-card-loc { margin-top: 0; }
  .stfg-chip.is-going { background: #22c55e; color: #ffffff; gap: 8px; box-shadow: 0 8px 20px rgba(34, 197, 94, 0.3); }
  .stfg-chip.is-going i { font-size: 24px; }

  .stfg-chip { display: inline-flex; align-items: center; height: 42px; padding: 0 20px; border-radius: 999px; font-size: 24px; font-weight: 700; letter-spacing: 0.06em; }
  .stfg-chip.is-grad { background: linear-gradient(145deg, #14b8a6, #3b82f6); color: #ffffff; box-shadow: 0 8px 20px rgba(6, 182, 212, 0.3); }
  .stfg-chip.is-quiet { background: #eef1f5; color: #5c6b7d; }

  .stfg-card-title { margin: 14px 0 0; font-size: 32px; font-weight: 700; color: #101724; letter-spacing: -0.01em; white-space: nowrap; }
  .stfg-card-loc { display: inline-flex; align-items: center; gap: 8px; margin-top: 8px; font-size: 24px; font-weight: 500; color: #5c6b7d; white-space: nowrap; }
  .stfg-card-loc i { font-size: 25px; color: #8794a4; }

  .stfg-avs { display: flex; align-items: center; flex: none; margin-right: 12px; }
  .stfg-av { width: 54px; height: 54px; border-radius: 50%; border: 4px solid #ffffff; margin-left: -17px; background-size: cover; background-position: center; }
  .stfg-av:first-child { margin-left: 0; }
  .stfg-av.is-more { display: flex; align-items: center; justify-content: center; background: #e9edf2; color: #5c6b7d; font-size: 20px; font-weight: 700; }
</style>

<div class="stfg">
  <!-- Faint interest line art on the warm paper ground, kept clear of the headline -->
  <div class="stfg-texture">
    <svg viewBox="0 0 1024 500" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <g stroke="#1a2332" stroke-width="3" opacity="0.055">
        <g transform="translate(20 320) scale(0.55) rotate(-5)">
          <path d="M55 340 L140 190 L225 340 Z" />
          <path d="M114 340 L140 262 L166 340" />
          <path d="M140 190 V 158 M140 158 L170 167 L140 176" />
          <path d="M232 340 L320 200 L408 340" opacity="0.6" />
          <line x1="40" y1="340" x2="440" y2="340" />
        </g>
        <g transform="translate(440 20) scale(0.45) rotate(8)">
          <path d="M215 336 c -50 0 -82 -33 -82 -72 c 0 -30 20 -47 42 -53 c 19 -5 32 -17 36 -35 c 4 18 17 30 36 35 c 22 6 42 23 42 53 c 0 39 -32 72 -74 72 Z" />
          <circle cx="215" cy="258" r="24" />
          <path d="M205 176 L201 84 M225 176 L229 84" />
          <path d="M197 84 L233 84 L238 34 L192 34 Z" />
        </g>
        <g transform="translate(430 360) scale(0.42) rotate(-8)">
          <rect x="130" y="148" width="300" height="184" rx="24" />
          <path d="M228 148 L244 116 h72 L332 148" />
          <circle cx="280" cy="238" r="64" />
          <circle cx="280" cy="238" r="40" />
        </g>
        <path d="M400 250 v18 M391 259 h18" />
        <circle cx="620" cy="470" r="3" /><circle cx="60" cy="60" r="3" /><circle cx="500 " cy="130" r="3" />
      </g>
      <g stroke="#f2945c" stroke-width="3" opacity="0.11">
        <g transform="translate(20 320) scale(0.55) rotate(-5)">
          <path d="M242 332 C 234 312 246 298 258 278 C 268 296 278 310 272 330 C 264 338 250 338 242 332 Z" />
        </g>
        <g transform="translate(440 20) scale(0.45)">
          <path d="M390 268 V 212 c 11 4 18 11 20 22" />
          <circle cx="379" cy="270" r="12" />
        </g>
      </g>
    </svg>
  </div>

  <h1 class="stfg-headline">Go where<br /><i>life</i> is.</h1>
  <p class="stfg-sub">Plans with people who show up.</p>

  <!-- Fanned plan cards bleeding off the right edge -->
  <div class="stfg-stack">
    <div class="stfg-card is-lead">
      <div class="stfg-card-head">
        <span class="stfg-chip is-grad">TODAY &middot; 2 PM</span>
        <div class="stfg-avs">
          <span class="stfg-av" style="background-image: url('../img/stock-av-1.jpg');"></span>
          <span class="stfg-av" style="background-image: url('../img/stock-av-2.jpg');"></span>
          <span class="stfg-av is-more">+4</span>
        </div>
      </div>
      <h2 class="stfg-card-title">Music Festival &#127928;</h2>
      <div class="stfg-card-foot">
        <span class="stfg-card-loc"><i class="ph-fill ph-map-pin"></i>Festival Location</span>
        <span class="stfg-chip is-going"><i class="ph-fill ph-check"></i>Going</span>
      </div>
    </div>
    <div class="stfg-card">
      <span class="stfg-chip is-quiet">SAT &middot; 7 PM</span>
      <h2 class="stfg-card-title">Game Night &#127918;</h2>
      <span class="stfg-card-loc"><i class="ph-fill ph-map-pin"></i>Remote</span>
    </div>
    <div class="stfg-card">
      <span class="stfg-chip is-quiet">SUN &middot; 9 AM</span>
      <h2 class="stfg-card-title">Hiking Trip &#129406;</h2>
      <span class="stfg-card-loc"><i class="ph-fill ph-map-pin"></i>Mountain Trail</span>
    </div>
  </div>
</div>
