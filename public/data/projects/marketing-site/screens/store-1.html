<link rel="stylesheet" href="../../../../styles/shared.css" />
<link rel="stylesheet" href="../../../../styles/ds.css" />
<link rel="stylesheet" href="../../../../data/design-system/company.css" />
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" />
<style>
  .st1 { position: relative; width: 1284px; height: 2778px; overflow: hidden; background: linear-gradient(155deg, #0e3866 0%, #14528c 48%, #1a76ae 100%); font-family: "Geist", -apple-system, sans-serif; box-sizing: border-box; }
  .st1 * { box-sizing: border-box; }
  .st1-headline { position: absolute; top: 150px; left: 150px; margin: 0; font-size: 196px; font-weight: 900; line-height: 0.98; letter-spacing: -0.01em; background: linear-gradient(100deg, #35a2f0 5%, #45f0d0 95%); -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent; }
  .st1-sub { position: absolute; top: 590px; left: 155px; margin: 0; max-width: 620px; font-size: 66px; font-weight: 300; line-height: 1.35; color: #ffffff; }

  /* Shared feed phone -- identical geometry on both panels, panel 2 shifts left by 1284 */
  .st1-phone { position: absolute; top: 800px; left: 400px; width: 1080px; height: 2300px; transform: rotate(-12deg); transform-origin: top left; border-radius: 150px; background: #1a1a1c; border: 5px solid #55555a; padding: 22px; box-shadow: -60px 80px 160px rgba(0, 10, 30, 0.55); }
  .st1-btn-side { position: absolute; left: -11px; width: 7px; border-radius: 4px; background: #606066; }
  .st1-screen { position: relative; width: 100%; height: 100%; border-radius: 128px; background: #0b0b10; overflow: hidden; padding: 54px 56px 0; }
  .st1-island { position: absolute; top: 54px; left: 50%; transform: translateX(-50%); width: 300px; height: 84px; border-radius: 60px; background: #000; z-index: 5; display: flex; align-items: center; justify-content: flex-end; padding-right: 26px; }
  .st1-island span { width: 34px; height: 34px; border-radius: 50%; background: radial-gradient(circle at 35% 35%, #2a3a55 0%, #0a0d14 60%); }

  .st1-header { display: flex; align-items: center; justify-content: space-between; margin-top: 130px; }
  .st1-header img { height: 66px; }
  .st1-header-right { display: flex; align-items: center; gap: 40px; }
  .st1-header-right i { font-size: 54px; color: #e8edf5; }
  .st1-avatar { width: 78px; height: 78px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 52px; background: linear-gradient(140deg, #c9b08a, #8a6f4e); }

  .st1-tabs { display: flex; gap: 22px; margin-top: 66px; width: 1400px; }
  .st1-tab { display: inline-flex; align-items: center; gap: 16px; height: 90px; padding: 0 34px; border-radius: 60px; font-size: 34px; font-weight: 700; color: #dbe3ee; background: rgba(52, 65, 88, 0.55); white-space: nowrap; }
  .st1-tab i { font-size: 40px; }
  .st1-tab.is-on { background: #ffffff; color: #101724; }
  .st1-tab.is-on i { color: #d64545; }

  .st1-section { margin: 78px 0 36px; font-size: 56px; font-weight: 600; color: #ffffff; }
  .st1-card { position: relative; border-radius: 52px; overflow: hidden; height: 600px; margin-bottom: 56px; }
  .st1-card-photo { position: absolute; inset: 0; width: 100%; height: 62%; object-fit: cover; }
  .st1-card-body { position: absolute; left: 0; right: 0; bottom: 0; height: 46%; padding: 80px 44px 0; }
  .st1-card.is-purple .st1-card-body { background: linear-gradient(120deg, #5b2fb8 0%, #8b5cf6 100%); }
  .st1-card.is-green .st1-card-body { background: linear-gradient(120deg, #0e8a6c 0%, #2fb98d 100%); }
  .st1-card.is-orange .st1-card-body { background: linear-gradient(120deg, #b35a14 0%, #e08a2e 100%); }
  .st1-when { position: absolute; top: -36px; left: 44px; display: inline-flex; align-items: center; height: 74px; padding: 0 36px; border-radius: 50px; background: rgba(15, 20, 30, 0.72); color: #ffffff; font-size: 30px; font-weight: 700; letter-spacing: 0.14em; }
  .st1-card-title { margin: 0; font-size: 52px; font-weight: 800; color: #ffffff; }
  .st1-card-loc { display: flex; align-items: center; gap: 14px; margin-top: 14px; font-size: 33px; font-weight: 500; color: rgba(255, 255, 255, 0.9); }
  .st1-card-loc i { font-size: 34px; }
  .st1-going { position: absolute; right: 40px; bottom: 96px; display: flex; align-items: center; }
  .st1-going span { width: 64px; height: 64px; border-radius: 50%; border: 4px solid rgba(255, 255, 255, 0.85); margin-left: -20px; display: flex; align-items: center; justify-content: center; font-size: 40px; }
  .st1-going .st1-more { background: #1f2937; color: #fff; font-size: 26px; font-weight: 700; }
</style>

<div class="st1">
  <h1 class="st1-headline">Life&rsquo;s<br />offline.</h1>
  <p class="st1-sub">We just help get you there.</p>

  <div class="st1-phone">
    <span class="st1-btn-side" style="top: 420px; height: 90px;"></span>
    <span class="st1-btn-side" style="top: 560px; height: 150px;"></span>
    <span class="st1-btn-side" style="top: 740px; height: 150px;"></span>
    <div class="st1-screen">
      <div class="st1-island"><span></span></div>

      <div class="st1-header">
        <img src="../img/white-logo.svg" alt="MixedRoutes" />
        <div class="st1-header-right">
          <i class="ph ph-question"></i>
          <i class="ph ph-bell"></i>
          <div class="st1-avatar">🧑‍🦱</div>
        </div>
      </div>

      <div class="st1-tabs">
        <span class="st1-tab is-on"><i class="ph-fill ph-calendar-heart"></i>Upcoming</span>
        <span class="st1-tab"><i class="ph-fill ph-bookmark-simple"></i>Someday</span>
        <span class="st1-tab"><i class="ph-fill ph-envelope-simple"></i>Invites (3)</span>
        <span class="st1-tab"><i class="ph-fill ph-clock"></i>Past</span>
      </div>

      <div class="st1-section">Today</div>
      <div class="st1-card is-purple">
        <img class="st1-card-photo" src="https://images.unsplash.com/photo-1470229722913-7c0e2dbbafd3?auto=format&fit=crop&w=1200&q=75" alt="" />
        <div class="st1-card-body">
          <span class="st1-when">TODAY, 2 PM</span>
          <h3 class="st1-card-title">Music Festival 🎸</h3>
          <div class="st1-card-loc"><i class="ph-fill ph-map-pin"></i>Festival Location</div>
          <div class="st1-going">
            <span style="background: #f3c6a5; margin-left: 0;">👩</span>
            <span style="background: #b8d4f0;">🧔</span>
            <span style="background: #f0d9b8;">👨</span>
            <span style="background: #e8c4d8;">👩‍🦰</span>
            <span class="st1-more">+3</span>
          </div>
        </div>
      </div>

      <div class="st1-section">This week</div>
      <div class="st1-card is-green">
        <img class="st1-card-photo" src="https://images.unsplash.com/photo-1551632811-561732d1e306?auto=format&fit=crop&w=1200&q=75" alt="" />
        <div class="st1-card-body">
          <span class="st1-when">SATURDAY, 9 AM</span>
          <h3 class="st1-card-title">Hiking Trip 🥾</h3>
          <div class="st1-card-loc"><i class="ph-fill ph-map-pin"></i>Mountain Trail</div>
          <div class="st1-going">
            <span style="background: #b8d4f0; margin-left: 0;">🧑</span>
            <span style="background: #f3c6a5;">👩‍🦰</span>
            <span style="background: #d8e4c8;">👨‍🦱</span>
            <span class="st1-more">+3</span>
          </div>
        </div>
      </div>

      <div class="st1-card is-orange">
        <img class="st1-card-photo" src="https://images.unsplash.com/photo-1543007630-9710e4a00a20?auto=format&fit=crop&w=1200&q=75" alt="" />
        <div class="st1-card-body">
          <span class="st1-when">FRIDAY, 7 PM</span>
          <h3 class="st1-card-title">Game Night 🎮</h3>
          <div class="st1-card-loc"><i class="ph-fill ph-map-pin"></i>Alex&rsquo;s Place</div>
        </div>
      </div>
    </div>
  </div>
</div>
