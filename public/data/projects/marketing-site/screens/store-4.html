<style>
  .st4 { position: relative; width: 1284px; height: 2778px; overflow: hidden; background: linear-gradient(160deg, #166ba6 0%, #2090c2 55%, #2ea4d2 100%); font-family: "Geist", -apple-system, sans-serif; box-sizing: border-box; }
  .st4 * { box-sizing: border-box; }
  .st4-headline { position: absolute; top: 190px; left: 0; right: 0; margin: 0; text-align: center; font-size: 120px; font-weight: 900; line-height: 1.06; letter-spacing: -0.01em; color: #ffffff; }
  .st4-sub { position: absolute; top: 510px; left: 0; right: 0; margin: 0; text-align: center; font-size: 56px; font-weight: 400; color: rgba(255, 255, 255, 0.95); }
  .st4-phone { position: absolute; top: 740px; left: 162px; width: 960px; height: 1960px; border-radius: 130px; background: #1a1a1c; border: 5px solid #55555a; padding: 20px; box-shadow: 0 60px 140px rgba(0, 10, 30, 0.5); }
  .st4-screen { position: relative; width: 100%; height: 100%; border-radius: 112px; background: #f2f2f7; overflow: hidden; padding: 50px 46px 0; }

  .st4-header-right { display: flex; align-items: center; gap: 38px; }

  .st4-tabs { display: flex; gap: 16px; margin-top: 48px; width: 1400px; }
  .st4-chip { display: inline-flex; align-items: center; gap: 14px; height: 72px; padding: 0 28px; border-radius: 100px; background: #e4eefe; border: 3px solid rgba(0, 0, 0, 0.16); color: #1a2332; font-size: 28px; font-weight: 600; white-space: nowrap; }
  .st4-chip i { font-size: 36px; }

  .st4-spacer { height: 860px; }
  .st4-card { position: relative; display: flex; gap: 16px; padding: 16px; border-radius: 64px; background: #1d232b; color: #ffffff; overflow: hidden; isolation: isolate; box-shadow: 0 8px 16px rgba(0, 0, 0, 0.06), 0 16px 40px rgba(0, 0, 0, 0.1); margin-bottom: 32px; }
  .st4-card::after { content: ""; position: absolute; inset: 0; border-radius: 64px; border: 2px solid rgba(255, 255, 255, 0.2); pointer-events: none; }

  .st4-card-copy { flex: 1; min-width: 0; display: flex; flex-direction: column; justify-content: center; gap: 12px; padding: 0 12px; }
  .st4-when { margin: 0; font-size: 28px; font-weight: 700; text-transform: uppercase; color: rgba(255, 255, 255, 0.7); line-height: 1; }
  .st4-card-title { margin: 0; font-size: 44px; font-weight: 700; line-height: 1.2; color: #ffffff; }
  .st4-meta { display: flex; align-items: center; justify-content: space-between; min-height: 48px; }
  .st4-loc { display: flex; align-items: center; gap: 10px; font-size: 28px; font-weight: 500; color: #ffffff; min-width: 0; }
  .st4-loc i { font-size: 32px; }
  .st4-avs { display: flex; align-items: center; flex: none; }
  .st4-avs span { width: 52px; height: 52px; border-radius: 50%; margin-left: -12px; display: flex; align-items: center; justify-content: center; font-size: 32px; }
  .st4-avs .st4-more { background: #7d8ca1; color: #fff; font-size: 22px; font-weight: 700; }
  .st4-fab { position: absolute; right: 46px; bottom: 200px; z-index: 6; display: inline-flex; align-items: center; gap: 16px; height: 112px; padding: 0 44px; border-radius: 999px; background: linear-gradient(145deg, #14b8a6, #3b82f6); color: #ffffff; font-size: 34px; font-weight: 700; box-shadow: 0 12px 36px rgba(0, 0, 0, 0.2); }
  .st4-fab i { font-size: 44px; }
  .st4-nav { position: absolute; left: 0; right: 0; bottom: 0; height: 160px; display: flex; align-items: center; justify-content: space-around; padding: 0 60px; background: #ffffff; box-shadow: 0 -8px 24px rgba(0, 0, 0, 0.12); }
  .st4-nav i { font-size: 56px; color: #3e4558; }
  .st4-nav i.is-on { color: #101724; }
  .st4-nav-you { width: 60px; height: 60px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 40px; background: linear-gradient(140deg, #c9b08a, #8a6f4e); }
  .st4-hero { position: absolute; left: 40px; right: 40px; top: 1300px; z-index: 8; }
  .st4-hero .st4-card { margin: 0; padding: 24px; box-shadow: 0 50px 120px rgba(0, 10, 30, 0.5); }
  .st4-hero .st4-thumb { width: 300px; height: 300px; }
  .st4-hero .st4-when { font-size: 32px; }
  .st4-hero .st4-card-title { font-size: 56px; }
  .st4-hero .st4-loc { font-size: 32px; }
  .st4-hero .st4-avs span { width: 62px; height: 62px; font-size: 40px; }
  .st4-pill { position: absolute; top: -46px; right: 44px; z-index: 9; display: inline-flex; align-items: center; gap: 14px; height: 96px; padding: 0 44px; border-radius: 999px; background: #2fd7a8; color: #06251b; font-size: 38px; font-weight: 800; box-shadow: 0 20px 50px rgba(6, 60, 30, 0.45); }
  .st4-pill i { font-size: 42px; }
</style>
