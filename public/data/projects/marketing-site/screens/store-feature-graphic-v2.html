<style>
  .stfg2 { position: relative; width: 1024px; height: 500px; overflow: hidden; background: #f5f2ec; font-family: "Geist", -apple-system, sans-serif; box-sizing: border-box; }
  .stfg2 * { box-sizing: border-box; }
  .stfg2-texture { position: absolute; inset: 0; z-index: 0; pointer-events: none; }
  .stfg2-texture svg { display: block; width: 100%; height: 100%; }

  .stfg2-headline { position: absolute; top: 78px; left: 68px; z-index: 2; margin: 0; font-size: 88px; font-weight: 800; line-height: 1.04; letter-spacing: -0.025em; color: #1a2332; }
  .stfg2-headline i { font-style: normal; background: linear-gradient(145deg, #14b8a6, #3b82f6); -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent; }
  .stfg2-sub { position: absolute; top: 296px; left: 70px; z-index: 2; margin: 0; max-width: 465px; font-size: 29px; font-weight: 400; line-height: 1.4; color: #5c6b7d; white-space: nowrap; }

  .stfg2-stack { position: absolute; top: 12px; right: 8px; z-index: 3; width: 488px; height: 560px; }
  .stfg2-card { position: absolute; width: 444px; min-height: 158px; border-radius: 28px; background: #ffffff; box-shadow: 0 34px 48px rgba(26, 35, 50, 0.31), 0 13px 22px rgba(26, 35, 50, 0.15); padding: 18px 28px 16px; transform-origin: center; }
  .stfg2-card:nth-child(1) { top: 4px; left: 14px; z-index: 3; transform: rotate(-1.1deg); }
  .stfg2-card:nth-child(2) { top: 125px; left: 22px; z-index: 2; transform: rotate(0.65deg); }
  .stfg2-card:nth-child(3) { top: 246px; left: 16px; z-index: 1; transform: rotate(-0.35deg); }
  .stfg2-card:not(:first-child) .stfg2-chip { visibility: hidden; }

  .stfg2-chip { display: inline-flex; align-items: center; height: 36px; padding: 0 17px; border-radius: 999px; font-size: 20px; font-weight: 700; letter-spacing: 0.06em; }
  .stfg2-chip.is-grad { background: linear-gradient(145deg, #14b8a6, #3b82f6); color: #ffffff; box-shadow: 0 8px 20px rgba(6, 182, 212, 0.3); }
  .stfg2-chip.is-quiet { background: #eef1f5; color: #5c6b7d; }

  .stfg2-title { margin: 9px 0 0; font-size: 29px; font-weight: 700; line-height: 1.05; color: #101724; letter-spacing: -0.01em; white-space: nowrap; }
  .stfg2-foot { display: flex; align-items: flex-end; justify-content: space-between; gap: 16px; margin-top: 10px; }
  .stfg2-loc { display: inline-flex; align-items: center; gap: 7px; min-width: 0; padding-bottom: 4px; font-size: 20px; font-weight: 500; color: #5c6b7d; white-space: nowrap; }
  .stfg2-loc i { flex: none; font-size: 21px; color: #8794a4; }

  .stfg2-avs { display: flex; align-items: center; justify-content: flex-end; flex: none; }
  .stfg2-av { width: 42px; height: 42px; border-radius: 50%; border: 4px solid #ffffff; margin-left: -14px; background-size: cover; background-position: center; box-shadow: 0 3px 8px rgba(26, 35, 50, 0.12); }
  .stfg2-av:first-child { margin-left: 0; }
  .stfg2-av.is-more { display: flex; align-items: center; justify-content: center; background: #e9edf2; color: #5c6b7d; font-size: 16px; font-weight: 700; }

  .stfg2-going { position: absolute; top: 27px; right: -28px; display: grid; place-items: center; width: 60px; height: 60px; padding: 0; border: 6px solid #ffffff; border-radius: 50%; background: #22c55e; color: #ffffff; box-shadow: 0 12px 28px rgba(34, 197, 94, 0.38); }
  .stfg2-going i { font-size: 29px; line-height: 1; }
</style>

  <h1 class="stfg2-headline">Go where<br /><i>life</i> is.</h1>

    <article class="stfg2-card">
      <span class="stfg2-chip is-grad">TODAY &middot; 2 PM</span>
