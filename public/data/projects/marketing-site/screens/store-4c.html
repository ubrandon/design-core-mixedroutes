<style>
  .st4c { position: relative; width: 1284px; height: 2778px; overflow: hidden; background: #f5f2ec; font-family: "Geist", -apple-system, sans-serif; box-sizing: border-box; }
  .st4c * { box-sizing: border-box; }
  .st4c-texture { position: absolute; inset: 0; z-index: 0; pointer-events: none; }
  .st4c-texture svg { display: block; width: 100%; height: 100%; }
  .st4c-headline { position: absolute; top: 170px; left: 0; right: 0; z-index: 1; margin: 0; text-align: center; font-size: 124px; font-weight: 800; line-height: 1.06; letter-spacing: -0.02em; color: #1a2332; }
  .st4c-headline i { font-style: normal; background: linear-gradient(145deg, #14b8a6, #3b82f6); -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent; }
  .st4c-sub { position: absolute; top: 462px; left: 0; right: 0; z-index: 1; margin: 0; text-align: center; font-size: 56px; font-weight: 400; color: #5c6b7d; }
  .st4c-phone { position: absolute; top: 650px; left: 162px; z-index: 2; width: 960px; height: 1960px; border-radius: 130px; background: #1a1a1c; border: 5px solid #55555a; padding: 20px; box-shadow: 0 60px 140px rgba(26, 35, 50, 0.3); }
  .st4c-screen { position: relative; width: 100%; height: 100%; border-radius: 112px; background: #f2f2f7; overflow: hidden; padding: 50px 46px 0; }
  .st4c-island { position: absolute; top: 44px; left: 50%; transform: translateX(-50%); width: 260px; height: 72px; border-radius: 60px; background: #000; z-index: 5; }
  .st4c-header { display: flex; align-items: center; justify-content: space-between; margin-top: 150px; }
  .st4c-header h2 { margin: 0; font-size: 52px; font-weight: 700; color: #1a2332; }
  .st4c-header-right { display: flex; align-items: center; gap: 38px; }
  .st4c-header-right i { font-size: 48px; color: #1a2332; }
  .st4c-tabs { display: flex; gap: 16px; margin-top: 48px; width: 1400px; }
  .st4c-chip { display: inline-flex; align-items: center; gap: 14px; height: 72px; padding: 0 28px; border-radius: 100px; background: #e4eefe; border: 3px solid rgba(0, 0, 0, 0.16); color: #1a2332; font-size: 28px; font-weight: 600; white-space: nowrap; }
  .st4c-chip i { font-size: 36px; }
  .st4c-chip.is-on { background: #101724; color: #e8edf5; font-weight: 700; }
  .st4c-spacer { height: 860px; }
  .st4c-card { position: relative; display: flex; gap: 16px; padding: 16px; border-radius: 64px; background: #1d232b; color: #ffffff; overflow: hidden; isolation: isolate; box-shadow: 0 8px 16px rgba(0, 0, 0, 0.06), 0 16px 40px rgba(0, 0, 0, 0.1); margin-bottom: 32px; }
  .st4c-card::after { content: ""; position: absolute; inset: 0; border-radius: 64px; border: 2px solid rgba(255, 255, 255, 0.2); pointer-events: none; }
  .st4c-glow { position: absolute; inset: 0; background-size: cover; background-position: center; filter: blur(40px) saturate(3.5); opacity: 0.85; transform: scale(1.6); z-index: -1; }
  .st4c-thumb { width: 224px; height: 224px; border-radius: 48px; background-size: cover; background-position: center; border: 2px solid rgba(255, 255, 255, 0.2); flex: none; }
  .st4c-card-copy { flex: 1; min-width: 0; display: flex; flex-direction: column; justify-content: center; gap: 12px; padding: 0 12px; }
  .st4c-when { margin: 0; font-size: 28px; font-weight: 700; text-transform: uppercase; color: rgba(255, 255, 255, 0.7); line-height: 1; }
  .st4c-card-title { margin: 0; font-size: 44px; font-weight: 700; line-height: 1.2; color: #ffffff; }
  .st4c-meta { display: flex; align-items: center; justify-content: space-between; min-height: 48px; }
  .st4c-loc { display: flex; align-items: center; gap: 10px; font-size: 28px; font-weight: 500; color: #ffffff; min-width: 0; }
  .st4c-loc i { font-size: 32px; }
  .st4c-avs { display: flex; align-items: center; flex: none; }
  .st4c-avs span { width: 52px; height: 52px; border-radius: 50%; margin-left: -12px; display: flex; align-items: center; justify-content: center; font-size: 32px; }
  .st4c-avs .st4c-more { background: #7d8ca1; color: #fff; font-size: 22px; font-weight: 700; }
  .st4c-fab { position: absolute; right: 46px; bottom: 200px; z-index: 6; display: inline-flex; align-items: center; gap: 16px; height: 112px; padding: 0 44px; border-radius: 999px; background: linear-gradient(145deg, #14b8a6, #3b82f6); color: #ffffff; font-size: 34px; font-weight: 700; box-shadow: 0 12px 36px rgba(0, 0, 0, 0.2); }
  .st4c-fab i { font-size: 44px; }
  .st4c-nav { position: absolute; left: 0; right: 0; bottom: 0; height: 160px; display: flex; align-items: center; justify-content: space-around; padding: 0 60px; background: #ffffff; box-shadow: 0 -8px 24px rgba(0, 0, 0, 0.12); }
  .st4c-nav i { font-size: 56px; color: #3e4558; }
  .st4c-nav i.is-on { color: #101724; }
  .st4c-nav-you { width: 60px; height: 60px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 40px; background: linear-gradient(140deg, #c9b08a, #8a6f4e); }
  .st4c-hero { position: absolute; left: 40px; right: 40px; top: 1210px; z-index: 8; }
  .st4c-hero .st4c-card { margin: 0; padding: 24px; box-shadow: 0 50px 120px rgba(26, 35, 50, 0.4); }
  .st4c-hero .st4c-thumb { width: 300px; height: 300px; }
  .st4c-hero .st4c-when { font-size: 32px; }
  .st4c-hero .st4c-card-title { font-size: 56px; }
  .st4c-hero .st4c-loc { font-size: 32px; }
  .st4c-hero .st4c-avs span { width: 62px; height: 62px; font-size: 40px; }
  .st4c-pill { position: absolute; top: -46px; right: 44px; z-index: 9; display: inline-flex; align-items: center; gap: 14px; height: 96px; padding: 0 44px; border-radius: 999px; background: #2fd7a8; color: #06251b; font-size: 38px; font-weight: 800; box-shadow: 0 20px 50px rgba(6, 60, 30, 0.35); }
  .st4c-pill i { font-size: 42px; }
</style>
