<link rel="stylesheet" href="../../../../styles/shared.css" />

<div style="background: var(--bg-0); overflow-x: clip; min-height: 100vh">
  <div class="mr-scope">
    <header style="display: flex; align-items: center; gap: 8px; padding: 18px 16px 8px">
      <button type="button" class="mr-nav-icon-btn" aria-label="Back">
        <i class="ph ph-arrow-left" aria-hidden="true"></i>
      </button>
      <span style="font-size: 1.1rem; font-weight: 800; color: var(--text)">Members</span>
      <span style="font-size: 0.78rem; color: rgba(255,255,255,0.5); margin-left: 4px">12</span>
    </header>

    <div style="padding: 6px 16px 12px">
      <div class="mr-search-bar">
        <i class="ph-fill ph-magnifying-glass" aria-hidden="true"></i>
        <input type="search" placeholder="Search members" autocomplete="off" />
      </div>
    </div>

    <button
      type="button"
      style="
        display: flex;
        align-items: center;
        gap: 12px;
        width: 100%;
        background: transparent;
        border: 0;
        padding: 12px 16px;
        text-align: left;
      "
    >
      <div
        style="
          width: 44px;
          height: 44px;
          border-radius: 50%;
          background: linear-gradient(135deg, #6dd5ed, #2193b0);
          display: flex;
          align-items: center;
          justify-content: center;
          color: #06080e;
        "
        aria-hidden="true"
      >
        <i class="ph-fill ph-user-plus" style="font-size: 20px"></i>
      </div>
      <div style="flex: 1">
        <div style="font-size: 0.95rem; font-weight: 800; color: var(--text)">Invite people</div>
        <div style="font-size: 0.78rem; color: rgba(255,255,255,0.5)">Add friends or share an invite link</div>
      </div>
      <i class="ph ph-caret-right" style="font-size: 14px; color: rgba(255,255,255,0.4)"></i>
    </button>

    <div style="padding: 12px 16px 6px">
      <div style="font-size: 0.7rem; font-weight: 800; color: rgba(255,255,255,0.45); letter-spacing: 0.08em; text-transform: uppercase">Admins · 1</div>
    </div>

    <div style="display: flex; align-items: center; gap: 12px; padding: 10px 16px">
      <img src="https://i.pravatar.cc/72?img=11" alt="" style="width: 44px; height: 44px; border-radius: 50%; object-fit: cover" loading="lazy" />
      <div style="flex: 1; min-width: 0">
        <div style="display: flex; align-items: center; gap: 8px">
          <span style="font-size: 0.95rem; font-weight: 800; color: var(--text)">Brandon Unglaub</span>
          <span style="font-size: 0.66rem; font-weight: 800; color: #e8c96b; padding: 2px 6px; border-radius: 999px; background: rgba(232,201,107,0.14); letter-spacing: 0.04em; text-transform: uppercase">Creator</span>
        </div>
        <div style="font-size: 0.78rem; color: rgba(255,255,255,0.5)">@brandon · You</div>
      </div>
    </div>

    <div style="padding: 16px 16px 6px">
