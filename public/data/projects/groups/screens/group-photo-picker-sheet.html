<link rel="stylesheet" href="../../../../styles/shared.css" />
<link rel="stylesheet" href="../../../../styles/ds.css" />
<link rel="stylesheet" href="../../../../data/design-system/company.css" />

<div style="background: rgba(0, 0, 0, 0.6); overflow-x: clip; min-height: 100vh; padding-top: 280px">
  <div
    style="
      background: var(--bg-0);
      border-radius: 24px 24px 0 0;
      padding: 14px 16px 24px;
      border: 1px solid rgba(255,255,255,0.06);
    "
  >
    <div class="mr-scope">
      <div style="width: 48px; height: 4px; border-radius: 999px; background: rgba(255,255,255,0.18); margin: 0 auto 18px"></div>
      <div style="font-size: 1.1rem; font-weight: 800; color: var(--text); text-align: center">Change group photo</div>
      <div style="font-size: 0.82rem; color: rgba(255,255,255,0.55); text-align: center; margin-top: 4px; margin-bottom: 18px">Pick a source for your cover image</div>

      <button type="button" style="display: flex; align-items: center; gap: 14px; width: 100%; background: transparent; border: 0; padding: 14px 8px; color: var(--text); text-align: left">
        <div style="width: 44px; height: 44px; border-radius: 12px; background: rgba(91, 109, 248, 0.18); display: flex; align-items: center; justify-content: center">
          <i class="ph-fill ph-camera" style="font-size: 20px; color: #8b9cff"></i>
        </div>
        <div style="flex: 1">
          <div style="font-size: 0.98rem; font-weight: 700">Take a photo</div>
          <div style="font-size: 0.74rem; color: rgba(255,255,255,0.5)">Open your camera</div>
        </div>
        <i class="ph ph-caret-right" style="font-size: 14px; color: rgba(255,255,255,0.4)"></i>
      </button>

      <div style="height: 1px; background: rgba(255,255,255,0.06); margin: 6px 0"></div>

      <button type="button" style="display: flex; align-items: center; gap: 14px; width: 100%; background: transparent; border: 0; padding: 14px 8px; color: var(--text); text-align: left">
        <div style="width: 44px; height: 44px; border-radius: 12px; background: rgba(109, 213, 237, 0.18); display: flex; align-items: center; justify-content: center">
          <i class="ph-fill ph-image-square" style="font-size: 20px; color: #6dd5ed"></i>
        </div>
        <div style="flex: 1">
          <div style="font-size: 0.98rem; font-weight: 700">Choose from library</div>
          <div style="font-size: 0.74rem; color: rgba(255,255,255,0.5)">Pick a photo from your device</div>
        </div>
        <i class="ph ph-caret-right" style="font-size: 14px; color: rgba(255,255,255,0.4)"></i>
      </button>

      <div style="height: 1px; background: rgba(255,255,255,0.06); margin: 6px 0"></div>

      <button type="button" style="display: flex; align-items: center; gap: 14px; width: 100%; background: transparent; border: 0; padding: 14px 8px; color: var(--text); text-align: left">
        <div style="width: 44px; height: 44px; border-radius: 12px; background: rgba(156, 77, 255, 0.18); display: flex; align-items: center; justify-content: center">
          <i class="ph-fill ph-smiley" style="font-size: 20px; color: #c285ff"></i>
        </div>
        <div style="flex: 1">
          <div style="font-size: 0.98rem; font-weight: 700">Use an emoji</div>
          <div style="font-size: 0.74rem; color: rgba(255,255,255,0.5)">Pick an emoji on a colored background</div>
        </div>
        <i class="ph ph-caret-right" style="font-size: 14px; color: rgba(255,255,255,0.4)"></i>
      </button>

      <div style="height: 1px; background: rgba(255,255,255,0.06); margin: 6px 0"></div>

      <button type="button" style="display: flex; align-items: center; gap: 14px; width: 100%; background: transparent; border: 0; padding: 14px 8px; color: #ff7a85; text-align: left">
        <div style="width: 44px; height: 44px; border-radius: 12px; background: rgba(255, 122, 133, 0.12); display: flex; align-items: center; justify-content: center">
          <i class="ph ph-trash" style="font-size: 20px; color: #ff7a85"></i>
        </div>
        <div style="flex: 1">
          <div style="font-size: 0.98rem; font-weight: 700">Remove photo</div>
          <div style="font-size: 0.74rem; color: rgba(255, 122, 133, 0.6)">Use a default cover</div>
        </div>
      </button>

      <button type="button" class="btn btn-secondary" style="width: 100%; padding: 14px; border-radius: 999px; margin-top: 14px">
        Cancel
      </button>
    </div>
  </div>
</div>
