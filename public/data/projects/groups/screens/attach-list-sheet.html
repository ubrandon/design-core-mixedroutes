<link rel="stylesheet" href="../../../../styles/shared.css" />
<link rel="stylesheet" href="../../../../styles/ds.css" />
<link rel="stylesheet" href="../../../../data/design-system/company.css" />

<div style="background: rgba(0, 0, 0, 0.55); overflow-x: clip; min-height: 100vh; padding-top: 80px">
  <div
    style="
      background: var(--bg-0);
      border-radius: 24px 24px 0 0;
      padding: 14px 16px 24px;
      border: 1px solid rgba(255,255,255,0.06);
    "
  >
    <div class="mr-scope">
      <div style="width: 48px; height: 4px; border-radius: 999px; background: rgba(255,255,255,0.18); margin: 0 auto 18px"></div>
      <div style="font-size: 1.1rem; font-weight: 800; color: var(--text); text-align: center">Attach a list</div>
      <div style="font-size: 0.82rem; color: rgba(255,255,255,0.55); text-align: center; margin-top: 4px; margin-bottom: 18px">Pick a shared list to show in Hiking Crew</div>

      <div class="mr-search-bar" style="margin-bottom: 16px">
        <i class="ph-fill ph-magnifying-glass" aria-hidden="true"></i>
        <input type="search" placeholder="Search your lists" autocomplete="off" />
      </div>

      <button
        type="button"
        style="
          display: flex;
          align-items: center;
          gap: 12px;
          width: 100%;
          padding: 12px 14px;
          border-radius: 14px;
          background: rgba(91, 109, 248, 0.1);
          border: 1px dashed rgba(109, 213, 237, 0.4);
          color: var(--text);
          text-align: left;
          margin-bottom: 16px;
        "
      >
        <div style="width: 44px; height: 44px; border-radius: 12px; background: linear-gradient(135deg,#6dd5ed,#2193b0); display: flex; align-items: center; justify-content: center">
          <i class="ph-fill ph-plus" style="font-size: 20px; color: #06080e"></i>
        </div>
        <div style="flex: 1; min-width: 0">
          <div style="font-size: 0.95rem; font-weight: 800">New shared list</div>
          <div style="font-size: 0.78rem; color: rgba(255,255,255,0.55)">Start a list and attach it to Hiking Crew</div>
        </div>
        <i class="ph ph-caret-right" style="font-size: 14px; color: rgba(255,255,255,0.4)"></i>
      </button>

      <div style="font-size: 0.7rem; font-weight: 800; color: rgba(255,255,255,0.45); letter-spacing: 0.08em; text-transform: uppercase; margin-bottom: 10px">Your shared lists</div>

      <div style="display: flex; flex-direction: column; gap: 10px">
        <div
          style="
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 12px 14px;
            border-radius: 14px;
            background: rgba(109, 213, 237, 0.1);
            border: 1.5px solid rgba(109, 213, 237, 0.5);
          "
        >
          <div style="width: 44px; height: 44px; border-radius: 12px; background: rgba(255,255,255,0.06); display: flex; align-items: center; justify-content: center; font-size: 22px">🏔️</div>
          <div style="flex: 1; min-width: 0">
            <div style="font-size: 0.95rem; font-weight: 800; color: var(--text)">Trail wishlist</div>
            <div style="font-size: 0.78rem; color: rgba(255,255,255,0.55)">9 places · Shared with 4 friends</div>
          </div>
          <span style="width: 22px; height: 22px; border-radius: 50%; background: linear-gradient(135deg,#6dd5ed,#2193b0); display: flex; align-items: center; justify-content: center"><i class="ph-fill ph-check" style="font-size: 12px; color: #06080e"></i></span>
        </div>

        <div
          style="
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 12px 14px;
            border-radius: 14px;
            background: rgba(255,255,255,0.04);
            border: 1px solid rgba(255,255,255,0.06);
          "
        >
          <div style="width: 44px; height: 44px; border-radius: 12px; background: rgba(255,255,255,0.06); display: flex; align-items: center; justify-content: center; font-size: 22px">☕️</div>
          <div style="flex: 1; min-width: 0">
            <div style="font-size: 0.95rem; font-weight: 800; color: var(--text)">Trailhead coffee</div>
            <div style="font-size: 0.78rem; color: rgba(255,255,255,0.55)">4 places · Shared with 6 friends</div>
          </div>
          <span style="width: 22px; height: 22px; border-radius: 50%; border: 1.5px solid rgba(255,255,255,0.25)"></span>
        </div>

        <div
          style="
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 12px 14px;
            border-radius: 14px;
            background: rgba(255,255,255,0.04);
            border: 1px solid rgba(255,255,255,0.06);
          "
        >
          <div style="width: 44px; height: 44px; border-radius: 12px; background: rgba(255,255,255,0.06); display: flex; align-items: center; justify-content: center; font-size: 22px">📋</div>
          <div style="flex: 1; min-width: 0">
            <div style="font-size: 0.95rem; font-weight: 800; color: var(--text)">Asheville</div>
            <div style="font-size: 0.78rem; color: rgba(255,255,255,0.55)">3 places · Shared with 2 friends</div>
          </div>
          <span style="width: 22px; height: 22px; border-radius: 50%; border: 1.5px solid rgba(255,255,255,0.25)"></span>
        </div>
      </div>

      <div style="font-size: 0.7rem; font-weight: 800; color: rgba(255,255,255,0.45); letter-spacing: 0.08em; text-transform: uppercase; margin: 22px 0 10px">Private — make shared to attach</div>

      <div
        style="
          display: flex;
          align-items: center;
          gap: 12px;
          padding: 12px 14px;
          border-radius: 14px;
          background: rgba(255,255,255,0.02);
          border: 1px dashed rgba(255,255,255,0.08);
          opacity: 0.7;
        "
      >
        <div style="width: 44px; height: 44px; border-radius: 12px; background: rgba(255,255,255,0.04); display: flex; align-items: center; justify-content: center; font-size: 22px">❤️</div>
        <div style="flex: 1; min-width: 0">
          <div style="font-size: 0.95rem; font-weight: 800; color: var(--text)">Saved</div>
          <div style="font-size: 0.78rem; color: rgba(255,255,255,0.5)">5 places · Private</div>
        </div>
        <button type="button" class="btn btn-secondary btn-sm">Make shared</button>
      </div>

      <button type="button" class="btn btn-primary" style="width: 100%; padding: 14px; border-radius: 999px; margin-top: 22px">
        Attach 1 list
      </button>
    </div>
</div>
