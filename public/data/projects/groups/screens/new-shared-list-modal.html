<link rel="stylesheet" href="../../../../styles/shared.css" />
<link rel="stylesheet" href="../../../../styles/ds.css" />
<link rel="stylesheet" href="../../../../data/design-system/company.css" />

<div style="background: rgba(0, 0, 0, 0.55); overflow-x: clip; min-height: 100vh; padding-top: 64px">
  <div
    style="
      background: var(--bg-0);
      border-radius: 24px 24px 0 0;
      padding: 14px 16px 24px;
      border: 1px solid rgba(255,255,255,0.06);
      min-height: calc(100vh - 64px);
    "
  >
    <div class="mr-scope">
      <div style="width: 48px; height: 4px; border-radius: 999px; background: rgba(255,255,255,0.18); margin: 0 auto 14px"></div>

      <header style="display: flex; align-items: center; justify-content: space-between; padding: 4px 4px 12px">
        <button type="button" style="background: transparent; border: 0; color: var(--text); font-size: 0.95rem; font-weight: 700; padding: 6px">
          Cancel
        </button>
        <span style="font-size: 0.95rem; font-weight: 800; color: var(--text)">New shared list</span>
        <button type="button" class="accent-text" style="background: transparent; border: 0; font-size: 0.95rem; font-weight: 800; padding: 6px">
          Create
        </button>
      </header>

      <div style="display: flex; align-items: center; gap: 14px; padding: 14px; border-radius: 18px; background: rgba(255,255,255,0.04); border: 1px solid rgba(255,255,255,0.06); margin-bottom: 18px">
        <button
          type="button"
          aria-label="Pick emoji"
          style="
            width: 56px;
            height: 56px;
            border-radius: 16px;
            background: linear-gradient(135deg, #5b6df8, #9c4dff);
            border: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 28px;
            position: relative;
            flex: 0 0 auto;
          "
        >
          📋
          <span
            style="
              position: absolute;
              right: -4px;
              bottom: -4px;
              width: 22px;
              height: 22px;
              border-radius: 50%;
              border: 2px solid var(--bg-0);
              background: rgba(255,255,255,0.95);
              color: #111;
              display: flex;
              align-items: center;
              justify-content: center;
            "
          >
            <i class="ph-fill ph-pencil-simple" style="font-size: 10px"></i>
          </span>
        </button>
        <div style="flex: 1; min-width: 0">
          <input
            type="text"
            placeholder="List name"
            maxlength="40"
            style="width: 100%; background: transparent; border: 0; color: var(--text); font-size: 1.05rem; font-weight: 800; outline: none; padding: 0; margin-bottom: 4px"
          />
          <div style="font-size: 0.74rem; color: rgba(255,255,255,0.5)">Tap the icon to pick an emoji</div>
        </div>
      </div>

      <div style="font-size: 0.7rem; font-weight: 800; color: rgba(255,255,255,0.45); letter-spacing: 0.08em; text-transform: uppercase; padding: 0 4px 8px">Attach to</div>
      <div style="border-radius: 16px; background: rgba(255,255,255,0.04); border: 1px solid rgba(255,255,255,0.06); padding: 12px 14px; display: flex; align-items: center; gap: 12px; margin-bottom: 18px">
        <img
          src="https://images.unsplash.com/photo-1551632811-561732d1e306?auto=format&amp;fit=crop&amp;w=160&amp;h=160&amp;q=80"
          alt=""
          style="width: 40px; height: 40px; border-radius: 12px; object-fit: cover"
          loading="lazy"
        />
        <div style="flex: 1; min-width: 0">
          <div style="font-size: 0.92rem; font-weight: 800; color: var(--text)">Hiking Crew</div>
          <div style="font-size: 0.74rem; color: rgba(255,255,255,0.55)">All 12 members will see this list</div>
        </div>
        <i class="ph-fill ph-check-circle" style="font-size: 18px; color: #6dd5ed"></i>
      </div>

      <div style="font-size: 0.7rem; font-weight: 800; color: rgba(255,255,255,0.45); letter-spacing: 0.08em; text-transform: uppercase; padding: 0 4px 8px">Who can edit</div>
      <div style="border-radius: 16px; background: rgba(255,255,255,0.04); border: 1px solid rgba(255,255,255,0.06); overflow: hidden; margin-bottom: 18px">
        <div style="display: flex; align-items: center; padding: 12px 14px; gap: 12px; border-bottom: 1px solid rgba(255,255,255,0.06)">
          <i class="ph ph-users-three" style="font-size: 18px; color: rgba(255,255,255,0.55)"></i>
          <div style="flex: 1">
            <div style="font-size: 0.9rem; font-weight: 700; color: var(--text)">Anyone in the group</div>
            <div style="font-size: 0.74rem; color: rgba(255,255,255,0.5); margin-top: 2px">All 12 members can add and remove places</div>
          </div>
          <span style="width: 18px; height: 18px; border-radius: 50%; background: linear-gradient(135deg,#6dd5ed,#2193b0); display: flex; align-items: center; justify-content: center"><i class="ph-fill ph-check" style="font-size: 10px; color: #06080e"></i></span>
        </div>
        <div style="display: flex; align-items: center; padding: 12px 14px; gap: 12px">
          <i class="ph ph-user" style="font-size: 18px; color: rgba(255,255,255,0.55)"></i>
          <div style="flex: 1">
            <div style="font-size: 0.9rem; font-weight: 700; color: var(--text)">Only me</div>
            <div style="font-size: 0.74rem; color: rgba(255,255,255,0.5); margin-top: 2px">Members can view but not edit</div>
          </div>
          <span style="width: 18px; height: 18px; border-radius: 50%; border: 1.5px solid rgba(255,255,255,0.25)"></span>
        </div>
      </div>

      <button type="button" style="display: flex; align-items: center; gap: 12px; width: 100%; background: transparent; border: 0; padding: 12px 4px; color: var(--text); text-align: left">
        <i class="ph ph-plus-circle" style="font-size: 20px; color: rgba(109, 213, 237, 0.85)"></i>
        <span style="flex: 1; font-size: 0.9rem; font-weight: 700">Add first place</span>
        <span style="font-size: 0.74rem; color: rgba(255,255,255,0.5)">Optional</span>
      </button>
    </div>
  </div>
</div>
