<link rel="stylesheet" href="../../../../styles/shared.css" />
<link rel="stylesheet" href="../../../../styles/ds.css" />
<link rel="stylesheet" href="../../../../data/design-system/company.css" />

<div style="background: var(--bg-0); overflow-x: clip">
  <div class="mr-scope" style="padding-bottom: 8px">
    <header style="display: flex; align-items: center; justify-content: space-between; padding: 18px 16px 10px">
      <span style="font-size: 1.6rem; font-weight: 800; color: var(--text)">Plans</span>
      <div style="display: flex; align-items: center; gap: 12px">
        <button type="button" class="mr-nav-icon-btn" aria-label="Notifications">
          <i class="ph ph-bell" aria-hidden="true"></i>
        </button>
        <img class="mr-top-nav-avatar" src="https://i.pravatar.cc/72?img=11" alt="" width="36" height="36" loading="lazy" />
      </div>
    </header>

    <div style="padding: 0 16px 8px">
      <div class="mr-chip-row" style="padding: 2px 0">
        <button type="button" class="mr-chip mr-chip-active">Upcoming</button>
        <button type="button" class="mr-chip">Past</button>
        <button type="button" class="mr-chip">Invites · 2</button>
      </div>
    </div>

    <div style="padding: 14px 16px 0">
      <div style="font-size: 0.7rem; font-weight: 800; color: rgba(255,255,255,0.45); letter-spacing: 0.08em; text-transform: uppercase; padding-bottom: 12px">A · Group avatar on cover</div>

      <div class="mr-plan-rows" style="max-width: 100%; padding: 0; margin: 0; display: flex; flex-direction: column; gap: 10px">

        <div
          class="mr-plan-row mr-plan-row--photo-blur"
          style="--mr-plan-row-bg: url(https://images.unsplash.com/photo-1551632811-561732d1e306?auto=format&amp;fit=crop&amp;w=320&amp;h=320&amp;q=80)"
        >
          <div
            class="mr-plan-row-media"
            style="background-image: url(https://images.unsplash.com/photo-1551632811-561732d1e306?auto=format&amp;fit=crop&amp;w=320&amp;h=320&amp;q=80); position: relative"
            aria-hidden="true"
          >
            <img
              src="https://images.unsplash.com/photo-1551632811-561732d1e306?auto=format&amp;fit=crop&amp;w=80&amp;h=80&amp;q=80"
              alt=""
              style="
                position: absolute;
                left: 6px;
                top: 6px;
                width: 22px;
                height: 22px;
                border-radius: 50%;
                object-fit: cover;
                border: 2px solid rgba(0,0,0,0.6);
                box-shadow: 0 2px 6px rgba(0,0,0,0.4);
              "
              loading="lazy"
            />
          </div>
          <div class="mr-plan-row-content">
            <div class="plan-card-mini-time">Sat, Apr 27 · 7 AM</div>
            <div class="mr-plan-row-title">Sunrise hike at Craggy</div>
            <div class="mr-plan-row-meta">
              <div class="mr-plan-row-when-where-item mr-plan-row-when-where-item--solo">
                <i class="ph-fill ph-map-pin" aria-hidden="true"></i>
                <span>Craggy Pinnacle</span>
              </div>
            </div>
            <div style="display: flex; align-items: center; gap: 8px; margin-top: 8px">
              <div class="plan-card-mini-avatar-stack" aria-hidden="true">
                <img class="plan-card-mini-avatar" src="https://i.pravatar.cc/40?img=12" alt="" loading="lazy" />
                <img class="plan-card-mini-avatar" src="https://i.pravatar.cc/40?img=32" alt="" loading="lazy" />
                <img class="plan-card-mini-avatar" src="https://i.pravatar.cc/40?img=8" alt="" loading="lazy" />
              </div>
              <span style="font-size: 0.75rem; color: #6dd5ed; font-weight: 800">You're going</span>
            </div>
          </div>
        </div>

        <div
          class="mr-plan-row mr-plan-row--photo-blur"
          style="--mr-plan-row-bg: url(https://images.unsplash.com/photo-1497935586351-b67a49e012bf?auto=format&amp;fit=crop&amp;w=320&amp;h=320&amp;q=80)"
        >
          <div
            class="mr-plan-row-media"
            style="background-image: url(https://images.unsplash.com/photo-1497935586351-b67a49e012bf?auto=format&amp;fit=crop&amp;w=320&amp;h=320&amp;q=80)"
            aria-hidden="true"
          ></div>
          <div class="mr-plan-row-content">
            <div class="plan-card-mini-time">Today · 2 PM</div>
            <div class="mr-plan-row-title">Cafe meetup</div>
            <div class="mr-plan-row-meta">
              <div class="mr-plan-row-when-where-item mr-plan-row-when-where-item--solo">
                <i class="ph-fill ph-map-pin" aria-hidden="true"></i>
                <span>Asheville NC</span>
              </div>
            </div>
            <div style="display: flex; align-items: center; gap: 8px; margin-top: 8px">
              <div class="plan-card-mini-avatar-stack" aria-hidden="true">
                <img class="plan-card-mini-avatar" src="https://i.pravatar.cc/40?img=14" alt="" loading="lazy" />
                <img class="plan-card-mini-avatar" src="https://i.pravatar.cc/40?img=27" alt="" loading="lazy" />
              </div>
              <span style="font-size: 0.75rem; color: rgba(255,255,255,0.5)">5 friends</span>
            </div>
          </div>
        </div>

        <div class="mr-plan-row" style="background: linear-gradient(135deg, rgba(58, 69, 102, 0.55), rgba(31, 39, 65, 0.7))">
          <div
            class="mr-plan-row-media mr-plan-row-media--emoji"
            style="background: linear-gradient(135deg,#3a4566,#1f2741); position: relative"
            aria-hidden="true"
          >
            <span style="font-size: 36px">🥾</span>
            <img
              src="https://images.unsplash.com/photo-1551632811-561732d1e306?auto=format&amp;fit=crop&amp;w=80&amp;h=80&amp;q=80"
              alt=""
              style="
                position: absolute;
                left: 6px;
                top: 6px;
                width: 22px;
                height: 22px;
                border-radius: 50%;
                object-fit: cover;
                border: 2px solid rgba(0,0,0,0.6);
                box-shadow: 0 2px 6px rgba(0,0,0,0.4);
              "
              loading="lazy"
            />
          </div>
          <div class="mr-plan-row-content">
            <div class="plan-card-mini-time">Sun, May 5 · 8 AM</div>
            <div class="mr-plan-row-title">Mt. Mitchell day trip</div>
            <div class="mr-plan-row-meta">
              <div class="mr-plan-row-when-where-item mr-plan-row-when-where-item--solo">
                <i class="ph-fill ph-map-pin" aria-hidden="true"></i>
                <span>Black Mountain</span>
              </div>
            </div>
            <div style="display: flex; align-items: center; gap: 8px; margin-top: 8px">
              <span style="font-size: 0.75rem; color: #e8c96b; font-weight: 800">Maybe</span>
              <span style="font-size: 0.75rem; color: rgba(255,255,255,0.5)">· 3 going · 4 maybe</span>
            </div>
          </div>
        </div>

        <div
          class="mr-plan-row mr-plan-row--photo-blur"
          style="--mr-plan-row-bg: url(https://images.unsplash.com/photo-1506157786151-b8491531f063?auto=format&amp;fit=crop&amp;w=320&amp;h=320&amp;q=80)"
        >
          <div
            class="mr-plan-row-media"
            style="background-image: url(https://images.unsplash.com/photo-1506157786151-b8491531f063?auto=format&amp;fit=crop&amp;w=320&amp;h=320&amp;q=80); position: relative"
            aria-hidden="true"
          >
            <img
              src="https://images.unsplash.com/photo-1506157786151-b8491531f063?auto=format&amp;fit=crop&amp;w=80&amp;h=80&amp;q=80"
              alt=""
              style="
                position: absolute;
                left: 6px;
                top: 6px;
                width: 22px;
                height: 22px;
                border-radius: 50%;
                object-fit: cover;
                border: 2px solid rgba(0,0,0,0.6);
                box-shadow: 0 2px 6px rgba(0,0,0,0.4);
              "
              loading="lazy"
            />
          </div>
          <div class="mr-plan-row-content">
            <div class="plan-card-mini-time">Fri, May 9 · 8 PM</div>
            <div class="mr-plan-row-title">RENT in concert 🎭</div>
            <div class="mr-plan-row-meta">
              <div class="mr-plan-row-when-where-item mr-plan-row-when-where-item--solo">
                <i class="ph-fill ph-map-pin" aria-hidden="true"></i>
                <span>Times Square</span>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>

    <div
      style="
        position: sticky;
        bottom: 0;
        z-index: 5;
        margin-top: 24px;
        padding-top: 8px;
        background: linear-gradient(180deg, transparent, var(--bg-0) 28%);
      "
    >
      <div class="mr-tab-bar" style="margin: 0 8px 0">
        <button type="button" class="mr-tab-item mr-tab-active" aria-label="Plans">
          <i class="ph-fill ph-calendar-blank" aria-hidden="true"></i>
        </button>
        <button type="button" class="mr-tab-item" aria-label="Discover">
          <i class="ph ph-compass" aria-hidden="true"></i>
        </button>
        <button type="button" class="mr-tab-item mr-tab-create" aria-label="Create">
          <i class="ph ph-plus-circle" aria-hidden="true"></i>
        </button>
        <button type="button" class="mr-tab-item" aria-label="Friends">
          <i class="ph ph-user" aria-hidden="true"></i>
        </button>
        <button type="button" class="mr-tab-item" aria-label="Chats">
          <i class="ph ph-chat-teardrop-text" aria-hidden="true"></i>
        </button>
      </div>
    </div>
  </div>
</div>
