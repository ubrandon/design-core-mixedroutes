<link rel="stylesheet" href="../../../../styles/shared.css" />
<link rel="stylesheet" href="../../../../styles/ds.css" />
<link rel="stylesheet" href="../../../../data/design-system/company.css" />

<div style="background: var(--bg-0); overflow-x: clip; min-height: 100vh; display: flex; flex-direction: column">
  <div class="mr-scope" style="display: flex; flex-direction: column; flex: 1">
    <header
      style="
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 14px 12px;
        border-bottom: 1px solid rgba(255,255,255,0.06);
        background: var(--bg-0);
        position: sticky;
        top: 0;
        z-index: 5;
      "
    >
      <button type="button" class="mr-nav-icon-btn" aria-label="Back">
        <i class="ph ph-arrow-left" aria-hidden="true"></i>
      </button>
      <button type="button" style="display: flex; align-items: center; gap: 10px; flex: 1; background: transparent; border: 0; padding: 0; min-width: 0; text-align: left">
        <div
          style="
            width: 36px;
            height: 36px;
            border-radius: 10px;
            background: linear-gradient(135deg, #5b6df8, #9c4dff);
            display: flex;
            align-items: center;
            justify-content: center;
          "
          aria-hidden="true"
        >
          <i class="ph-fill ph-users-three" style="font-size: 18px; color: rgba(255,255,255,0.92)"></i>
        </div>
        <div style="min-width: 0; flex: 1">
          <div style="font-size: 0.95rem; font-weight: 800; color: var(--text); white-space: nowrap; overflow: hidden; text-overflow: ellipsis">Hiking Crew</div>
          <div style="font-size: 0.72rem; color: rgba(255,255,255,0.5)">3 members</div>
        </div>
      </button>
      <button type="button" class="mr-nav-icon-btn" aria-label="Group info">
        <i class="ph ph-dots-three-vertical" aria-hidden="true"></i>
      </button>
    </header>

    <div style="flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 24px 32px; text-align: center">
      <div
        style="
          width: 80px;
          height: 80px;
          border-radius: 50%;
          background: linear-gradient(135deg, #5b6df8, #9c4dff);
          display: flex;
          align-items: center;
          justify-content: center;
          margin-bottom: 18px;
        "
        aria-hidden="true"
      >
        <i class="ph-fill ph-hand-waving" style="font-size: 36px; color: rgba(255,255,255,0.92)"></i>
      </div>
      <div style="font-size: 1.15rem; font-weight: 800; color: var(--text); margin-bottom: 8px">Say hi to your crew</div>
      <div style="font-size: 0.9rem; color: rgba(255, 255, 255, 0.55); line-height: 1.5; max-width: 280px">
        This is the start of <strong style="color: var(--text)">Hiking Crew</strong>. Send a message, share a plan, or just drop a wave.
      </div>

      <div style="display: flex; align-items: center; justify-content: center; gap: 4px; margin-top: 18px">
        <img src="https://i.pravatar.cc/56?img=12" alt="" style="width: 28px; height: 28px; border-radius: 50%; object-fit: cover; border: 2px solid var(--bg-0)" loading="lazy" />
        <img src="https://i.pravatar.cc/56?img=32" alt="" style="width: 28px; height: 28px; border-radius: 50%; object-fit: cover; border: 2px solid var(--bg-0); margin-left: -8px" loading="lazy" />
        <img src="https://i.pravatar.cc/56?img=8" alt="" style="width: 28px; height: 28px; border-radius: 50%; object-fit: cover; border: 2px solid var(--bg-0); margin-left: -8px" loading="lazy" />
      </div>
    </div>

    <div style="position: sticky; bottom: 0; padding: 8px 10px 16px; background: linear-gradient(180deg, transparent, var(--bg-0) 30%); border-top: 1px solid rgba(255,255,255,0.04)">
      <div
        style="
          display: flex;
          align-items: center;
          gap: 8px;
          padding: 8px 8px 8px 14px;
          border-radius: 999px;
          background: var(--mr-input-surface);
        "
      >
        <button type="button" style="background: transparent; border: 0; padding: 6px; color: rgba(255,255,255,0.7)" aria-label="Add">
          <i class="ph-fill ph-plus-circle" style="font-size: 22px"></i>
        </button>
        <input
          type="text"
          placeholder="Say hi 👋"
          style="flex: 1; background: transparent; border: 0; color: var(--text); font-size: 0.95rem; outline: none"
        />
        <button type="button" style="background: transparent; border: 0; padding: 6px; color: rgba(255,255,255,0.7)" aria-label="Camera">
          <i class="ph ph-camera" style="font-size: 22px"></i>
        </button>
        <button
          type="button"
          aria-label="Send"
          style="
            width: 36px;
            height: 36px;
            border-radius: 50%;
            background: rgba(255,255,255,0.1);
            border: 0;
            color: rgba(255,255,255,0.4);
            display: flex;
            align-items: center;
            justify-content: center;
          "
        >
          <i class="ph-fill ph-paper-plane-tilt" style="font-size: 16px"></i>
        </button>
      </div>
    </div>
  </div>
</div>
