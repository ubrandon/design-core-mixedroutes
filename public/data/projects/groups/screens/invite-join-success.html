<link rel="stylesheet" href="../../../../styles/shared.css" />
<link rel="stylesheet" href="../../../../styles/ds.css" />
<link rel="stylesheet" href="../../../../data/design-system/company.css" />

<div style="background: var(--bg-0); overflow-x: clip; min-height: 100vh; display: flex; flex-direction: column">
  <div class="mr-scope" style="display: flex; flex-direction: column; flex: 1">
    <header style="display: flex; align-items: center; justify-content: flex-end; padding: 18px 16px 8px">
      <button type="button" class="mr-nav-icon-btn" aria-label="Close">
        <i class="ph ph-x" aria-hidden="true"></i>
      </button>
    </header>

    <div style="flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 24px 24px 8px; text-align: center">
      <div style="position: relative; margin-bottom: 22px">
        <div
          style="
            position: absolute;
            inset: -14px;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(109, 213, 237, 0.3), transparent 70%);
            filter: blur(12px);
          "
          aria-hidden="true"
        ></div>
        <img
          src="https://images.unsplash.com/photo-1551632811-561732d1e306?auto=format&amp;fit=crop&amp;w=240&amp;h=240&amp;q=80"
          alt=""
          style="position: relative; width: 104px; height: 104px; border-radius: 50%; object-fit: cover; border: 3px solid rgba(109, 213, 237, 0.6)"
          loading="lazy"
        />
        <span
          style="
            position: absolute;
            right: -4px;
            bottom: -4px;
            width: 36px;
            height: 36px;
            border-radius: 50%;
            border: 3px solid var(--bg-0);
            background: linear-gradient(135deg, #6dd5ed, #2193b0);
            display: flex;
            align-items: center;
            justify-content: center;
          "
        >
          <i class="ph-fill ph-check" style="font-size: 16px; color: #06080e"></i>
        </span>
      </div>

      <div style="font-size: 0.7rem; font-weight: 800; color: rgba(109, 213, 237, 0.95); letter-spacing: 0.08em; text-transform: uppercase; margin-bottom: 8px">You're in</div>
      <div style="font-size: 1.55rem; font-weight: 800; color: var(--text); margin-bottom: 8px">Welcome to Hiking Crew</div>
      <div style="font-size: 0.92rem; color: rgba(255,255,255,0.6); line-height: 1.5; max-width: 300px; margin-bottom: 18px">
        Brandon and 11 others are already in. Say hi or jump straight to what's coming up.
      </div>

      <div style="width: 100%; max-width: 320px; display: flex; flex-direction: column; gap: 8px; margin-bottom: 18px">
        <div
          style="
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 12px 14px;
            border-radius: 14px;
            background: rgba(255,255,255,0.04);
            border: 1px solid rgba(255,255,255,0.06);
            text-align: left;
          "
        >
          <div style="width: 36px; height: 36px; border-radius: 10px; background: rgba(91, 109, 248, 0.18); display: flex; align-items: center; justify-content: center">
            <i class="ph-fill ph-calendar" style="font-size: 16px; color: #8b9cff"></i>
          </div>
          <div style="flex: 1; min-width: 0">
            <div style="font-size: 0.88rem; font-weight: 800; color: var(--text)">2 plans this week</div>
            <div style="font-size: 0.74rem; color: rgba(255,255,255,0.5)">Sat sunrise hike · Sun day trip</div>
          </div>
        </div>
        <div
          style="
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 12px 14px;
            border-radius: 14px;
            background: rgba(255,255,255,0.04);
            border: 1px solid rgba(255,255,255,0.06);
            text-align: left;
          "
        >
          <div style="width: 36px; height: 36px; border-radius: 10px; background: rgba(109, 213, 237, 0.18); display: flex; align-items: center; justify-content: center">
            <i class="ph-fill ph-list-bullets" style="font-size: 16px; color: #6dd5ed"></i>
          </div>
          <div style="flex: 1; min-width: 0">
            <div style="font-size: 0.88rem; font-weight: 800; color: var(--text)">2 shared lists</div>
            <div style="font-size: 0.74rem; color: rgba(255,255,255,0.5)">Trail wishlist · Trailhead coffee</div>
          </div>
        </div>
      </div>
    </div>

    <div style="padding: 0 16px 22px; display: flex; flex-direction: column; gap: 10px">
      <button type="button" class="btn btn-primary" style="width: 100%; padding: 16px; border-radius: 999px">
        Open group
      </button>
      <button type="button" style="width: 100%; padding: 14px; border-radius: 999px; background: transparent; border: 0; color: rgba(255,255,255,0.7); font-weight: 700">
        Say hi in chat
      </button>
    </div>
  </div>
</div>
