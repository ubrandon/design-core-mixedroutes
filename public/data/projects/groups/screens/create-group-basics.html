<link rel="stylesheet" href="../../../../styles/shared.css" />
<link rel="stylesheet" href="../../../../styles/ds.css" />
<link rel="stylesheet" href="../../../../data/design-system/company.css" />

<div style="background: var(--bg-0); overflow-x: clip; min-height: 100vh">
  <div class="mr-scope" style="padding-bottom: 24px">
    <header
      style="display: flex; align-items: center; justify-content: space-between; padding: 18px 16px 8px"
    >
      <button type="button" class="mr-nav-icon-btn" aria-label="Close">
        <i class="ph ph-x" aria-hidden="true"></i>
      </button>
      <span style="font-size: 0.95rem; font-weight: 800; color: var(--text)">Create group</span>
      <span style="font-size: 0.78rem; font-weight: 800; color: rgba(255,255,255,0.4)">1 of 2</span>
    </header>

    <div style="padding: 6px 16px 0">
      <div
        style="
          height: 4px;
          border-radius: 999px;
          background: rgba(255, 255, 255, 0.08);
          overflow: hidden;
          margin-bottom: 24px;
        "
      >
        <div style="width: 50%; height: 100%; background: linear-gradient(90deg, #6dd5ed, #2193b0)"></div>
      </div>

      <div style="display: flex; flex-direction: column; align-items: center; padding: 4px 0 22px">
        <div
          style="
            width: 96px;
            height: 96px;
            border-radius: 50%;
            background: linear-gradient(135deg, #5b6df8, #9c4dff);
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
          "
          aria-hidden="true"
        >
          <i class="ph-fill ph-users-three" style="font-size: 42px; color: rgba(255,255,255,0.9)"></i>
          <button
            type="button"
            style="
              position: absolute;
              right: -4px;
              bottom: -4px;
              width: 32px;
              height: 32px;
              border-radius: 50%;
              border: 2px solid var(--bg-0);
              background: rgba(255, 255, 255, 0.95);
              color: #111;
              display: flex;
              align-items: center;
              justify-content: center;
            "
            aria-label="Choose photo"
          >
            <i class="ph-fill ph-camera" style="font-size: 14px"></i>
          </button>
        </div>
        <div style="font-size: 0.78rem; color: rgba(255, 255, 255, 0.55); margin-top: 12px">Tap to add a photo · optional</div>
      </div>

      <label style="display: block; font-size: 0.78rem; font-weight: 800; color: rgba(255,255,255,0.55); letter-spacing: 0.06em; text-transform: uppercase; margin-bottom: 8px">Group name</label>
      <div
        style="
          padding: 14px 16px;
          border-radius: var(--mr-input-radius);
          background: var(--mr-input-surface);
          margin-bottom: 6px;
        "
      >
        <input
          type="text"
          placeholder="e.g. Hiking Crew"
          maxlength="40"
          style="width: 100%; background: transparent; border: 0; color: var(--text); font-size: 1rem; outline: none"
        />
      </div>
      <div style="display: flex; justify-content: flex-end; font-size: 0.7rem; color: rgba(255,255,255,0.4); margin-bottom: 18px">0 / 40</div>

      <label style="display: block; font-size: 0.78rem; font-weight: 800; color: rgba(255,255,255,0.55); letter-spacing: 0.06em; text-transform: uppercase; margin-bottom: 8px">Description · optional</label>
      <div
        style="
          padding: 14px 16px;
          border-radius: var(--mr-input-radius);
          background: var(--mr-input-surface);
          margin-bottom: 24px;
        "
      >
        <input
          type="text"
          placeholder="One line about the group"
          style="width: 100%; background: transparent; border: 0; color: var(--text); font-size: 1rem; outline: none"
        />
      </div>

      <button type="button" class="btn btn-primary" style="width: 100%; padding: 16px; border-radius: 999px">
        Continue
      </button>
    </div>
  </div>
</div>
