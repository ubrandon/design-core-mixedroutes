<link rel="stylesheet" href="../../../../styles/shared.css" />
<link rel="stylesheet" href="../../../../styles/ds.css" />
<link rel="stylesheet" href="../../../../data/design-system/company.css" />

<div style="background: var(--bg-0); overflow-x: clip; min-height: 100vh">
  <div class="mr-scope" style="padding-bottom: 32px">
    <div
      style="
        position: relative;
        padding: 18px 16px 0;
        background:
          radial-gradient(ellipse at top, rgba(91, 109, 248, 0.18), transparent 70%),
          linear-gradient(180deg, rgba(255, 255, 255, 0.04), rgba(255, 255, 255, 0));
      "
    >
      <div style="display: flex; justify-content: space-between; align-items: center">
        <button type="button" class="mr-nav-icon-btn" aria-label="Back">
          <i class="ph ph-arrow-left" aria-hidden="true"></i>
        </button>
        <button type="button" class="mr-nav-icon-btn" aria-label="Settings">
          <i class="ph ph-gear" aria-hidden="true"></i>
        </button>
      </div>

      <div style="display: flex; flex-direction: column; align-items: center; padding: 12px 0 18px">
        <div
          style="
            width: 96px;
            height: 96px;
            border-radius: 50%;
            background: linear-gradient(135deg, #5b6df8, #9c4dff);
            display: flex;
            align-items: center;
            justify-content: center;
            border: 3px solid rgba(255,255,255,0.1);
          "
          aria-hidden="true"
        >
          <i class="ph-fill ph-users-three" style="font-size: 42px; color: rgba(255,255,255,0.92)"></i>
        </div>
        <div style="font-size: 1.55rem; font-weight: 800; color: var(--text); margin-top: 12px">Hiking Crew</div>
        <button type="button" style="background: transparent; border: 0; padding: 0; margin-top: 4px; color: rgba(255,255,255,0.55); font-size: 0.85rem">
          3 members <i class="ph ph-caret-right" style="font-size: 10px"></i>
        </button>
      </div>
    </div>

    <div style="padding: 6px 16px 12px">
      <div style="display: flex; gap: 10px">
        <button type="button" class="btn btn-primary" style="flex: 1; padding: 14px; border-radius: 999px; display: inline-flex; align-items: center; justify-content: center; gap: 8px">
          <i class="ph-fill ph-calendar-plus" style="font-size: 18px"></i>
          Plan something
        </button>
        <button type="button" class="btn btn-secondary" style="padding: 14px 18px; border-radius: 999px; display: inline-flex; align-items: center; gap: 8px">
          <i class="ph-fill ph-chat-circle-text" style="font-size: 18px"></i>
          Chat
        </button>
      </div>
    </div>

    <div style="padding: 32px 24px; text-align: center">
      <div
        style="
          width: 72px;
          height: 72px;
          border-radius: 50%;
          margin: 0 auto 16px;
          background: rgba(255, 255, 255, 0.04);
          display: flex;
          align-items: center;
          justify-content: center;
        "
        aria-hidden="true"
      >
        <i class="ph ph-confetti" style="font-size: 32px; color: rgba(255,255,255,0.6)"></i>
      </div>
      <div style="font-size: 1.1rem; font-weight: 800; color: var(--text); margin-bottom: 6px">This is the start of your group.</div>
      <div style="font-size: 0.88rem; color: rgba(255, 255, 255, 0.55); line-height: 1.5">Plan something, attach a list, or say hi in chat to get things going.</div>

      <div style="display: flex; flex-direction: column; gap: 10px; margin-top: 22px">
        <button type="button" class="btn btn-secondary" style="width: 100%; padding: 14px; border-radius: 14px; display: inline-flex; align-items: center; justify-content: flex-start; gap: 12px">
          <i class="ph-fill ph-link" style="font-size: 18px"></i>
          <span style="flex: 1; text-align: left">Invite more friends</span>
          <i class="ph ph-caret-right" style="font-size: 14px; color: rgba(255,255,255,0.4)"></i>
        </button>
        <button type="button" class="btn btn-secondary" style="width: 100%; padding: 14px; border-radius: 14px; display: inline-flex; align-items: center; justify-content: flex-start; gap: 12px">
          <i class="ph-fill ph-list-bullets" style="font-size: 18px"></i>
          <span style="flex: 1; text-align: left">Attach a list</span>
          <i class="ph ph-caret-right" style="font-size: 14px; color: rgba(255,255,255,0.4)"></i>
        </button>
      </div>
    </div>
  </div>
</div>
