<link rel="stylesheet" href="../../../../styles/shared.css" />
<link rel="stylesheet" href="../../../../styles/ds.css" />
<link rel="stylesheet" href="../../../../data/design-system/company.css" />

<div style="background: var(--bg-0); overflow-x: clip; min-height: 100vh">
  <div class="mr-scope" style="padding-bottom: 32px">
    <div
      style="
        position: relative;
        padding: 18px 16px 0;
        background:
          radial-gradient(ellipse at top, rgba(91, 109, 248, 0.18), transparent 70%),
          linear-gradient(180deg, rgba(255, 255, 255, 0.04), rgba(255, 255, 255, 0));
      "
    >
      <div style="display: flex; justify-content: space-between; align-items: center">
        <button type="button" class="mr-nav-icon-btn" aria-label="Back">
          <i class="ph ph-arrow-left" aria-hidden="true"></i>
        </button>
        <button type="button" class="mr-nav-icon-btn" aria-label="Settings">
          <i class="ph ph-gear" aria-hidden="true"></i>
        </button>
      </div>

      <div style="display: flex; flex-direction: column; align-items: center; padding: 12px 0 18px">
        <div
          style="
            width: 96px;
            height: 96px;
            border-radius: 50%;
            background: linear-gradient(135deg, #5b6df8, #9c4dff);
            display: flex;
            align-items: center;
            justify-content: center;
            border: 3px solid rgba(255,255,255,0.1);
          "
          aria-hidden="true"
        >
          <i class="ph-fill ph-users-three" style="font-size: 42px; color: rgba(255,255,255,0.92)"></i>
        </div>
        <div style="font-size: 1.55rem; font-weight: 800; color: var(--text); margin-top: 12px">Hiking Crew</div>
        <button type="button" style="background: transparent; border: 0; padding: 0; margin-top: 4px; color: rgba(255,255,255,0.55); font-size: 0.85rem">
          3 members <i class="ph ph-caret-right" style="font-size: 10px"></i>
        </button>
      </div>
    </div>

    <div style="position: sticky; top: 0; z-index: 4; background: var(--bg-0); padding: 6px 16px 12px; border-bottom: 1px solid rgba(255,255,255,0.04)">
      <div style="display: flex; gap: 10px">
        <button type="button" class="btn btn-primary" style="flex: 1; padding: 14px; border-radius: 999px; display: inline-flex; align-items: center; justify-content: center; gap: 8px">
          <i class="ph-fill ph-calendar-plus" style="font-size: 18px"></i>
          Plan something
        </button>
        <button type="button" class="btn btn-secondary" style="padding: 14px 18px; border-radius: 999px; display: inline-flex; align-items: center; gap: 8px">
          <i class="ph-fill ph-chat-circle-text" style="font-size: 18px"></i>
          Chat
        </button>
      </div>
    </div>

    <div style="padding: 18px 16px 0">
      <div style="display: flex; align-items: center; justify-content: space-between; padding-bottom: 12px">
        <span style="font-size: 1.05rem; font-weight: 800; color: var(--text)">Members</span>
        <span class="accent-text" style="font-size: 0.72rem; font-weight: 800; letter-spacing: 0.06em; text-transform: uppercase">See all (3)</span>
      </div>
      <div style="display: flex; align-items: center; gap: 6px">
        <img src="https://i.pravatar.cc/64?img=12" alt="" style="width: 40px; height: 40px; border-radius: 50%; object-fit: cover; border: 2px solid var(--bg-0)" loading="lazy" />
        <img src="https://i.pravatar.cc/64?img=32" alt="" style="width: 40px; height: 40px; border-radius: 50%; object-fit: cover; border: 2px solid var(--bg-0); margin-left: -10px" loading="lazy" />
        <img src="https://i.pravatar.cc/64?img=8" alt="" style="width: 40px; height: 40px; border-radius: 50%; object-fit: cover; border: 2px solid var(--bg-0); margin-left: -10px" loading="lazy" />
        <button
          type="button"
          aria-label="Invite more friends"
          style="
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: rgba(255,255,255,0.05);
            border: 1.5px dashed rgba(255,255,255,0.25);
            color: rgba(255,255,255,0.7);
            display: flex;
            align-items: center;
            justify-content: center;
            margin-left: -10px;
            padding: 0;
            cursor: pointer;
          "
        >
          <i class="ph ph-plus" style="font-size: 16px"></i>
        </button>
      </div>
    </div>

    <div style="padding: 22px 16px 0">
      <div style="display: flex; align-items: center; justify-content: space-between; padding-bottom: 12px">
        <span style="font-size: 1.05rem; font-weight: 800; color: var(--text)">Upcoming</span>
      </div>
      <button
        type="button"
        style="
          width: 100%;
          padding: 18px 16px;
          border-radius: 18px;
          background: rgba(255,255,255,0.03);
          border: 1.5px dashed rgba(255,255,255,0.14);
          color: var(--text);
          display: flex;
          align-items: center;
          gap: 12px;
          text-align: left;
          cursor: pointer;
        "
      >
        <div
          style="
            width: 40px;
            height: 40px;
            border-radius: 12px;
            background: rgba(91, 109, 248, 0.16);
            display: flex;
            align-items: center;
            justify-content: center;
            color: #8b9cff;
            flex: 0 0 auto;
          "
          aria-hidden="true"
        >
          <i class="ph-fill ph-calendar-plus" style="font-size: 20px"></i>
        </div>
        <div style="flex: 1">
          <div style="font-size: 0.95rem; font-weight: 800; color: var(--text)">Plan something</div>
          <div style="font-size: 0.78rem; color: rgba(255,255,255,0.55); margin-top: 2px">No plans yet — get the crew out</div>
        </div>
        <i class="ph ph-caret-right" style="font-size: 14px; color: rgba(255,255,255,0.4)" aria-hidden="true"></i>
      </button>
    </div>

    <div style="padding: 22px 16px 0">
      <div style="display: flex; align-items: center; justify-content: space-between; padding-bottom: 12px">
        <span style="font-size: 1.05rem; font-weight: 800; color: var(--text)">Lists</span>
      </div>
      <button
        type="button"
        style="
          width: 100%;
          padding: 18px 16px;
          border-radius: 18px;
          background: rgba(255,255,255,0.03);
          border: 1.5px dashed rgba(255,255,255,0.14);
          color: var(--text);
          display: flex;
          align-items: center;
          gap: 12px;
          text-align: left;
          cursor: pointer;
        "
      >
        <div
          style="
            width: 40px;
            height: 40px;
            border-radius: 12px;
            background: rgba(109, 213, 237, 0.14);
            display: flex;
            align-items: center;
            justify-content: center;
            color: #6dd5ed;
            flex: 0 0 auto;
          "
          aria-hidden="true"
        >
          <i class="ph-fill ph-list-bullets" style="font-size: 20px"></i>
        </div>
        <div style="flex: 1">
          <div style="font-size: 0.95rem; font-weight: 800; color: var(--text)">Attach a list</div>
          <div style="font-size: 0.78rem; color: rgba(255,255,255,0.55); margin-top: 2px">Trail wishlist, gear, snacks…</div>
        </div>
        <i class="ph ph-caret-right" style="font-size: 14px; color: rgba(255,255,255,0.4)" aria-hidden="true"></i>
      </button>
    </div>
  </div>
</div>
