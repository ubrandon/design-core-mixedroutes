<link rel="stylesheet" href="../../../../styles/shared.css" />
<link rel="stylesheet" href="../../../../styles/ds.css" />
<link rel="stylesheet" href="../../../../data/design-system/company.css" />

<div style="background: var(--bg-0); overflow-x: clip; min-height: 100vh; display: flex; flex-direction: column">
  <div class="mr-scope" style="display: flex; flex-direction: column; flex: 1">
    <header style="display: flex; align-items: center; justify-content: flex-start; padding: 18px 16px 8px">
      <button type="button" class="mr-nav-icon-btn" aria-label="Close">
        <i class="ph ph-x" aria-hidden="true"></i>
      </button>
    </header>

    <div style="flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 24px 32px; text-align: center">
      <div
        style="
          width: 88px;
          height: 88px;
          border-radius: 50%;
          background: rgba(255, 122, 133, 0.08);
          border: 1px solid rgba(255, 122, 133, 0.25);
          display: flex;
          align-items: center;
          justify-content: center;
          margin-bottom: 18px;
        "
        aria-hidden="true"
      >
        <i class="ph ph-link-break" style="font-size: 38px; color: #ff7a85"></i>
      </div>
      <div style="font-size: 1.2rem; font-weight: 800; color: var(--text); margin-bottom: 8px">This invite is no longer valid</div>
      <div style="font-size: 0.9rem; color: rgba(255, 255, 255, 0.55); line-height: 1.5; max-width: 300px">
        The link may have been regenerated or disabled by an admin. Ask whoever sent it to share a new one.
      </div>

      <div style="display: flex; flex-direction: column; gap: 10px; margin-top: 22px; width: 100%; max-width: 320px">
        <button type="button" class="btn btn-primary" style="width: 100%; padding: 14px; border-radius: 999px">
          Got it
        </button>
        <button type="button" style="width: 100%; padding: 14px; border-radius: 999px; background: transparent; border: 0; color: rgba(255,255,255,0.7); font-weight: 700">
          Request a new invite
        </button>
      </div>
    </div>
  </div>
</div>
