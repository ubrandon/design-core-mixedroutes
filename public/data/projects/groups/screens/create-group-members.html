<link rel="stylesheet" href="../../../../styles/shared.css" />
<link rel="stylesheet" href="../../../../styles/ds.css" />
<link rel="stylesheet" href="../../../../data/design-system/company.css" />

<div style="background: var(--bg-0); overflow-x: clip; min-height: 100vh">
  <div class="mr-scope" style="padding-bottom: 24px">
    <header style="display: flex; align-items: center; justify-content: space-between; padding: 18px 16px 8px">
      <button type="button" class="mr-nav-icon-btn" aria-label="Back">
        <i class="ph ph-arrow-left" aria-hidden="true"></i>
      </button>
      <span style="font-size: 0.95rem; font-weight: 800; color: var(--text)">Add members</span>
      <span style="font-size: 0.78rem; font-weight: 800; color: rgba(255,255,255,0.4)">2 of 2</span>
    </header>

    <div style="padding: 6px 16px 0">
      <div
        style="
          height: 4px;
          border-radius: 999px;
          background: rgba(255, 255, 255, 0.08);
          overflow: hidden;
          margin-bottom: 18px;
        "
      >
        <div style="width: 100%; height: 100%; background: linear-gradient(90deg, #6dd5ed, #2193b0)"></div>
      </div>

      <div style="font-size: 1.4rem; font-weight: 800; color: var(--text); margin-bottom: 4px">Who's in?</div>
      <div style="font-size: 0.85rem; color: rgba(255, 255, 255, 0.55); margin-bottom: 16px">Pick at least one friend, or share an invite link.</div>

      <div class="mr-search-bar" style="margin-bottom: 14px">
        <i class="ph-fill ph-magnifying-glass" aria-hidden="true"></i>
        <input type="search" placeholder="Search by name or @handle" autocomplete="off" />
      </div>

      <div
        style="
          display: flex;
          align-items: center;
          gap: 8px;
          padding: 10px 14px;
          border-radius: 14px;
          background: rgba(255, 255, 255, 0.04);
          border: 1px dashed rgba(255, 255, 255, 0.12);
          margin-bottom: 18px;
        "
      >
        <i class="ph ph-link" style="font-size: 18px; color: rgba(255,255,255,0.7)"></i>
        <div style="flex: 1; min-width: 0">
          <div style="font-size: 0.86rem; font-weight: 800; color: var(--text)">Or share an invite link</div>
          <div style="font-size: 0.74rem; color: rgba(255,255,255,0.5); white-space: nowrap; overflow: hidden; text-overflow: ellipsis">mr.app/g/hiking-crew-x9k</div>
        </div>
        <button type="button" class="btn btn-secondary btn-sm">Copy</button>
      </div>

      <div style="display: flex; align-items: center; justify-content: space-between; padding-bottom: 10px">
        <span style="font-size: 0.78rem; font-weight: 800; color: rgba(255,255,255,0.55); letter-spacing: 0.08em; text-transform: uppercase">Selected · 3</span>
      </div>
      <div class="ds-scroll-x" style="display: flex; gap: 12px; padding-bottom: 14px">
        <div style="flex: 0 0 auto; display: flex; flex-direction: column; align-items: center; gap: 6px; width: 64px; position: relative">
          <img src="https://i.pravatar.cc/96?img=12" alt="" style="width: 56px; height: 56px; border-radius: 50%; object-fit: cover" loading="lazy" />
          <span style="font-size: 0.74rem; color: rgba(255,255,255,0.7); text-align: center">Eric</span>
          <span style="position: absolute; top: -2px; right: 6px; width: 18px; height: 18px; border-radius: 50%; background: rgba(0,0,0,0.7); color: #fff; display: flex; align-items: center; justify-content: center"><i class="ph-fill ph-x" style="font-size: 10px"></i></span>
        </div>
        <div style="flex: 0 0 auto; display: flex; flex-direction: column; align-items: center; gap: 6px; width: 64px">
          <img src="https://i.pravatar.cc/96?img=32" alt="" style="width: 56px; height: 56px; border-radius: 50%; object-fit: cover" loading="lazy" />
          <span style="font-size: 0.74rem; color: rgba(255,255,255,0.7); text-align: center">Sarah</span>
        </div>
        <div style="flex: 0 0 auto; display: flex; flex-direction: column; align-items: center; gap: 6px; width: 64px">
          <img src="https://i.pravatar.cc/96?img=8" alt="" style="width: 56px; height: 56px; border-radius: 50%; object-fit: cover" loading="lazy" />
          <span style="font-size: 0.74rem; color: rgba(255,255,255,0.7); text-align: center">Mike</span>
        </div>
      </div>

      <div style="display: flex; align-items: center; justify-content: space-between; padding: 18px 0 8px">
        <span style="font-size: 0.78rem; font-weight: 800; color: rgba(255,255,255,0.55); letter-spacing: 0.08em; text-transform: uppercase">Friends</span>
      </div>

      <div style="display: flex; flex-direction: column">
        <div style="display: flex; align-items: center; gap: 12px; padding: 12px 4px">
          <img src="https://i.pravatar.cc/72?img=12" alt="" style="width: 44px; height: 44px; border-radius: 50%; object-fit: cover" loading="lazy" />
          <div style="flex: 1; min-width: 0">
            <div style="font-size: 0.95rem; font-weight: 800; color: var(--text)">Eric Hechavarria</div>
            <div style="font-size: 0.78rem; color: rgba(255,255,255,0.5)">@eric</div>
          </div>
          <div style="width: 22px; height: 22px; border-radius: 50%; background: linear-gradient(135deg,#6dd5ed,#2193b0); display: flex; align-items: center; justify-content: center"><i class="ph-fill ph-check" style="font-size: 12px; color: #06080e"></i></div>
        </div>
        <div style="display: flex; align-items: center; gap: 12px; padding: 12px 4px">
          <img src="https://i.pravatar.cc/72?img=32" alt="" style="width: 44px; height: 44px; border-radius: 50%; object-fit: cover" loading="lazy" />
          <div style="flex: 1; min-width: 0">
            <div style="font-size: 0.95rem; font-weight: 800; color: var(--text)">Sarah Kim</div>
            <div style="font-size: 0.78rem; color: rgba(255,255,255,0.5)">@sarahk</div>
          </div>
          <div style="width: 22px; height: 22px; border-radius: 50%; background: linear-gradient(135deg,#6dd5ed,#2193b0); display: flex; align-items: center; justify-content: center"><i class="ph-fill ph-check" style="font-size: 12px; color: #06080e"></i></div>
        </div>
        <div style="display: flex; align-items: center; gap: 12px; padding: 12px 4px">
          <img src="https://i.pravatar.cc/72?img=8" alt="" style="width: 44px; height: 44px; border-radius: 50%; object-fit: cover" loading="lazy" />
          <div style="flex: 1; min-width: 0">
            <div style="font-size: 0.95rem; font-weight: 800; color: var(--text)">Mike Tanaka</div>
            <div style="font-size: 0.78rem; color: rgba(255,255,255,0.5)">@miket</div>
          </div>
          <div style="width: 22px; height: 22px; border-radius: 50%; background: linear-gradient(135deg,#6dd5ed,#2193b0); display: flex; align-items: center; justify-content: center"><i class="ph-fill ph-check" style="font-size: 12px; color: #06080e"></i></div>
        </div>
        <div style="display: flex; align-items: center; gap: 12px; padding: 12px 4px">
          <img src="https://i.pravatar.cc/72?img=14" alt="" style="width: 44px; height: 44px; border-radius: 50%; object-fit: cover" loading="lazy" />
          <div style="flex: 1; min-width: 0">
            <div style="font-size: 0.95rem; font-weight: 800; color: var(--text)">Jenna Park</div>
            <div style="font-size: 0.78rem; color: rgba(255,255,255,0.5)">@jenna</div>
          </div>
          <div style="width: 22px; height: 22px; border-radius: 50%; border: 1.5px solid rgba(255,255,255,0.25)"></div>
        </div>
        <div style="display: flex; align-items: center; gap: 12px; padding: 12px 4px">
          <img src="https://i.pravatar.cc/72?img=27" alt="" style="width: 44px; height: 44px; border-radius: 50%; object-fit: cover" loading="lazy" />
          <div style="flex: 1; min-width: 0">
            <div style="font-size: 0.95rem; font-weight: 800; color: var(--text)">Devon Walker</div>
            <div style="font-size: 0.78rem; color: rgba(255,255,255,0.5)">@dev</div>
          </div>
          <div style="width: 22px; height: 22px; border-radius: 50%; border: 1.5px solid rgba(255,255,255,0.25)"></div>
        </div>
      </div>

      <button type="button" class="btn btn-primary" style="width: 100%; padding: 16px; border-radius: 999px; margin-top: 22px">
        Create group · 3 members
      </button>
    </div>
  </div>
</div>
