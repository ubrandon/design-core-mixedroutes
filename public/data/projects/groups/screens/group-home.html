<link rel="stylesheet" href="../../../../styles/shared.css" />
<link rel="stylesheet" href="../../../../styles/ds.css" />
<link rel="stylesheet" href="../../../../data/design-system/company.css" />

<div style="background: var(--bg-0); overflow-x: clip">
  <div class="mr-scope" style="padding-bottom: 32px">
    <div
      style="
        position: relative;
        padding: 18px 16px 0;
        background:
          radial-gradient(ellipse at top, rgba(91, 109, 248, 0.18), transparent 70%),
          linear-gradient(180deg, rgba(255, 255, 255, 0.04), rgba(255, 255, 255, 0));
      "
    >
      <div style="display: flex; justify-content: space-between; align-items: center">
        <button type="button" class="mr-nav-icon-btn" aria-label="Back">
          <i class="ph ph-arrow-left" aria-hidden="true"></i>
        </button>
        <button type="button" class="mr-nav-icon-btn" aria-label="Settings">
          <i class="ph ph-gear" aria-hidden="true"></i>
        </button>
      </div>

      <div style="display: flex; flex-direction: column; align-items: center; padding: 12px 0 18px">
        <img
          src="https://images.unsplash.com/photo-1551632811-561732d1e306?auto=format&amp;fit=crop&amp;w=240&amp;h=240&amp;q=80"
          alt=""
          width="96"
          height="96"
          style="width: 96px; height: 96px; border-radius: 50%; object-fit: cover; border: 3px solid rgba(255,255,255,0.1)"
          loading="lazy"
        />
        <div style="font-size: 1.55rem; font-weight: 800; color: var(--text); margin-top: 12px">Hiking Crew</div>
        <button type="button" style="background: transparent; border: 0; padding: 0; margin-top: 4px; color: rgba(255,255,255,0.55); font-size: 0.85rem">
          12 members <i class="ph ph-caret-right" style="font-size: 10px"></i>
        </button>
      </div>
    </div>

    <div style="position: sticky; top: 0; z-index: 4; background: var(--bg-0); padding: 6px 16px 12px; border-bottom: 1px solid rgba(255,255,255,0.04)">
      <div style="display: flex; gap: 10px">
        <button type="button" class="btn btn-primary" style="flex: 1; padding: 14px; border-radius: 999px; display: inline-flex; align-items: center; justify-content: center; gap: 8px">
          <i class="ph-fill ph-calendar-plus" style="font-size: 18px"></i>
          Plan something
        </button>
        <button type="button" class="btn btn-secondary" style="padding: 14px 18px; border-radius: 999px; display: inline-flex; align-items: center; gap: 8px">
          <i class="ph-fill ph-chat-circle-text" style="font-size: 18px"></i>
          Chat
        </button>
      </div>
    </div>

    <div style="padding: 18px 16px 0">
      <div style="display: flex; align-items: center; justify-content: space-between; padding-bottom: 12px">
        <span style="font-size: 1.05rem; font-weight: 800; color: var(--text)">Members</span>
        <span class="accent-text" style="font-size: 0.72rem; font-weight: 800; letter-spacing: 0.06em; text-transform: uppercase">See all (12)</span>
      </div>
      <div style="display: flex; align-items: center; gap: 6px">
        <img src="https://i.pravatar.cc/64?img=12" alt="" style="width: 40px; height: 40px; border-radius: 50%; object-fit: cover; border: 2px solid var(--bg-0)" loading="lazy" />
        <img src="https://i.pravatar.cc/64?img=32" alt="" style="width: 40px; height: 40px; border-radius: 50%; object-fit: cover; border: 2px solid var(--bg-0); margin-left: -10px" loading="lazy" />
        <img src="https://i.pravatar.cc/64?img=8" alt="" style="width: 40px; height: 40px; border-radius: 50%; object-fit: cover; border: 2px solid var(--bg-0); margin-left: -10px" loading="lazy" />
        <img src="https://i.pravatar.cc/64?img=14" alt="" style="width: 40px; height: 40px; border-radius: 50%; object-fit: cover; border: 2px solid var(--bg-0); margin-left: -10px" loading="lazy" />
        <img src="https://i.pravatar.cc/64?img=27" alt="" style="width: 40px; height: 40px; border-radius: 50%; object-fit: cover; border: 2px solid var(--bg-0); margin-left: -10px" loading="lazy" />
        <div
          style="
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: rgba(255,255,255,0.08);
            color: rgba(255,255,255,0.7);
            font-size: 0.78rem;
            font-weight: 800;
            display: flex;
            align-items: center;
            justify-content: center;
            border: 2px solid var(--bg-0);
            margin-left: -10px;
          "
        >+7</div>
      </div>
    </div>

    <div style="padding: 22px 16px 0">
      <div style="display: flex; align-items: center; justify-content: space-between; padding-bottom: 12px">
        <span style="font-size: 1.05rem; font-weight: 800; color: var(--text)">Upcoming</span>
        <span class="accent-text" style="font-size: 0.72rem; font-weight: 800; letter-spacing: 0.06em; text-transform: uppercase">View all ›</span>
      </div>

      <div class="mr-plan-rows" style="max-width: 100%; padding: 0; margin: 0; display: flex; flex-direction: column; gap: 10px">
        <div
          class="mr-plan-row mr-plan-row--photo-blur"
          style="--mr-plan-row-bg: url(https://images.unsplash.com/photo-1551632811-561732d1e306?auto=format&amp;fit=crop&amp;w=320&amp;h=320&amp;q=80)"
        >
          <div
            class="mr-plan-row-media"
            style="background-image: url(https://images.unsplash.com/photo-1551632811-561732d1e306?auto=format&amp;fit=crop&amp;w=320&amp;h=320&amp;q=80)"
            aria-hidden="true"
          ></div>
          <div class="mr-plan-row-content">
            <div class="plan-card-mini-time">Sat, Apr 27 · 7 AM</div>
            <div class="mr-plan-row-title">Sunrise hike at Craggy</div>
            <div class="mr-plan-row-meta">
              <div class="mr-plan-row-when-where-item mr-plan-row-when-where-item--solo">
                <i class="ph-fill ph-map-pin" aria-hidden="true"></i>
                <span>Craggy Pinnacle</span>
              </div>
            </div>
            <div style="display: flex; align-items: center; gap: 8px; margin-top: 8px">
              <div class="plan-card-mini-avatar-stack" aria-hidden="true">
                <img class="plan-card-mini-avatar" src="https://i.pravatar.cc/40?img=12" alt="" loading="lazy" />
                <img class="plan-card-mini-avatar" src="https://i.pravatar.cc/40?img=32" alt="" loading="lazy" />
                <img class="plan-card-mini-avatar" src="https://i.pravatar.cc/40?img=8" alt="" loading="lazy" />
              </div>
              <span style="font-size: 0.75rem; color: rgba(255,255,255,0.5)">8 going</span>
            </div>
          </div>
        </div>

        <div class="mr-plan-row" style="background: linear-gradient(135deg, rgba(58, 69, 102, 0.55), rgba(31, 39, 65, 0.7))">
          <div class="mr-plan-row-media mr-plan-row-media--emoji" style="background: linear-gradient(135deg,#3a4566,#1f2741)" aria-hidden="true">
            <span style="font-size: 36px">🥾</span>
          </div>
          <div class="mr-plan-row-content">
            <div class="plan-card-mini-time">Sun, May 5 · 8 AM</div>
            <div class="mr-plan-row-title">Mt. Mitchell day trip</div>
            <div class="mr-plan-row-meta">
              <div class="mr-plan-row-when-where-item mr-plan-row-when-where-item--solo">
                <i class="ph-fill ph-map-pin" aria-hidden="true"></i>
                <span>Black Mountain</span>
              </div>
            </div>
            <div style="display: flex; align-items: center; gap: 8px; margin-top: 8px">
              <div class="plan-card-mini-avatar-stack" aria-hidden="true">
                <img class="plan-card-mini-avatar" src="https://i.pravatar.cc/40?img=14" alt="" loading="lazy" />
                <img class="plan-card-mini-avatar" src="https://i.pravatar.cc/40?img=27" alt="" loading="lazy" />
              </div>
              <span style="font-size: 0.75rem; color: rgba(255,255,255,0.5)">3 going · 4 maybe</span>
            </div>
          </div>
        </div>
      </div>
    </div>

    <div style="padding: 22px 16px 0">
      <div style="display: flex; align-items: center; justify-content: space-between; padding-bottom: 12px">
        <span style="font-size: 1.05rem; font-weight: 800; color: var(--text)">Lists</span>
        <span class="accent-text" style="font-size: 0.72rem; font-weight: 800; letter-spacing: 0.06em; text-transform: uppercase">Add list</span>
      </div>
      <div class="ds-scroll-x" style="display: flex; gap: 12px; -webkit-overflow-scrolling: touch">
        <div style="flex: 0 0 auto; width: 168px; padding: 16px; border-radius: 18px; background: rgba(255, 255, 255, 0.04); border: 1px solid rgba(255,255,255,0.06)">
          <div style="font-size: 22px">🏔️</div>
          <div style="font-size: 0.95rem; font-weight: 800; color: var(--text); margin-top: 10px">Trail wishlist</div>
          <div style="font-size: 0.78rem; color: rgba(255, 255, 255, 0.55)">9 places</div>
          <div style="font-size: 0.7rem; color: rgba(255, 255, 255, 0.4); margin-top: 4px">By Sarah</div>
        </div>
        <div style="flex: 0 0 auto; width: 168px; padding: 16px; border-radius: 18px; background: rgba(255, 255, 255, 0.04); border: 1px solid rgba(255,255,255,0.06)">
          <div style="font-size: 22px">☕️</div>
          <div style="font-size: 0.95rem; font-weight: 800; color: var(--text); margin-top: 10px">Trailhead coffee</div>
          <div style="font-size: 0.78rem; color: rgba(255, 255, 255, 0.55)">4 places</div>
          <div style="font-size: 0.7rem; color: rgba(255, 255, 255, 0.4); margin-top: 4px">By you</div>
        </div>
      </div>
    </div>

  </div>
</div>
