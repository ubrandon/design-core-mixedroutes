<link rel="stylesheet" href="../../../../styles/shared.css" />
<link rel="stylesheet" href="../../../../styles/ds.css" />
<link rel="stylesheet" href="../../../../data/design-system/company.css" />

<div style="background: var(--bg-0); overflow-x: clip">
  <div class="mr-scope" style="padding-bottom: 32px">
    <div
      style="
        position: relative;
        padding: 18px 16px 24px;
        background: linear-gradient(180deg, rgba(255, 255, 255, 0.04), rgba(255, 255, 255, 0));
      "
    >
      <div style="display: flex; justify-content: space-between; align-items: center">
        <button type="button" class="mr-nav-icon-btn" aria-label="Back">
          <i class="ph ph-arrow-left" aria-hidden="true"></i>
        </button>
        <button type="button" class="mr-nav-icon-btn" aria-label="More">
          <i class="ph ph-dots-three-vertical" aria-hidden="true"></i>
        </button>
      </div>

      <div style="display: flex; flex-direction: column; align-items: center; padding-top: 14px">
        <img
          src="https://i.pravatar.cc/240?img=32"
          alt=""
          style="width: 120px; height: 120px; border-radius: 50%; object-fit: cover; border: 3px solid rgba(255,255,255,0.1)"
          loading="lazy"
        />
        <div style="font-size: 1.7rem; font-weight: 800; color: var(--text); margin-top: 14px">Sarah Kim</div>
        <div style="font-size: 0.85rem; color: rgba(255, 255, 255, 0.55); margin-top: 2px">@sarahk · Joined Jan 2026</div>

        <div style="display: flex; gap: 10px; margin-top: 18px">
          <button type="button" class="btn btn-primary" style="padding: 12px 22px; border-radius: 999px; display: inline-flex; align-items: center; gap: 8px">
            <i class="ph-fill ph-user-plus" style="font-size: 16px"></i>
            Add friend
          </button>
          <button type="button" class="btn btn-secondary" style="padding: 12px 18px; border-radius: 999px; display: inline-flex; align-items: center; gap: 8px">
            <i class="ph-fill ph-chat-circle" style="font-size: 16px"></i>
            Message
          </button>
        </div>
      </div>
    </div>

    <div style="padding: 12px 16px 0">
      <div style="display: flex; align-items: center; justify-content: space-between; padding-bottom: 10px">
        <span style="font-size: 1.05rem; font-weight: 800; color: var(--text)">Interests in common</span>
        <span style="font-size: 0.78rem; color: rgba(255,255,255,0.5)">2 of 8</span>
      </div>
      <div class="mr-chip-row" style="padding-bottom: 18px">
        <button type="button" class="mr-chip">🥾 Hiking</button>
        <button type="button" class="mr-chip">🎸 Concerts</button>
      </div>
    </div>

    <div style="padding: 6px 16px 0">
      <div style="display: flex; align-items: center; justify-content: space-between; padding-bottom: 10px">
        <span style="font-size: 1.05rem; font-weight: 800; color: var(--text)">Groups in common</span>
        <span style="font-size: 0.78rem; color: rgba(255,255,255,0.5)">2</span>
      </div>

      <div class="ds-scroll-x" style="display: flex; gap: 12px; padding: 0 0 18px; -webkit-overflow-scrolling: touch">
        <div
          style="
            flex: 0 0 auto;
            width: 150px;
            border-radius: 18px;
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid rgba(255, 255, 255, 0.06);
            padding: 14px;
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
          "
        >
          <img
            src="https://images.unsplash.com/photo-1551632811-561732d1e306?auto=format&amp;fit=crop&amp;w=160&amp;h=160&amp;q=80"
            alt=""
            style="width: 68px; height: 68px; border-radius: 50%; object-fit: cover; border: 2px solid rgba(255,255,255,0.15)"
            loading="lazy"
          />
          <div style="font-size: 0.95rem; font-weight: 800; color: var(--text); margin-top: 10px">Hiking Crew</div>
          <div style="font-size: 0.78rem; color: rgba(255, 255, 255, 0.55); margin-top: 2px">12 members</div>
        </div>

        <div
          style="
            flex: 0 0 auto;
            width: 150px;
            border-radius: 18px;
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid rgba(255, 255, 255, 0.06);
            padding: 14px;
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
          "
        >
          <img
            src="https://images.unsplash.com/photo-1506157786151-b8491531f063?auto=format&amp;fit=crop&amp;w=160&amp;h=160&amp;q=80"
            alt=""
            style="width: 68px; height: 68px; border-radius: 50%; object-fit: cover; border: 2px solid rgba(255,255,255,0.15)"
            loading="lazy"
          />
          <div style="font-size: 0.95rem; font-weight: 800; color: var(--text); margin-top: 10px">Concert Buds</div>
          <div style="font-size: 0.78rem; color: rgba(255, 255, 255, 0.55); margin-top: 2px">6 members</div>
        </div>
      </div>
    </div>

    <div style="padding: 6px 16px 0">
      <div style="display: flex; align-items: center; justify-content: space-between; padding-bottom: 10px">
        <span style="font-size: 1.05rem; font-weight: 800; color: var(--text)">Public lists</span>
      </div>
      <div style="display: flex; gap: 12px; padding-bottom: 18px">
        <div style="flex: 1; padding: 16px; border-radius: 18px; background: rgba(255, 255, 255, 0.04); border: 1px solid rgba(255,255,255,0.06)">
          <div style="font-size: 22px">🏔️</div>
          <div style="font-size: 0.95rem; font-weight: 800; color: var(--text); margin-top: 10px">Trail wishlist</div>
          <div style="font-size: 0.78rem; color: rgba(255, 255, 255, 0.55)">9 places</div>
        </div>
        <div style="flex: 1; padding: 16px; border-radius: 18px; background: rgba(255, 255, 255, 0.04); border: 1px solid rgba(255,255,255,0.06)">
          <div style="font-size: 22px">🎤</div>
          <div style="font-size: 0.95rem; font-weight: 800; color: var(--text); margin-top: 10px">Music venues</div>
          <div style="font-size: 0.78rem; color: rgba(255, 255, 255, 0.55)">11 places</div>
        </div>
      </div>
    </div>

    <div style="padding: 6px 16px 0">
      <div style="font-size: 0.74rem; color: rgba(255,255,255,0.4); padding: 10px 4px; line-height: 1.5">
        Plans are visible to friends only.
      </div>
    </div>
  </div>
</div>
