<link rel="stylesheet" href="../../../../styles/shared.css" />
<link rel="stylesheet" href="../../../../styles/ds.css" />
<link rel="stylesheet" href="../../../../data/design-system/company.css" />

<div style="background: #06080e; overflow-x: clip; min-height: 100vh; display: flex; flex-direction: column">
  <div class="mr-scope" style="display: flex; flex-direction: column; flex: 1">
    <header style="display: flex; align-items: center; justify-content: space-between; padding: 18px 16px 8px">
      <button type="button" style="background: transparent; border: 0; color: var(--text); font-size: 0.95rem; font-weight: 700; padding: 6px">
        Cancel
      </button>
      <span style="font-size: 0.95rem; font-weight: 800; color: var(--text)">Crop photo</span>
      <button type="button" class="accent-text" style="background: transparent; border: 0; font-size: 0.95rem; font-weight: 800; padding: 6px">
        Done
      </button>
    </header>

    <div style="flex: 1; position: relative; display: flex; align-items: center; justify-content: center; padding: 28px 16px; overflow: hidden">
      <div
        style="
          position: relative;
          width: 100%;
          max-width: 320px;
          aspect-ratio: 1 / 1;
        "
      >
        <img
          src="https://images.unsplash.com/photo-1551632811-561732d1e306?auto=format&amp;fit=crop&amp;w=720&amp;h=720&amp;q=80"
          alt=""
          style="position: absolute; inset: -8% -8%; width: 116%; height: 116%; object-fit: cover; opacity: 0.5; filter: blur(2px)"
          loading="lazy"
        />
        <div
          style="
            position: absolute;
            inset: 0;
            border-radius: 50%;
            overflow: hidden;
            box-shadow: 0 0 0 9999px rgba(6, 8, 14, 0.65);
            border: 2px solid rgba(255,255,255,0.85);
          "
        >
          <img
            src="https://images.unsplash.com/photo-1551632811-561732d1e306?auto=format&amp;fit=crop&amp;w=720&amp;h=720&amp;q=80"
            alt=""
            style="width: 100%; height: 100%; object-fit: cover"
            loading="lazy"
          />
        </div>

        <div style="position: absolute; left: 6%; top: 6%; width: 18px; height: 18px; border-left: 2px solid rgba(255,255,255,0.85); border-top: 2px solid rgba(255,255,255,0.85)"></div>
        <div style="position: absolute; right: 6%; top: 6%; width: 18px; height: 18px; border-right: 2px solid rgba(255,255,255,0.85); border-top: 2px solid rgba(255,255,255,0.85)"></div>
        <div style="position: absolute; left: 6%; bottom: 6%; width: 18px; height: 18px; border-left: 2px solid rgba(255,255,255,0.85); border-bottom: 2px solid rgba(255,255,255,0.85)"></div>
        <div style="position: absolute; right: 6%; bottom: 6%; width: 18px; height: 18px; border-right: 2px solid rgba(255,255,255,0.85); border-bottom: 2px solid rgba(255,255,255,0.85)"></div>
      </div>
    </div>

    <div style="padding: 0 24px 18px">
      <div style="display: flex; align-items: center; gap: 12px">
        <i class="ph ph-magnifying-glass-minus" style="font-size: 18px; color: rgba(255,255,255,0.65)"></i>
        <div style="flex: 1; height: 4px; border-radius: 999px; background: rgba(255,255,255,0.12); position: relative">
          <div style="position: absolute; left: 0; top: 0; width: 38%; height: 100%; border-radius: 999px; background: linear-gradient(90deg, #6dd5ed, #2193b0)"></div>
          <div style="position: absolute; left: 38%; top: 50%; transform: translate(-50%, -50%); width: 18px; height: 18px; border-radius: 50%; background: #fff; box-shadow: 0 2px 8px rgba(0,0,0,0.4)"></div>
        </div>
        <i class="ph ph-magnifying-glass-plus" style="font-size: 18px; color: rgba(255,255,255,0.65)"></i>
      </div>
    </div>

    <div style="padding: 0 16px 24px; display: flex; gap: 10px; justify-content: center">
      <button type="button" class="btn btn-secondary btn-sm" style="display: inline-flex; align-items: center; gap: 6px">
        <i class="ph ph-arrow-counter-clockwise" style="font-size: 14px"></i>
        Rotate
      </button>
      <button type="button" class="btn btn-secondary btn-sm" style="display: inline-flex; align-items: center; gap: 6px">
        <i class="ph ph-flip-horizontal" style="font-size: 14px"></i>
        Flip
      </button>
      <button type="button" class="btn btn-secondary btn-sm" style="display: inline-flex; align-items: center; gap: 6px">
        <i class="ph ph-frame-corners" style="font-size: 14px"></i>
        Reset
      </button>
    </div>
  </div>
</div>
