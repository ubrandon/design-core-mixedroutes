<link rel="stylesheet" href="../../../../styles/shared.css" />
<link rel="stylesheet" href="../../../../styles/ds.css" />
<link rel="stylesheet" href="../../../../data/design-system/company.css" />

<div style="background: var(--bg-0); overflow-x: clip; min-height: 100vh">
  <div class="mr-scope" style="padding-bottom: 32px">
    <header style="display: flex; align-items: center; justify-content: space-between; padding: 18px 16px 8px">
      <button type="button" style="background: transparent; border: 0; color: var(--text); font-size: 0.95rem; font-weight: 700; padding: 6px">
        Cancel
      </button>
      <span style="font-size: 0.95rem; font-weight: 800; color: var(--text)">Description</span>
      <button type="button" class="accent-text" style="background: transparent; border: 0; font-size: 0.95rem; font-weight: 800; padding: 6px">
        Save
      </button>
    </header>

    <div style="padding: 18px 16px 0">
      <label style="display: block; font-size: 0.78rem; font-weight: 800; color: rgba(255,255,255,0.55); letter-spacing: 0.06em; text-transform: uppercase; margin-bottom: 8px">Description</label>
      <div
        style="
          padding: 14px 16px;
          border-radius: var(--mr-input-radius);
          background: var(--mr-input-surface);
          margin-bottom: 6px;
          border: 1.5px solid rgba(109, 213, 237, 0.5);
          min-height: 120px;
        "
      >
        <textarea
          maxlength="160"
          rows="4"
          style="width: 100%; background: transparent; border: 0; color: var(--text); font-size: 1rem; outline: none; resize: none; line-height: 1.5; font-family: inherit"
        >Asheville hikers, year-round.</textarea>
      </div>
      <div style="display: flex; justify-content: space-between; align-items: center; font-size: 0.74rem; color: rgba(255,255,255,0.5); margin-bottom: 22px">
        <span>One line works best</span>
        <span>30 / 160</span>
      </div>

      <div style="font-size: 0.7rem; font-weight: 800; color: rgba(255,255,255,0.45); letter-spacing: 0.08em; text-transform: uppercase; padding: 0 4px 8px">Suggestions</div>
      <div style="display: flex; flex-wrap: wrap; gap: 8px">
        <button type="button" style="padding: 8px 12px; border-radius: 999px; background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.08); color: var(--text); font-size: 0.82rem">
          Weekend trail crew
        </button>
        <button type="button" style="padding: 8px 12px; border-radius: 999px; background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.08); color: var(--text); font-size: 0.82rem">
          New friends welcome
        </button>
        <button type="button" style="padding: 8px 12px; border-radius: 999px; background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.08); color: var(--text); font-size: 0.82rem">
          Beginner-friendly
        </button>
      </div>
    </div>
  </div>
</div>
