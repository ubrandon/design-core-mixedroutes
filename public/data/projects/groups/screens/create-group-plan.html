<link rel="stylesheet" href="../../../../styles/shared.css" />
<link rel="stylesheet" href="../../../../styles/ds.css" />
<link rel="stylesheet" href="../../../../data/design-system/company.css" />

<div style="background: var(--bg-0); overflow-x: clip; min-height: 100vh">
  <div class="mr-scope" style="padding-bottom: 120px">
    <header style="display: flex; align-items: center; justify-content: space-between; padding: 18px 16px 8px">
      <button type="button" class="mr-nav-icon-btn" aria-label="Close">
        <i class="ph ph-x" aria-hidden="true"></i>
      </button>
      <span style="font-size: 0.95rem; font-weight: 800; color: var(--text)">New plan</span>
      <div style="width: 36px"></div>
    </header>

    <div style="padding: 6px 16px 0">
      <div
        style="
          padding: 12px 14px;
          border-radius: 14px;
          background: rgba(91, 109, 248, 0.12);
          border: 1px solid rgba(91, 109, 248, 0.3);
          display: flex;
          align-items: center;
          gap: 12px;
          margin-bottom: 18px;
        "
      >
        <img
          src="https://images.unsplash.com/photo-1551632811-561732d1e306?auto=format&amp;fit=crop&amp;w=120&amp;h=120&amp;q=80"
          alt=""
          style="width: 36px; height: 36px; border-radius: 10px; object-fit: cover"
          loading="lazy"
        />
        <div style="flex: 1; min-width: 0">
          <div style="font-size: 0.7rem; font-weight: 800; color: rgba(255,255,255,0.55); letter-spacing: 0.06em; text-transform: uppercase">Sharing with</div>
          <div style="font-size: 0.95rem; font-weight: 800; color: var(--text)">Hiking Crew · 12 members</div>
        </div>
        <button type="button" style="font-size: 0.78rem; font-weight: 800; color: #6dd5ed; background: transparent; border: 0">Change</button>
      </div>

      <label style="display: block; font-size: 0.72rem; font-weight: 800; color: rgba(255,255,255,0.55); letter-spacing: 0.06em; text-transform: uppercase; margin-bottom: 8px">What</label>
      <div style="padding: 14px 16px; border-radius: var(--mr-input-radius); background: var(--mr-input-surface); margin-bottom: 16px">
        <input type="text" placeholder="Plan title" style="width: 100%; background: transparent; border: 0; color: var(--text); font-size: 1rem; outline: none" value="Sunrise hike at Craggy" />
      </div>

      <label style="display: block; font-size: 0.72rem; font-weight: 800; color: rgba(255,255,255,0.55); letter-spacing: 0.06em; text-transform: uppercase; margin-bottom: 8px">When</label>
      <div style="display: flex; gap: 10px; margin-bottom: 16px">
        <div style="flex: 1; padding: 14px 16px; border-radius: var(--mr-input-radius); background: var(--mr-input-surface); display: flex; align-items: center; gap: 10px">
          <i class="ph ph-calendar" style="font-size: 18px; color: rgba(255,255,255,0.6)"></i>
          <span style="color: var(--text); font-size: 0.95rem">Sat, Apr 27</span>
        </div>
        <div style="flex: 1; padding: 14px 16px; border-radius: var(--mr-input-radius); background: var(--mr-input-surface); display: flex; align-items: center; gap: 10px">
          <i class="ph ph-clock" style="font-size: 18px; color: rgba(255,255,255,0.6)"></i>
          <span style="color: var(--text); font-size: 0.95rem">7:00 AM</span>
        </div>
      </div>

      <label style="display: block; font-size: 0.72rem; font-weight: 800; color: rgba(255,255,255,0.55); letter-spacing: 0.06em; text-transform: uppercase; margin-bottom: 8px">Where</label>
      <div style="padding: 14px 16px; border-radius: var(--mr-input-radius); background: var(--mr-input-surface); margin-bottom: 16px; display: flex; align-items: center; gap: 10px">
        <i class="ph-fill ph-map-pin" style="font-size: 18px; color: rgba(255,255,255,0.6)"></i>
        <input type="text" placeholder="Add a place" value="Craggy Pinnacle" style="flex: 1; background: transparent; border: 0; color: var(--text); font-size: 0.95rem; outline: none" />
      </div>

      <label style="display: block; font-size: 0.72rem; font-weight: 800; color: rgba(255,255,255,0.55); letter-spacing: 0.06em; text-transform: uppercase; margin-bottom: 8px">Notes · optional</label>
      <div style="padding: 14px 16px; border-radius: var(--mr-input-radius); background: var(--mr-input-surface); margin-bottom: 22px">
        <textarea
          placeholder="Anything else? (parking, what to bring…)"
          rows="3"
          style="width: 100%; background: transparent; border: 0; color: var(--text); font-size: 0.95rem; outline: none; resize: none; font-family: inherit"
        ></textarea>
      </div>

      <div
        style="
          display: flex;
          align-items: center;
          gap: 10px;
          padding: 12px 14px;
          border-radius: 14px;
          background: rgba(255, 255, 255, 0.03);
          border: 1px solid rgba(255,255,255,0.06);
          margin-bottom: 12px;
        "
      >
        <i class="ph ph-image" style="font-size: 22px; color: rgba(255,255,255,0.55)"></i>
        <div style="flex: 1">
          <div style="font-size: 0.88rem; font-weight: 800; color: var(--text)">Cover photo</div>
          <div style="font-size: 0.74rem; color: rgba(255,255,255,0.5)">We'll use a placeholder if you skip.</div>
        </div>
        <i class="ph ph-caret-right" style="font-size: 14px; color: rgba(255,255,255,0.4)"></i>
      </div>

      <div
        style="
          display: flex;
          align-items: center;
          gap: 10px;
          padding: 12px 14px;
          border-radius: 14px;
          background: rgba(255, 255, 255, 0.03);
          border: 1px solid rgba(255,255,255,0.06);
        "
      >
        <i class="ph ph-link-simple" style="font-size: 22px; color: rgba(255,255,255,0.55)"></i>
        <div style="flex: 1">
          <div style="font-size: 0.88rem; font-weight: 800; color: var(--text)">Attach a list</div>
          <div style="font-size: 0.74rem; color: rgba(255,255,255,0.5)">Share places to vote on.</div>
        </div>
        <i class="ph ph-caret-right" style="font-size: 14px; color: rgba(255,255,255,0.4)"></i>
      </div>
    </div>

    <div
      style="
        position: fixed;
        left: 0;
        right: 0;
        bottom: 0;
        padding: 12px 16px 20px;
        background: linear-gradient(180deg, transparent, var(--bg-0) 28%);
      "
    >
      <button type="button" class="btn btn-primary" style="width: 100%; padding: 16px; border-radius: 999px">
        Create group plan
      </button>
    </div>
  </div>
</div>
