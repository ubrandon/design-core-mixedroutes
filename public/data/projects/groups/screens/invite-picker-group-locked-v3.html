<link rel="stylesheet" href="../../../../styles/shared.css" />
<link rel="stylesheet" href="../../../../styles/ds.css" />
<link rel="stylesheet" href="../../../../data/design-system/company.css" />

<div style="background: var(--bg-0); overflow-x: clip; min-height: 100vh">
  <div class="mr-scope" style="padding-bottom: 110px">
    <header style="display: flex; align-items: center; justify-content: space-between; padding: 18px 16px 8px">
      <button type="button" class="mr-nav-icon-btn" aria-label="Back">
        <i class="ph ph-arrow-left" aria-hidden="true"></i>
      </button>
      <span style="font-size: 1rem; font-weight: 800; color: var(--text)">Invite</span>
      <span style="width: 32px"></span>
    </header>

    <div style="padding: 8px 16px 4px">
      <div style="font-size: 1.5rem; font-weight: 800; color: var(--text); margin-bottom: 4px">Who's coming?</div>
      <div style="font-size: 0.86rem; color: rgba(255,255,255,0.6); margin-bottom: 16px; line-height: 1.4">Bring a whole group, or pick people one by one.</div>

      <div class="mr-search-bar" style="margin-bottom: 18px">
        <i class="ph-fill ph-magnifying-glass" aria-hidden="true"></i>
        <input type="search" placeholder="Search groups or people" autocomplete="off" />
      </div>
    </div>

    <div style="padding: 4px 16px 6px; display: flex; align-items: center; gap: 8px">
      <i class="ph-fill ph-users-three" style="font-size: 16px; color: rgba(255,255,255,0.7)"></i>
      <span style="font-size: 0.78rem; font-weight: 800; color: rgba(255,255,255,0.7); letter-spacing: 0.06em; text-transform: uppercase">Whole group</span>
    </div>

    <div class="ds-scroll-x" style="display: flex; gap: 12px; padding: 4px 16px 18px">
      <button type="button" style="flex: 0 0 auto; width: 132px; padding: 14px; border-radius: 18px; background: rgba(109,213,237,0.1); border: 1.5px solid #6dd5ed; display: flex; flex-direction: column; align-items: center; gap: 10px; text-align: center; cursor: pointer; position: relative">
        <span style="position: absolute; top: 8px; right: 8px; width: 22px; height: 22px; border-radius: 50%; background: linear-gradient(135deg,#6dd5ed,#2193b0); display: flex; align-items: center; justify-content: center"><i class="ph-fill ph-check" style="font-size: 12px; color: #06080e"></i></span>
        <div style="width: 48px; height: 48px; border-radius: 14px; overflow: hidden">
          <img src="https://images.unsplash.com/photo-1464822759023-fed622ff2c3b?w=200" alt="" style="width: 100%; height: 100%; object-fit: cover" loading="lazy" />
        </div>
        <div>
          <div style="font-size: 0.88rem; font-weight: 800; color: var(--text); margin-bottom: 2px">Hiking Crew</div>
          <div style="font-size: 0.7rem; color: rgba(255,255,255,0.7)">12 members</div>
        </div>
      </button>
      <button type="button" disabled style="flex: 0 0 auto; width: 132px; padding: 14px; border-radius: 18px; background: rgba(255,255,255,0.02); border: 1px solid rgba(255,255,255,0.04); display: flex; flex-direction: column; align-items: center; gap: 10px; text-align: center; opacity: 0.4">
        <div style="width: 48px; height: 48px; border-radius: 14px; background: linear-gradient(135deg,#6dd5ed,#2193b0); display: flex; align-items: center; justify-content: center; color: #06080e">
          <i class="ph-fill ph-game-controller" style="font-size: 22px"></i>
        </div>
        <div>
          <div style="font-size: 0.88rem; font-weight: 800; color: var(--text); margin-bottom: 2px">Tuesday Valorant</div>
          <div style="font-size: 0.7rem; color: rgba(255,255,255,0.55)">8 members</div>
        </div>
      </button>
      <button type="button" disabled style="flex: 0 0 auto; width: 132px; padding: 14px; border-radius: 18px; background: rgba(255,255,255,0.02); border: 1px solid rgba(255,255,255,0.04); display: flex; flex-direction: column; align-items: center; gap: 10px; text-align: center; opacity: 0.4">
        <div style="width: 48px; height: 48px; border-radius: 14px; background: linear-gradient(135deg,#f6a86b,#e07c5a); display: flex; align-items: center; justify-content: center; color: #06080e">
          <i class="ph-fill ph-briefcase" style="font-size: 20px"></i>
        </div>
        <div>
          <div style="font-size: 0.88rem; font-weight: 800; color: var(--text); margin-bottom: 2px">Coworkers</div>
          <div style="font-size: 0.7rem; color: rgba(255,255,255,0.55)">6 members</div>
        </div>
      </button>
    </div>

    <div style="padding: 4px 16px 6px; display: flex; align-items: center; gap: 8px; opacity: 0.4">
      <i class="ph-fill ph-user" style="font-size: 14px; color: rgba(255,255,255,0.7)"></i>
      <span style="font-size: 0.78rem; font-weight: 800; color: rgba(255,255,255,0.7); letter-spacing: 0.06em; text-transform: uppercase">Or just some people</span>
    </div>

    <div style="padding: 0 16px 8px; display: flex; flex-direction: column; opacity: 0.35; pointer-events: none">
      <div style="display: flex; align-items: center; gap: 12px; padding: 12px 4px">
        <img src="https://i.pravatar.cc/72?img=12" alt="" style="width: 44px; height: 44px; border-radius: 50%; object-fit: cover" loading="lazy" />
        <div style="flex: 1; min-width: 0">
          <div style="font-size: 0.95rem; font-weight: 800; color: var(--text)">Riley Stone</div>
          <div style="font-size: 0.78rem; color: rgba(255,255,255,0.5)">@riley</div>
        </div>
        <div style="width: 22px; height: 22px; border-radius: 6px; border: 1.5px solid rgba(255,255,255,0.18)"></div>
      </div>

      <div style="display: flex; align-items: center; gap: 12px; padding: 12px 4px">
        <img src="https://i.pravatar.cc/72?img=20" alt="" style="width: 44px; height: 44px; border-radius: 50%; object-fit: cover" loading="lazy" />
        <div style="flex: 1; min-width: 0">
          <div style="font-size: 0.95rem; font-weight: 800; color: var(--text)">Jordan Lee</div>
          <div style="font-size: 0.78rem; color: rgba(255,255,255,0.5)">@jordanl</div>
        </div>
        <div style="width: 22px; height: 22px; border-radius: 6px; border: 1.5px solid rgba(255,255,255,0.18)"></div>
      </div>

      <div style="display: flex; align-items: center; gap: 12px; padding: 12px 4px">
        <img src="https://i.pravatar.cc/72?img=47" alt="" style="width: 44px; height: 44px; border-radius: 50%; object-fit: cover" loading="lazy" />
        <div style="flex: 1; min-width: 0">
          <div style="font-size: 0.95rem; font-weight: 800; color: var(--text)">Sam Rivera</div>
          <div style="font-size: 0.78rem; color: rgba(255,255,255,0.5)">@srivera</div>
        </div>
        <div style="width: 22px; height: 22px; border-radius: 6px; border: 1.5px solid rgba(255,255,255,0.18)"></div>
      </div>

      <div style="display: flex; align-items: center; gap: 12px; padding: 12px 4px">
        <img src="https://i.pravatar.cc/72?img=53" alt="" style="width: 44px; height: 44px; border-radius: 50%; object-fit: cover" loading="lazy" />
        <div style="flex: 1; min-width: 0">
          <div style="font-size: 0.95rem; font-weight: 800; color: var(--text)">Sam Chen</div>
          <div style="font-size: 0.78rem; color: rgba(255,255,255,0.5)">@sammy_c</div>
        </div>
        <div style="width: 22px; height: 22px; border-radius: 6px; border: 1.5px solid rgba(255,255,255,0.18)"></div>
      </div>

      <div style="display: flex; align-items: center; gap: 12px; padding: 12px 4px">
        <img src="https://i.pravatar.cc/72?img=33" alt="" style="width: 44px; height: 44px; border-radius: 50%; object-fit: cover" loading="lazy" />
        <div style="flex: 1; min-width: 0">
          <div style="font-size: 0.95rem; font-weight: 800; color: var(--text)">Alex Park</div>
          <div style="font-size: 0.78rem; color: rgba(255,255,255,0.5)">@alexp</div>
        </div>
        <div style="width: 22px; height: 22px; border-radius: 6px; border: 1.5px solid rgba(255,255,255,0.18)"></div>
      </div>
    </div>

    <div style="position: fixed; bottom: 0; left: 0; right: 0; padding: 12px 16px 20px; background: linear-gradient(180deg, transparent, var(--bg-0) 32%); pointer-events: none">
      <div style="pointer-events: auto; display: flex; align-items: center; gap: 12px; padding: 10px 12px 10px 14px; border-radius: 999px; background: rgba(255,255,255,0.06); border: 1px solid rgba(109,213,237,0.25); backdrop-filter: blur(12px)">
        <div style="display: flex; align-items: center">
          <img src="https://i.pravatar.cc/56?img=12" alt="" style="width: 28px; height: 28px; border-radius: 50%; object-fit: cover; border: 2px solid var(--bg-0)" loading="lazy" />
          <img src="https://i.pravatar.cc/56?img=32" alt="" style="width: 28px; height: 28px; border-radius: 50%; object-fit: cover; border: 2px solid var(--bg-0); margin-left: -10px" loading="lazy" />
          <img src="https://i.pravatar.cc/56?img=8" alt="" style="width: 28px; height: 28px; border-radius: 50%; object-fit: cover; border: 2px solid var(--bg-0); margin-left: -10px" loading="lazy" />
          <img src="https://i.pravatar.cc/56?img=14" alt="" style="width: 28px; height: 28px; border-radius: 50%; object-fit: cover; border: 2px solid var(--bg-0); margin-left: -10px" loading="lazy" />
          <span style="width: 28px; height: 28px; border-radius: 50%; background: rgba(255,255,255,0.12); border: 2px solid var(--bg-0); margin-left: -10px; display: flex; align-items: center; justify-content: center; font-size: 0.66rem; font-weight: 800; color: var(--text)">+8</span>
        </div>
        <div style="flex: 1; min-width: 0">
          <div style="font-size: 0.84rem; font-weight: 800; color: var(--text); line-height: 1.2">Hiking Crew · 12 going</div>
        </div>
        <button type="button" class="btn btn-primary" style="padding: 10px 20px; border-radius: 999px; font-size: 0.86rem; font-weight: 800">
          Send
        </button>
      </div>
      <div style="text-align: center; margin-top: 8px">
        <button type="button" style="background: transparent; border: 0; color: rgba(255,255,255,0.55); font-size: 0.78rem; font-weight: 700; padding: 4px 8px">
          Pick people instead
        </button>
      </div>
    </div>
  </div>
</div>
