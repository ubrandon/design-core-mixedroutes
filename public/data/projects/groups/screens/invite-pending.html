<link rel="stylesheet" href="../../../../styles/shared.css" />
<link rel="stylesheet" href="../../../../styles/ds.css" />
<link rel="stylesheet" href="../../../../data/design-system/company.css" />

<div style="background: var(--bg-0); overflow-x: clip; min-height: 100vh">
  <div class="mr-scope" style="padding-bottom: 32px">
    <header style="display: flex; align-items: center; gap: 8px; padding: 18px 16px 8px">
      <button type="button" class="mr-nav-icon-btn" aria-label="Back">
        <i class="ph ph-arrow-left" aria-hidden="true"></i>
      </button>
      <span style="font-size: 1.1rem; font-weight: 800; color: var(--text)">Pending invites</span>
    </header>

    <div style="padding: 6px 16px 14px; font-size: 0.82rem; color: rgba(255,255,255,0.5); line-height: 1.5">
      You said "Maybe later" on these. They'll stay here for 14 days.
    </div>

    <div style="padding: 0 16px; display: flex; flex-direction: column; gap: 12px">
      <div
        style="
          padding: 16px;
          border-radius: 18px;
          background: rgba(255, 255, 255, 0.04);
          border: 1px solid rgba(255,255,255,0.06);
        "
      >
        <div style="display: flex; align-items: center; gap: 12px; margin-bottom: 12px">
          <img
            src="https://images.unsplash.com/photo-1551632811-561732d1e306?auto=format&amp;fit=crop&amp;w=160&amp;h=160&amp;q=80"
            alt=""
            style="width: 52px; height: 52px; border-radius: 14px; object-fit: cover"
            loading="lazy"
          />
          <div style="flex: 1; min-width: 0">
            <div style="font-size: 1rem; font-weight: 800; color: var(--text)">Hiking Crew</div>
            <div style="font-size: 0.78rem; color: rgba(255,255,255,0.55); white-space: nowrap; overflow: hidden; text-overflow: ellipsis">Invited by Brandon · 12 members</div>
          </div>
        </div>

        <div style="display: flex; align-items: center; gap: 10px; padding: 8px 12px; border-radius: 10px; background: rgba(232, 201, 107, 0.08); border: 1px solid rgba(232, 201, 107, 0.2); margin-bottom: 14px">
          <i class="ph ph-clock" style="font-size: 14px; color: #e8c96b"></i>
          <span style="flex: 1; font-size: 0.78rem; color: rgba(255, 255, 255, 0.7)">Expires in 9 days</span>
        </div>

        <div style="display: flex; gap: 8px">
          <button type="button" class="btn btn-primary" style="flex: 1; padding: 12px; border-radius: 999px; font-size: 0.88rem">
            Join
          </button>
          <button type="button" class="btn btn-secondary" style="flex: 1; padding: 12px; border-radius: 999px; font-size: 0.88rem">
            Decline
          </button>
        </div>
      </div>

      <div
        style="
          padding: 16px;
          border-radius: 18px;
          background: rgba(255, 255, 255, 0.04);
          border: 1px solid rgba(255,255,255,0.06);
        "
      >
        <div style="display: flex; align-items: center; gap: 12px; margin-bottom: 12px">
          <div style="width: 52px; height: 52px; border-radius: 14px; background: linear-gradient(135deg, #5b6df8, #9c4dff); display: flex; align-items: center; justify-content: center; font-size: 24px">🎬</div>
          <div style="flex: 1; min-width: 0">
            <div style="font-size: 1rem; font-weight: 800; color: var(--text)">Movie Club</div>
            <div style="font-size: 0.78rem; color: rgba(255,255,255,0.55); white-space: nowrap; overflow: hidden; text-overflow: ellipsis">Invited by Mike · 8 members</div>
          </div>
        </div>

        <div style="display: flex; align-items: center; gap: 10px; padding: 8px 12px; border-radius: 10px; background: rgba(255, 122, 133, 0.08); border: 1px solid rgba(255, 122, 133, 0.22); margin-bottom: 14px">
          <i class="ph ph-clock" style="font-size: 14px; color: #ff7a85"></i>
          <span style="flex: 1; font-size: 0.78rem; color: rgba(255, 255, 255, 0.7)">Expires in 2 days</span>
        </div>

        <div style="display: flex; gap: 8px">
          <button type="button" class="btn btn-primary" style="flex: 1; padding: 12px; border-radius: 999px; font-size: 0.88rem">
            Join
          </button>
          <button type="button" class="btn btn-secondary" style="flex: 1; padding: 12px; border-radius: 999px; font-size: 0.88rem">
            Decline
          </button>
        </div>
      </div>
    </div>

    <div style="padding: 22px 32px 0; text-align: center; font-size: 0.74rem; color: rgba(255,255,255,0.4); line-height: 1.5">
      Declined invites are removed and can be re-sent by the group.
    </div>
  </div>
</div>
