<link rel="stylesheet" href="../../../../styles/shared.css" />
<link rel="stylesheet" href="../../../../styles/ds.css" />
<link rel="stylesheet" href="../../../../data/design-system/company.css" />

<style>
  .chat-scope { --chat-bg: #0b0f14; --chat-surface: #1b2027; }
  .chat-scope .chat-wrap { background: var(--chat-bg); height: 844px; display: flex; flex-direction: column; position: relative; overflow: hidden; }
  .chat-scope .chat-pattern { position: absolute; inset: 0; background-image: url('https://raw.githubusercontent.com/telegramdesktop/tdesktop/dev/Telegram/Resources/art/bg/pattern.png'); background-size: 420px; opacity: 0.04; pointer-events: none; mix-blend-mode: screen; }

  .chat-scope .chat-header { position: relative; z-index: 3; display: grid; grid-template-columns: 28px 1fr 28px; align-items: center; gap: 12px; padding: 14px 16px 10px; }
  .chat-scope .chat-header .back { background: transparent; border: 0; color: rgba(255,255,255,0.95); display: inline-flex; align-items: center; padding: 0; cursor: pointer; }
  .chat-scope .chat-header .back i { font-size: 24px; }
  .chat-scope .chat-header .title { font-size: 1.25rem; font-weight: 800; color: #fff; }
  .chat-scope .chat-header .edit-btn { background: transparent; border: 0; color: rgba(255,255,255,0.95); padding: 0; cursor: pointer; display: inline-flex; align-items: center; justify-self: end; }
  .chat-scope .chat-header .edit-btn i { font-size: 22px; }

  .chat-scope .sidebar-layout { display: grid; grid-template-columns: 116px 1fr; flex: 1; min-height: 0; position: relative; z-index: 1; }

  .chat-scope .side-tags { background: rgba(255,255,255,0.03); padding: 10px 8px; overflow-y: auto; display: flex; flex-direction: column; gap: 4px; border-right: 1px solid rgba(255,255,255,0.05); }
  .chat-scope .side-tag { display: grid; grid-template-columns: 8px 1fr auto; align-items: center; gap: 8px; padding: 10px 10px; border-radius: 10px; cursor: pointer; color: rgba(255,255,255,0.75); }
  .chat-scope .side-tag .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--swatch, #5eb3ff); }
  .chat-scope .side-tag .lbl { font-size: 0.92rem; font-weight: 700; color: #fff; overflow: hidden; text-overflow: ellipsis; }
  .chat-scope .side-tag .ct { color: rgba(255,255,255,0.5); font-size: 0.75rem; font-weight: 700; }
  .chat-scope .side-tag.active { background: rgba(94,179,255,0.14); }
  .chat-scope .side-tag.active .lbl { color: #fff; }
  .chat-scope .side-tag.new { color: rgba(255,255,255,0.55); grid-template-columns: 16px 1fr; }
  .chat-scope .side-tag.new i { font-size: 14px; }
  .chat-scope .side-tag.new .lbl { color: rgba(255,255,255,0.6); font-weight: 600; }

  .chat-scope .content { padding: 12px 14px 16px; overflow-y: auto; display: flex; flex-direction: column; gap: 10px; }
  .chat-scope .content .title-row { display: flex; align-items: baseline; gap: 8px; margin-bottom: 4px; }
  .chat-scope .content .title-row .t { color: #fff; font-size: 1.1rem; font-weight: 800; }
  .chat-scope .content .title-row .ct { color: rgba(255,255,255,0.5); font-size: 0.85rem; font-weight: 700; }

  .chat-scope .link-card { background: linear-gradient(135deg, #3a6a66, #2f7a72); border-radius: 14px; padding: 11px 12px; }
  .chat-scope .link-card .row1 { display: flex; align-items: center; gap: 6px; margin-bottom: 4px; }
  .chat-scope .link-card .row1 img { width: 20px; height: 20px; border-radius: 50%; object-fit: cover; }
  .chat-scope .link-card .row1 .who { color: #fff; font-weight: 800; font-size: 0.88rem; }
  .chat-scope .link-card .row1 .time { margin-left: auto; color: rgba(255,255,255,0.75); font-size: 0.72rem; }
  .chat-scope .link-card .url { color: #cfe9ff; font-size: 0.88rem; text-decoration: underline; }
  .chat-scope .link-card .meta { margin-top: 6px; padding: 6px 9px; background: rgba(255,255,255,0.08); border-left: 3px solid rgba(255,255,255,0.5); border-radius: 4px; }
  .chat-scope .link-card .meta .domain { color: rgba(255,255,255,0.7); font-size: 0.65rem; letter-spacing: 0.08em; text-transform: uppercase; }
  .chat-scope .link-card .meta .t { color: #fff; font-weight: 800; font-size: 0.88rem; }
</style>

<div class="mr-scope chat-scope">
  <div class="chat-wrap">
    <div class="chat-pattern" aria-hidden="true"></div>
    <header class="chat-header">
      <button type="button" class="back" aria-label="Back"><i class="ph ph-arrow-left"></i></button>
      <div class="title">Tags</div>
      <button type="button" class="edit-btn" aria-label="Edit"><i class="ph ph-pencil-simple"></i></button>
    </header>

    <div class="sidebar-layout">
      <div class="side-tags">
        <div class="side-tag active" style="--swatch:#5eb3ff"><span class="dot"></span><span class="lbl">Links</span><span class="ct">3</span></div>
        <div class="side-tag" style="--swatch:#f5a524"><span class="dot"></span><span class="lbl">Test</span><span class="ct">1</span></div>
        <div class="side-tag" style="--swatch:#a78bfa"><span class="dot"></span><span class="lbl">Ideas</span><span class="ct">8</span></div>
        <div class="side-tag" style="--swatch:#f87171"><span class="dot"></span><span class="lbl">Important</span><span class="ct">2</span></div>
        <div class="side-tag new"><i class="ph ph-plus"></i><span class="lbl">New</span></div>
      </div>

      <div class="content">
        <div class="title-row"><span class="t">Links</span><span class="ct">3 items</span></div>

        <div class="link-card">
          <div class="row1"><img src="https://i.pravatar.cc/40?img=12" alt="" /><span class="who">You</span><span class="time">4:30 PM</span></div>
          <span class="url">google.com</span>
          <div class="meta"><div class="domain">Google.com</div><div class="t">Google</div></div>
        </div>

        <div class="link-card">
          <div class="row1"><img src="https://i.pravatar.cc/40?img=15" alt="" /><span class="who">Eric</span><span class="time">Tue</span></div>
          <span class="url">figma.com/file/abc</span>
          <div class="meta"><div class="domain">Figma.com</div><div class="t">Designs v2</div></div>
        </div>

        <div class="link-card">
          <div class="row1"><img src="https://i.pravatar.cc/40?img=22" alt="" /><span class="who">Daniel</span><span class="time">Mon</span></div>
          <span class="url">espn.com/ufc</span>
          <div class="meta"><div class="domain">ESPN.com</div><div class="t">UFC 329 odds</div></div>
        </div>
      </div>
    </div>
  </div>
</div>
