<link rel="stylesheet" href="../../../../styles/shared.css" />
<link rel="stylesheet" href="../../../../styles/ds.css" />
<link rel="stylesheet" href="../../../../data/design-system/company.css" />

<style>
  .chat-scope { --chat-bg: #0b0f14; --chat-surface: #1b2027; }
  .chat-scope .chat-wrap { background: var(--chat-bg); height: 844px; display: flex; flex-direction: column; position: relative; overflow: hidden; }
  .chat-scope .chat-pattern { position: absolute; inset: 0; background-image: url('https://raw.githubusercontent.com/telegramdesktop/tdesktop/dev/Telegram/Resources/art/bg/pattern.png'); background-size: 420px; opacity: 0.04; pointer-events: none; mix-blend-mode: screen; }

  .chat-scope .chat-header { position: relative; z-index: 3; display: grid; grid-template-columns: 28px 1fr 28px; align-items: center; gap: 12px; padding: 14px 16px 8px; background: transparent; }
  .chat-scope .chat-header .back { background: transparent; border: 0; color: rgba(255,255,255,0.95); display: inline-flex; align-items: center; justify-content: center; padding: 0; cursor: pointer; }
  .chat-scope .chat-header .back i { font-size: 24px; }
  .chat-scope .chat-header .title { font-size: 1.25rem; font-weight: 800; color: #fff; }
  .chat-scope .chat-header .edit-btn { background: transparent; border: 0; color: rgba(255,255,255,0.95); padding: 0; cursor: pointer; display: inline-flex; align-items: center; justify-content: center; justify-self: end; }
  .chat-scope .chat-header .edit-btn i { font-size: 22px; }

  .chat-scope .search { margin: 4px 16px 12px; display: grid; grid-template-columns: 18px 1fr; gap: 8px; align-items: center; background: rgba(255,255,255,0.06); border-radius: 12px; padding: 9px 12px; position: relative; z-index: 2; }
  .chat-scope .search i { color: rgba(255,255,255,0.45); font-size: 16px; }
  .chat-scope .search .ph-label { color: rgba(255,255,255,0.45); font-size: 0.95rem; }

  .chat-scope .body { position: relative; z-index: 1; flex: 1; overflow-y: auto; padding: 0 0 16px; }

  .chat-scope .tag-section { padding: 14px 16px 6px; }
  .chat-scope .tag-section-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 8px; }
  .chat-scope .tag-section-head .left { display: inline-flex; align-items: center; gap: 8px; }
  .chat-scope .tag-section-head .swatch { width: 10px; height: 10px; border-radius: 50%; }
  .chat-scope .tag-section-head .name { font-size: 1rem; font-weight: 800; color: #fff; }
  .chat-scope .tag-section-head .count { color: rgba(255,255,255,0.5); font-size: 0.85rem; font-weight: 600; }
  .chat-scope .tag-section-head .see { color: #5eb3ff; font-size: 0.85rem; font-weight: 700; }

  .chat-scope .card { background: var(--chat-surface); border-radius: 14px; padding: 12px 14px; margin-bottom: 8px; display: grid; grid-template-columns: 32px 1fr auto; gap: 10px; align-items: center; }
  .chat-scope .card .av { width: 32px; height: 32px; border-radius: 50%; object-fit: cover; }
  .chat-scope .card .who { color: #fff; font-weight: 700; font-size: 0.92rem; }
  .chat-scope .card .preview { color: rgba(255,255,255,0.7); font-size: 0.88rem; margin-top: 1px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .chat-scope .card .time { color: rgba(255,255,255,0.45); font-size: 0.75rem; }

  .chat-scope .link-card { background: linear-gradient(135deg, #3a6a66, #2f7a72); border-radius: 14px; padding: 12px 14px; margin-bottom: 8px; }
  .chat-scope .link-card .row1 { display: flex; align-items: center; gap: 8px; margin-bottom: 6px; }
  .chat-scope .link-card .row1 img { width: 22px; height: 22px; border-radius: 50%; object-fit: cover; }
  .chat-scope .link-card .row1 .who { color: #fff; font-weight: 800; font-size: 0.92rem; }
  .chat-scope .link-card .row1 .time { margin-left: auto; color: rgba(255,255,255,0.75); font-size: 0.75rem; }
  .chat-scope .link-card .url { color: #cfe9ff; font-size: 0.92rem; text-decoration: underline; }
  .chat-scope .link-card .meta { margin-top: 8px; padding: 8px 10px; background: rgba(255,255,255,0.08); border-left: 3px solid rgba(255,255,255,0.5); border-radius: 4px; }
  .chat-scope .link-card .meta .domain { color: rgba(255,255,255,0.7); font-size: 0.7rem; letter-spacing: 0.08em; text-transform: uppercase; }
  .chat-scope .link-card .meta .t { color: #fff; font-weight: 800; font-size: 0.95rem; }
</style>

<div class="mr-scope chat-scope">
  <div class="chat-wrap">
    <div class="chat-pattern" aria-hidden="true"></div>
    <header class="chat-header">
      <button type="button" class="back" aria-label="Back"><i class="ph ph-arrow-left"></i></button>
      <div class="title">Tags</div>
      <button type="button" class="edit-btn" aria-label="Edit"><i class="ph ph-pencil-simple"></i></button>
    </header>

    <div class="search">
      <i class="ph ph-magnifying-glass"></i>
      <span class="ph-label">Search tagged messages</span>
    </div>

    <div class="body">
      <div class="tag-section">
        <div class="tag-section-head">
          <div class="left"><span class="swatch" style="background:#5eb3ff"></span><span class="name">Links</span><span class="count">3</span></div>
          <span class="see">See all</span>
        </div>
        <div class="link-card">
          <div class="row1"><img src="https://i.pravatar.cc/40?img=12" alt="" /><span class="who">You</span><span class="time">4:30 PM</span></div>
          <span class="url">google.com</span>
          <div class="meta"><div class="domain">Google.com</div><div class="t">Google</div></div>
        </div>
        <div class="card">
          <img class="av" src="https://i.pravatar.cc/64?img=15" alt="" />
          <div>
            <div class="who">Eric Hechavarria</div>
            <div class="preview">figma.com/file/abc — Designs v2</div>
          </div>
          <div class="time">Tue</div>
        </div>
      </div>

      <div class="tag-section">
        <div class="tag-section-head">
          <div class="left"><span class="swatch" style="background:#f5a524"></span><span class="name">Test</span><span class="count">1</span></div>
          <span class="see">See all</span>
        </div>
        <div class="card">
          <div class="av" style="background:#4b5563;display:inline-flex;align-items:center;justify-content:center;color:#fff;font-size:0.7rem;font-weight:800">DM</div>
          <div>
            <div class="who">Daniel Murphy</div>
            <div class="preview">Should we try the new flow on Friday?</div>
          </div>
          <div class="time">Mon</div>
        </div>
      </div>
    </div>
  </div>
</div>
