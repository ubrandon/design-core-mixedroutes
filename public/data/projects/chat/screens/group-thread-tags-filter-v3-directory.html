<link rel="stylesheet" href="../../../../styles/shared.css" />
<link rel="stylesheet" href="../../../../styles/ds.css" />
<link rel="stylesheet" href="../../../../data/design-system/company.css" />

<style>
  .chat-scope { --chat-bg: #0b0f14; --chat-surface: #1b2027; }
  .chat-scope .chat-wrap { background: var(--chat-bg); height: 844px; display: flex; flex-direction: column; position: relative; overflow: hidden; }
  .chat-scope .chat-pattern { position: absolute; inset: 0; background-image: url('https://raw.githubusercontent.com/telegramdesktop/tdesktop/dev/Telegram/Resources/art/bg/pattern.png'); background-size: 420px; opacity: 0.04; pointer-events: none; mix-blend-mode: screen; }

  .chat-scope .chat-header { position: relative; z-index: 3; display: grid; grid-template-columns: 28px 1fr 28px; align-items: center; gap: 12px; padding: 14px 16px 8px; }
  .chat-scope .chat-header .back { background: transparent; border: 0; color: rgba(255,255,255,0.95); display: inline-flex; align-items: center; padding: 0; cursor: pointer; }
  .chat-scope .chat-header .back i { font-size: 24px; }
  .chat-scope .chat-header .title { font-size: 1.25rem; font-weight: 800; color: #fff; }
  .chat-scope .chat-header .edit-btn { background: transparent; border: 0; color: rgba(255,255,255,0.95); padding: 0; cursor: pointer; display: inline-flex; align-items: center; justify-self: end; }
  .chat-scope .chat-header .edit-btn i { font-size: 22px; }

  .chat-scope .hint { padding: 0 16px 16px; color: rgba(255,255,255,0.55); font-size: 0.9rem; }

  .chat-scope .body { position: relative; z-index: 1; flex: 1; overflow-y: auto; padding: 0 16px 16px; display: grid; grid-template-columns: 1fr 1fr; gap: 12px; align-content: start; }

  .chat-scope .tag-tile { background: var(--chat-surface); border-radius: 16px; padding: 16px 14px 14px; display: flex; flex-direction: column; gap: 14px; min-height: 130px; position: relative; overflow: hidden; }
  .chat-scope .tag-tile::before { content: ''; position: absolute; left: 0; top: 0; bottom: 0; width: 4px; background: var(--swatch, #5eb3ff); }
  .chat-scope .tag-tile .top { display: flex; align-items: center; justify-content: space-between; }
  .chat-scope .tag-tile .ico { width: 36px; height: 36px; border-radius: 10px; background: rgba(255,255,255,0.08); display: inline-flex; align-items: center; justify-content: center; color: var(--swatch, #5eb3ff); }
  .chat-scope .tag-tile .ico i { font-size: 18px; }
  .chat-scope .tag-tile .count { color: rgba(255,255,255,0.5); font-size: 0.82rem; font-weight: 700; }
  .chat-scope .tag-tile .name { color: #fff; font-size: 1.05rem; font-weight: 800; }
  .chat-scope .tag-tile .last { color: rgba(255,255,255,0.55); font-size: 0.8rem; margin-top: -8px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

  .chat-scope .new-tag-tile { background: transparent; border: 1.5px dashed rgba(255,255,255,0.22); border-radius: 16px; padding: 16px 14px; min-height: 130px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px; color: rgba(255,255,255,0.65); }
  .chat-scope .new-tag-tile i { font-size: 24px; }
  .chat-scope .new-tag-tile .lbl { font-size: 0.9rem; font-weight: 700; }
</style>

<div class="mr-scope chat-scope">
  <div class="chat-wrap">
    <div class="chat-pattern" aria-hidden="true"></div>
    <header class="chat-header">
      <button type="button" class="back" aria-label="Back"><i class="ph ph-arrow-left"></i></button>
      <div class="title">Tags</div>
      <button type="button" class="edit-btn" aria-label="Edit"><i class="ph ph-pencil-simple"></i></button>
    </header>
    <div class="hint">Bookmark and organize important messages.</div>

    <div class="body">
      <div class="tag-tile" style="--swatch:#5eb3ff">
        <div class="top">
          <span class="ico"><i class="ph-fill ph-link"></i></span>
          <span class="count">3 items</span>
        </div>
        <div>
          <div class="name">Links</div>
          <div class="last">google.com</div>
        </div>
      </div>
      <div class="tag-tile" style="--swatch:#f5a524">
        <div class="top">
          <span class="ico"><i class="ph-fill ph-flask"></i></span>
          <span class="count">1 item</span>
        </div>
        <div>
          <div class="name">Test</div>
          <div class="last">Should we try the new flow…</div>
        </div>
      </div>
      <div class="tag-tile" style="--swatch:#a78bfa">
        <div class="top">
          <span class="ico"><i class="ph-fill ph-lightbulb"></i></span>
          <span class="count">8 items</span>
        </div>
        <div>
          <div class="name">Ideas</div>
          <div class="last">betting pool just for friends</div>
        </div>
      </div>
      <div class="tag-tile" style="--swatch:#f87171">
        <div class="top">
          <span class="ico"><i class="ph-fill ph-star"></i></span>
          <span class="count">2 items</span>
        </div>
        <div>
          <div class="name">Important</div>
          <div class="last">Heather's birthday on the 14th</div>
        </div>
      </div>
      <div class="new-tag-tile">
        <i class="ph ph-plus"></i>
        <span class="lbl">New tag</span>
      </div>
    </div>
  </div>
</div>
