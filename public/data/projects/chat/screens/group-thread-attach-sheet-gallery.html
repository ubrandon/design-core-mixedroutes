<style>
  .chat-scope { --chat-bg: #0b0f14; --chat-surface: #1b2027; --chat-out: #2f7a72; --bubble-radius: 18px; }
  .chat-scope .chat-wrap { background: var(--chat-bg); height: 844px; display: flex; flex-direction: column; position: relative; overflow: hidden; }
  .chat-scope .chat-body { overflow-y: auto; }
  .chat-scope .chat-pattern { position: absolute; inset: 0; background-image: url('https://raw.githubusercontent.com/telegramdesktop/tdesktop/dev/Telegram/Resources/art/bg/pattern.png'); background-size: 420px; opacity: 0.06; pointer-events: none; mix-blend-mode: screen; }
  .chat-scope .chat-header { position: sticky; top: 0; z-index: 3; display: grid; grid-template-columns: 28px 36px 1fr 28px; align-items: center; gap: 10px; padding: 10px 12px; background: rgba(11,15,20,0.92); backdrop-filter: blur(10px); border-bottom: 1px solid rgba(255,255,255,0.05); }
  .chat-scope .chat-header .back { background: transparent; border: 0; color: rgba(255,255,255,0.95); display: inline-flex; align-items: center; justify-content: center; padding: 0; cursor: pointer; }
  .chat-scope .chat-header .back i { font-size: 22px; }
  .chat-scope .chat-header .avatar { width: 34px; height: 34px; border-radius: 50%; object-fit: cover; }
  .chat-scope .chat-header .title { font-size: 1rem; font-weight: 800; color: #fff; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .chat-scope .chat-header .tag-btn { background: transparent; border: 0; color: rgba(255,255,255,0.85); padding: 0; cursor: pointer; display: inline-flex; align-items: center; justify-content: center; }
  .chat-scope .chat-header .tag-btn i { font-size: 20px; }

  .chat-scope .chat-body { position: relative; z-index: 1; flex: 1; padding: 12px 10px 8px; display: flex; flex-direction: column; gap: 10px; }
  .chat-scope .msg-row { display: grid; grid-template-columns: 36px 1fr; gap: 8px; align-items: flex-end; }
  .chat-scope .msg-row.out { grid-template-columns: 1fr; }
  .chat-scope .msg-row .avatar { width: 32px; height: 32px; border-radius: 50%; object-fit: cover; align-self: flex-end; }
  .chat-scope .msg-row .avatar.initials { background: #4b5563; color: #fff; font-size: 0.7rem; font-weight: 800; display: inline-flex; align-items: center; justify-content: center; }
  .chat-scope .msg-stack { display: flex; flex-direction: column; gap: 4px; max-width: 78%; }
  .chat-scope .msg-row.out .msg-stack { margin-left: auto; align-items: flex-end; }
  .chat-scope .bubble { padding: 9px 12px 10px; border-radius: var(--bubble-radius); color: #fff; font-size: 0.95rem; line-height: 1.3; }
  .chat-scope .bubble.in { background: var(--chat-surface); border-bottom-left-radius: 6px; }
  .chat-scope .bubble.out { background: var(--chat-out); border-bottom-right-radius: 6px; }
  .chat-scope .bubble .sender { font-size: 0.82rem; font-weight: 800; color: #5eb3ff; margin-bottom: 2px; }
  .chat-scope .seen { text-align: center; color: rgba(255,255,255,0.45); font-size: 0.78rem; padding: 6px 0 2px; }

  .chat-scope .composer { position: relative; z-index: 2; display: grid; grid-template-columns: 1fr 44px; align-items: center; gap: 10px; padding: 6px 12px 18px; background: rgba(11,15,20,0.92); border-top: 1px solid rgba(255,255,255,0.05); }
  .chat-scope .composer .input-pill { display: grid; grid-template-columns: auto 1fr auto auto; align-items: center; gap: 6px; padding: 8px 10px; border-radius: 999px; background: #1b2027; }
  .chat-scope .composer .input-pill .placeholder { color: rgba(255,255,255,0.5); font-size: 0.98rem; padding-left: 4px; }
  .chat-scope .composer .icon-btn { background: transparent; border: 0; color: rgba(255,255,255,0.55); width: 30px; height: 30px; display: inline-flex; align-items: center; justify-content: center; cursor: pointer; padding: 0; }
  .chat-scope .composer .icon-btn i { font-size: 22px; }
  .chat-scope .composer .plus-btn { color: #5eb3ff; }
  .chat-scope .composer .send-btn { width: 44px; height: 44px; border-radius: 50%; background: #2c333d; color: rgba(255,255,255,0.85); border: 0; display: inline-flex; align-items: center; justify-content: center; cursor: pointer; }
  .chat-scope .composer .send-btn i { font-size: 20px; }

  .chat-scope .scrim { position: absolute; inset: 0; background: rgba(0,0,0,0.45); z-index: 4; }
  .chat-scope .sheet { position: absolute; left: 0; right: 0; bottom: 0; background: #161b22; border-top-left-radius: 18px; border-top-right-radius: 18px; padding: 10px 0 16px; z-index: 5; max-height: 64%; display: flex; flex-direction: column; }
  .chat-scope .sheet .grabber { width: 40px; height: 4px; border-radius: 2px; background: rgba(255,255,255,0.18); margin: 4px auto 10px; }
  .chat-scope .sheet .sheet-title { display: flex; justify-content: space-between; align-items: center; margin: 4px 16px 8px; }
  .chat-scope .sheet .sheet-title h3 { margin: 0; font-size: 1.05rem; font-weight: 800; color: #fff; }
  .chat-scope .sheet .sheet-title .more { background: transparent; border: 0; color: #5eb3ff; font-size: 0.86rem; font-weight: 700; cursor: pointer; }

  .chat-scope .tab-bar { display: flex; gap: 6px; padding: 4px 12px 8px; overflow-x: auto; }
  .chat-scope .tab-bar .tab { background: #1f262f; color: rgba(255,255,255,0.7); border: 0; padding: 6px 12px; border-radius: 999px; font-size: 0.84rem; font-weight: 700; cursor: pointer; white-space: nowrap; }
  .chat-scope .tab-bar .tab.active { background: #fff; color: #0b0f14; }

  .chat-scope .gallery { display: grid; grid-template-columns: repeat(3, 1fr); gap: 2px; padding: 0 12px; overflow-y: auto; }
  .chat-scope .gallery .tile { position: relative; aspect-ratio: 1; background: #232a33; border-radius: 4px; overflow: hidden; cursor: pointer; }
  .chat-scope .gallery .tile img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .chat-scope .gallery .tile.video::after { content: ''; position: absolute; inset: 0; background: linear-gradient(180deg, transparent 60%, rgba(0,0,0,0.55)); }
  .chat-scope .gallery .tile .duration { position: absolute; right: 5px; bottom: 5px; color: #fff; font-size: 0.7rem; font-weight: 700; z-index: 1; text-shadow: 0 1px 2px rgba(0,0,0,0.6); }
  .chat-scope .gallery .tile .check { position: absolute; top: 6px; right: 6px; width: 22px; height: 22px; border-radius: 50%; background: rgba(0,0,0,0.4); border: 1.5px solid rgba(255,255,255,0.85); display: inline-flex; align-items: center; justify-content: center; color: #fff; font-size: 12px; font-weight: 700; }
  .chat-scope .gallery .tile.selected .check { background: #5eb3ff; border-color: #5eb3ff; }
  .chat-scope .gallery .tile.camera { background: #232a33; display: flex; align-items: center; justify-content: center; flex-direction: column; gap: 4px; color: #fff; }
  .chat-scope .gallery .tile.camera i { font-size: 28px; }
  .chat-scope .gallery .tile.camera span { font-size: 0.72rem; font-weight: 600; color: rgba(255,255,255,0.8); }

  .chat-scope .sheet-actions { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; padding: 12px 12px 4px; border-top: 1px solid rgba(255,255,255,0.05); margin-top: 8px; }
  .chat-scope .quick-act { display: flex; flex-direction: column; align-items: center; gap: 4px; background: transparent; border: 0; color: #fff; cursor: pointer; padding: 4px 2px; }
  .chat-scope .quick-act .ico { width: 38px; height: 38px; border-radius: 12px; display: inline-flex; align-items: center; justify-content: center; background: #2a313b; }
  .chat-scope .quick-act .ico i { font-size: 18px; color: #fff; }
  .chat-scope .quick-act .label { font-size: 0.72rem; color: rgba(255,255,255,0.78); font-weight: 600; }

  .chat-scope .send-bar { display: grid; grid-template-columns: 1fr auto; align-items: center; gap: 10px; padding: 12px 12px 6px; }
  .chat-scope .send-bar .count { color: rgba(255,255,255,0.7); font-size: 0.86rem; font-weight: 600; }
  .chat-scope .send-bar .send-cta { background: #5eb3ff; color: #0b0f14; border: 0; padding: 10px 18px; border-radius: 999px; font-weight: 800; font-size: 0.92rem; cursor: pointer; display: inline-flex; align-items: center; gap: 6px; }
</style>

<div class="mr-scope chat-scope">
  <div class="chat-wrap">
    <div class="chat-pattern" aria-hidden="true"></div>
    <header class="chat-header">
      <button type="button" class="back" aria-label="Back"><i class="ph ph-caret-left"></i></button>
      <img class="avatar" src="https://i.pravatar.cc/80?img=15" alt="" />
      <div class="title">UFC 329: McGregor vs. Hollowa…</div>
      <button type="button" class="tag-btn" aria-label="Tag"><i class="ph ph-tag"></i></button>
    </header>

    <div class="chat-body">
      <div class="msg-row">
        <img class="avatar" src="https://i.pravatar.cc/64?img=12" alt="" />
        <div class="msg-stack">
          <div class="bubble in"><div class="sender">Eric Hechavarria</div>Heather likes UFC lol</div>
        </div>
      </div>
      <div class="msg-row out"><div class="msg-stack"><div class="bubble out">Send me a pic from the gym</div></div></div>
      <div class="seen">Seen by you</div>
    </div>

    <div class="composer">
      <div class="input-pill">
        <button type="button" class="icon-btn plus-btn" aria-label="Add"><i class="ph-fill ph-plus-circle"></i></button>
        <span class="placeholder">Message</span>
        <button type="button" class="icon-btn" aria-label="Photo"><i class="ph ph-image"></i></button>
        <button type="button" class="icon-btn" aria-label="Emoji"><i class="ph ph-smiley"></i></button>
      </div>
      <button type="button" class="send-btn" aria-label="Send"><i class="ph ph-paper-plane-right"></i></button>
    </div>

    <div class="scrim" aria-hidden="true"></div>
    <div class="sheet" role="dialog" aria-label="Attach media">
      <div class="grabber"></div>
      <div class="sheet-title">
        <h3>Recent</h3>
        <button class="more">All Albums</button>
      </div>
      <div class="tab-bar">
        <button class="tab active">All</button>
        <button class="tab">Photos</button>
        <button class="tab">Videos</button>
        <button class="tab">Favorites</button>
        <button class="tab">Selfies</button>
      </div>
      <div class="gallery">
        <button class="tile camera"><i class="ph ph-camera"></i><span>Take Photo</span></button>
        <button class="tile selected"><img src="https://images.unsplash.com/photo-1517438476312-10d79c077509?w=300&q=70" alt=""><span class="check"><i class="ph-bold ph-check"></i></span></button>
        <button class="tile"><img src="https://images.unsplash.com/photo-1554068865-24cecd4e34b8?w=300&q=70" alt=""><span class="check"></span></button>
        <button class="tile video"><img src="https://images.unsplash.com/photo-1599058917212-d750089bc07e?w=300&q=70" alt=""><span class="duration">0:24</span><span class="check"></span></button>
        <button class="tile"><img src="https://images.unsplash.com/photo-1546484959-f9a381d1330d?w=300&q=70" alt=""><span class="check"></span></button>
        <button class="tile selected"><img src="https://images.unsplash.com/photo-1517649763962-0c623066013b?w=300&q=70" alt=""><span class="check"><i class="ph-bold ph-check"></i></span></button>
        <button class="tile"><img src="https://images.unsplash.com/photo-1583473848882-f9a5bc7fd2ee?w=300&q=70" alt=""><span class="check"></span></button>
        <button class="tile video"><img src="https://images.unsplash.com/photo-1517438322307-e67111335449?w=300&q=70" alt=""><span class="duration">1:08</span><span class="check"></span></button>
        <button class="tile"><img src="https://images.unsplash.com/photo-1571019613454-1cb2f99b2d8b?w=300&q=70" alt=""><span class="check"></span></button>
      </div>
      <div class="sheet-actions">
        <button class="quick-act"><span class="ico"><i class="ph-fill ph-file"></i></span><span class="label">File</span></button>
        <button class="quick-act"><span class="ico"><i class="ph-fill ph-map-pin"></i></span><span class="label">Location</span></button>
        <button class="quick-act"><span class="ico"><i class="ph-fill ph-chart-bar"></i></span><span class="label">Poll</span></button>
        <button class="quick-act"><span class="ico"><i class="ph-fill ph-gif"></i></span><span class="label">GIF</span></button>
      </div>
      <div class="send-bar">
        <span class="count">2 selected</span>
        <button class="send-cta"><i class="ph ph-paper-plane-right"></i> Send</button>
      </div>
    </div>
  </div>
</div>
