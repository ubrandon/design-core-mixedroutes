<link rel="stylesheet" href="../../../../styles/shared.css" />
<link rel="stylesheet" href="../../../../styles/ds.css" />
<link rel="stylesheet" href="../../../../data/design-system/company.css" />
<link rel="stylesheet" href="../pp.css" />

<div class="pp pp-ts1b" style="background: #ffffff;">
  <div class="status"><span>9:41</span><span class="r"><i class="ph-fill ph-cell-signal-full"></i><i class="ph-fill ph-wifi-high"></i><i class="ph-fill ph-battery-full"></i></span></div>

  <div class="ts-toolbar">
    <span class="icon-btn"><i class="ph ph-x"></i></span>
    <span class="ttl">New plan</span>
    <span class="skip hide">Skip</span>
  </div>

  <div class="content">
    <div class="banner-add">
      <span class="ba-ic"><i class="ph ph-image"></i></span>
      Add a banner photo
      <i class="ph ph-plus plus"></i>
    </div>

    <div class="name-wrap2">
      <div class="name-input">
        <span class="lead emoji">🏃</span>
        Afternoon run
        <span class="drop-ic"><i class="ph ph-caret-down"></i></span>
      </div>
    </div>

    <div class="nf-label">When</div>
    <div class="quick-when">
      <span class="pill">Now</span>
      <span class="pill">Later today</span>
      <span class="pill">Tonight</span>
      <span class="pill">Tomorrow</span>
      <span class="pill">This weekend</span>
      <span class="pill"><i class="ph ph-calendar-blank" style="font-size:16px;margin-right:6px;"></i>Pick a date</span>
    </div>

    <div class="nf-label" style="margin-top:20px;">Where</div>
    <div class="drow">
      <span class="ibox"><i class="ph ph-map-pin"></i></span>
      <div class="dtxt"><span class="ph-text" style="font-size:16px;">Add a place</span></div>
      <i class="ph ph-plus trail"></i>
    </div>

    <div class="nf-label" style="margin-top:20px;">Anything else</div>
    <div class="drow">
      <span class="ibox"><i class="ph ph-note-pencil"></i></span>
      <div class="dtxt"><span class="ph-text" style="font-size:16px;">Add a note</span></div>
      <i class="ph ph-plus trail"></i>
    </div>
    <span class="more-link">More: tags, what to bring, cost <i class="ph ph-caret-down"></i></span>
  </div>

  <div class="footer" style="padding-top:20px;">
    <span class="btn-grad">Continue</span>
    <span class="btn-ghost">Create now, just me</span>
    <div class="home-bar"></div>
  </div>
</div>
