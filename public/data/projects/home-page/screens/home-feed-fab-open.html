<link rel="stylesheet" href="../../../../styles/shared.css" />
<link rel="stylesheet" href="../../../../styles/ds.css" />
<link rel="stylesheet" href="../../../../data/design-system/company.css" />

<style>
  .mr-fab-screen {
    position: relative;
    min-height: 380px;
    background: var(--bg-0);
    overflow: hidden;
  }
  .mr-fab-scrim {
    position: absolute;
    inset: 0;
    background: radial-gradient(120% 80% at 88% 92%, rgba(var(--neon-teal-rgb), 0.14), transparent 60%),
                rgba(2, 6, 14, 0.55);
    backdrop-filter: blur(2px);
    -webkit-backdrop-filter: blur(2px);
    z-index: 1;
  }
  .mr-fab-actions {
    position: absolute;
    right: 16px;
    bottom: 156px;
    display: flex;
    flex-direction: column;
    align-items: flex-end;
    gap: 10px;
    z-index: 7;
  }
  .mr-fab-action {
    display: inline-flex;
    align-items: center;
    gap: 10px;
    padding: 12px 18px 12px 16px;
    border-radius: 999px;
    border: 1px solid rgba(255, 255, 255, 0.1);
    cursor: pointer;
    color: rgba(255, 255, 255, 0.98);
    background: linear-gradient(
      135deg,
      color-mix(in srgb, rgb(var(--neon-blue-rgb)) 78%, #020b14),
      color-mix(in srgb, rgb(var(--neon-teal-rgb)) 72%, #020b14)
    );
    box-shadow:
      0 8px 18px rgba(var(--neon-teal-rgb), 0.22),
      0 0 0 1px rgba(255, 255, 255, 0.08) inset;
    font-size: 0.95rem;
    font-weight: 700;
    letter-spacing: -0.005em;
  }
  .mr-fab-action i {
    font-size: 20px;
  }
  .mr-fab-close {
    position: absolute;
    right: 16px;
    bottom: 88px;
    width: 56px;
    height: 56px;
    border-radius: 50%;
    background: linear-gradient(
      135deg,
      color-mix(in srgb, rgb(var(--neon-blue-rgb)) 78%, #020b14),
      color-mix(in srgb, rgb(var(--neon-teal-rgb)) 72%, #020b14)
    );
    color: rgba(255, 255, 255, 0.98);
    display: flex;
    align-items: center;
    justify-content: center;
    border: none;
    box-shadow:
      0 12px 28px rgba(var(--neon-teal-rgb), 0.32),
      0 0 0 1px rgba(255, 255, 255, 0.14) inset;
    z-index: 8;
  }
  .mr-fab-close i {
    font-size: 28px;
  }
  .mr-fab-bottom {
    position: absolute;
    left: 0;
    right: 0;
    bottom: 0;
    padding-top: 8px;
    background: linear-gradient(180deg, transparent, var(--bg-0) 28%);
    z-index: 2;
  }
</style>

<div style="background: var(--bg-0); overflow-x: clip; position: relative">
  <div class="mr-scope mr-fab-screen">

    <div class="mr-fab-scrim" aria-hidden="true"></div>

    <div class="mr-fab-actions" role="menu" aria-label="Create">
      <button type="button" class="mr-fab-action" role="menuitem">
        <i class="ph-fill ph-calendar-plus" aria-hidden="true"></i>
        <span>Plan</span>
      </button>
      <button type="button" class="mr-fab-action" role="menuitem">
        <i class="ph-fill ph-users-three" aria-hidden="true"></i>
        <span>Group</span>
      </button>
      <button type="button" class="mr-fab-action" role="menuitem">
        <i class="ph-fill ph-chat-teardrop-text" aria-hidden="true"></i>
        <span>Chat</span>
      </button>
    </div>

    <button type="button" class="mr-fab-close" aria-label="Close create menu">
      <i class="ph ph-x" aria-hidden="true"></i>
    </button>

    <div class="mr-fab-bottom">
      <div class="mr-tab-bar" style="margin: 0 8px 0">
        <button type="button" class="mr-tab-item mr-tab-active" aria-label="Home">
          <i class="ph-fill ph-house" aria-hidden="true"></i>
        </button>
        <button type="button" class="mr-tab-item" aria-label="Calendar">
          <i class="ph ph-calendar-blank" aria-hidden="true"></i>
        </button>
        <button type="button" class="mr-tab-item" aria-label="Explore">
          <i class="ph ph-compass" aria-hidden="true"></i>
        </button>
        <button type="button" class="mr-tab-item" aria-label="You">
          <i class="ph ph-user" aria-hidden="true"></i>
        </button>
        <button type="button" class="mr-tab-item" aria-label="Messages">
          <i class="ph ph-chat-teardrop-text" aria-hidden="true"></i>
        </button>
      </div>
    </div>

  </div>
</div>
