<link rel="stylesheet" href="../../../../styles/shared.css" />
<link rel="stylesheet" href="../../../../styles/ds.css" />
<link rel="stylesheet" href="../../../../data/design-system/company.css" />

<style>
  .mr-greeting {
    padding: 22px 16px 16px;
  }
  .mr-greeting-headline {
    font-size: 2rem;
    font-weight: 800;
    letter-spacing: -0.025em;
    line-height: 1.12;
    color: var(--text);
  }
  .mr-greeting-tail {
    display: block;
    font-size: 1.05rem;
    font-weight: 600;
    letter-spacing: -0.01em;
    color: rgba(255, 255, 255, 0.62);
    margin-top: 8px;
  }
  .mr-greeting-weather {
    display: flex;
    align-items: center;
    gap: 7px;
    margin-top: 14px;
    font-size: 0.82rem;
    font-weight: 600;
    color: rgba(255, 255, 255, 0.62);
  }
  .mr-greeting-weather i {
    font-size: 16px;
    color: var(--neon-teal);
  }
  .mr-greeting-weather .mr-greeting-sep {
    color: rgba(255, 255, 255, 0.22);
  }
  .mr-greeting-weather .mr-greeting-loc {
    color: rgba(255, 255, 255, 0.42);
    font-weight: 500;
  }
  .mr-banner-stack {
    padding: 4px 16px 12px;
  }
  .mr-banner-stack-inner {
    display: flex;
    flex-direction: column;
    align-items: center;
    position: relative;
  }
  .mr-banner-stub {
    height: 14px;
    border-radius: 0 0 18px 18px;
    background:
      linear-gradient(135deg, rgba(var(--neon-teal-rgb), 0.22), rgba(var(--neon-blue-rgb), 0.08)),
      var(--bg-0);
    border: 1px solid rgba(var(--neon-teal-rgb), 0.36);
    border-top: none;
    position: relative;
    z-index: 1;
  }
  .mr-banner-stub.is-second {
    width: calc(100% - 16px);
    margin-top: -8px;
    order: 2;
    z-index: 1;
  }
  .mr-banner-stub.is-third {
    width: calc(100% - 32px);
    margin-top: -8px;
    order: 3;
    z-index: 0;
  }
  .mr-banner-single {
    position: relative;
    z-index: 3;
    width: 100%;
    border-radius: 20px;
    padding: 18px;
    display: flex;
    gap: 14px;
    align-items: center;
    background:
      linear-gradient(135deg, rgba(var(--neon-teal-rgb), 0.22), rgba(var(--neon-blue-rgb), 0.08)),
      var(--bg-0);
    border: 1px solid rgba(var(--neon-teal-rgb), 0.36);
    box-shadow: 0 8px 24px rgba(0, 0, 0, 0.32);
    order: 1;
  }
  .mr-banner-cta {
    font-size: 0.84rem;
    font-weight: 800;
    color: var(--neon-teal);
    background: none;
    border: none;
    padding: 4px 0;
    flex-shrink: 0;
  }
  .mr-banner-icon {
    width: 46px;
    height: 46px;
    border-radius: 14px;
    background: rgba(var(--neon-teal-rgb), 0.18);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 24px;
    color: var(--neon-teal);
    flex-shrink: 0;
  }
  .mr-banner-body {
    flex: 1;
    min-width: 0;
  }
  .mr-banner-title {
    font-size: 1.02rem;
    font-weight: 800;
    color: var(--text);
    line-height: 1.2;
  }
  .mr-banner-desc {
    font-size: 0.84rem;
    color: rgba(255, 255, 255, 0.72);
    margin-top: 3px;
    line-height: 1.3;
  }
  .mr-row-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 0 16px 10px;
    gap: 10px;
  }
  .mr-row-title {
    font-size: 1.2rem;
    font-weight: 800;
    color: var(--text);
    display: flex;
    align-items: baseline;
    gap: 8px;
    min-width: 0;
  }
  .mr-row-link {
    font-size: 0.72rem;
    font-weight: 800;
    letter-spacing: 0.08em;
    color: var(--mr-section-action);
    text-transform: uppercase;
    flex-shrink: 0;
  }
  .mr-notif-dot {
    position: absolute;
    top: 6px;
    right: 6px;
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: #e74c3c;
    border: 2px solid var(--bg-0);
  }
  .mr-nav-icon-wrap {
    position: relative;
  }
  .mr-chat-row {
    display: flex;
    gap: 12px;
    overflow-x: auto;
    -webkit-overflow-scrolling: touch;
    padding-bottom: 6px;
    scrollbar-width: none;
  }
  .mr-chat-row::-webkit-scrollbar { display: none; }
  .mr-chat-card {
    flex: 0 0 auto;
    width: 96px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 6px;
    text-align: center;
    background: none;
    border: none;
    padding: 0;
  }
  .mr-chat-avatar-wrap { position: relative; }
  .mr-chat-avatar {
    width: 64px;
    height: 64px;
    border-radius: 50%;
    object-fit: cover;
    border: 2px solid rgba(255, 255, 255, 0.06);
    display: block;
  }
  .mr-chat-avatar.is-group {
    background: linear-gradient(135deg, rgba(var(--neon-teal-rgb), 0.32), rgba(var(--neon-blue-rgb), 0.18));
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 26px;
    color: var(--text);
  }
  .mr-chat-badge {
    position: absolute;
    bottom: 2px;
    right: 2px;
    width: 20px;
    height: 20px;
    border-radius: 50%;
    background: #22c55e;
    color: #04140a;
    font-size: 0.7rem;
    font-weight: 800;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 0;
    border: 2px solid var(--bg-0);
  }
  .mr-chat-name {
    font-size: 0.84rem;
    font-weight: 700;
    color: var(--text);
    max-width: 96px;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .mr-chat-preview {
    font-size: 0.72rem;
    line-height: 1.3;
    color: rgba(255, 255, 255, 0.55);
    max-width: 96px;
    display: -webkit-box;
    -webkit-line-clamp: 2;
    -webkit-box-orient: vertical;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .mr-chat-all-tile {
    flex: 0 0 auto;
    width: 96px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 6px;
    text-align: center;
    background: none;
    border: none;
    padding: 0;
  }
  .mr-chat-all-icon {
    width: 64px;
    height: 64px;
    border-radius: 50%;
    border: 1px dashed rgba(var(--neon-teal-rgb), 0.4);
    background: rgba(var(--neon-teal-rgb), 0.05);
    display: flex;
    align-items: center;
    justify-content: center;
    color: var(--neon-teal);
    font-size: 24px;
  }
  .mr-chat-all-label {
    font-size: 0.78rem;
    font-weight: 700;
    color: var(--neon-teal);
  }
  .mr-inbox-tabs {
    display: flex;
    gap: 8px;
    overflow-x: auto;
    padding: 4px 16px 12px;
    scrollbar-width: none;
  }
  .mr-inbox-tabs::-webkit-scrollbar { display: none; }
  .mr-inbox-tab {
    flex: 0 0 auto;
    display: inline-flex;
    align-items: center;
    gap: 6px;
    padding: 8px 14px;
    border-radius: 999px;
    border: 1px solid rgba(255, 255, 255, 0.14);
    background: rgba(6, 8, 16, 0.7);
    color: rgba(255, 255, 255, 0.85);
    font-size: 0.82rem;
    font-weight: 700;
    cursor: pointer;
  }
  .mr-inbox-tab.is-active {
    background: rgba(var(--neon-teal-rgb), 0.16);
    border-color: rgba(var(--neon-teal-rgb), 0.42);
    color: var(--text);
  }
  .mr-inbox-tab-count {
    font-size: 0.72rem;
    font-weight: 800;
    padding: 1px 7px;
    border-radius: 999px;
    background: rgba(255, 255, 255, 0.1);
    color: rgba(255, 255, 255, 0.85);
  }
  .mr-inbox-tab.is-active .mr-inbox-tab-count {
    background: rgba(var(--neon-teal-rgb), 0.28);
    color: var(--text);
  }
</style>

<div style="background: var(--bg-0); overflow-x: clip; position: relative">
  <div class="mr-scope" style="padding-bottom: 8px">

    <header class="mr-top-nav-home">
      <a class="mr-top-nav-home-logo" href="#" aria-label="MixedRoutes home">
        <img src="../../../design-system/mixedroutes-assets/icon-foreground.svg" width="36" height="36" alt="" loading="lazy" />
        <span class="mr-top-nav-home-wordmark">MixedRoutes</span>
      </a>
      <div class="mr-top-nav-home-actions">
        <div class="mr-nav-icon-wrap">
          <button type="button" class="mr-nav-icon-btn" aria-label="Notifications">
            <i class="ph-fill ph-bell" aria-hidden="true"></i>
          </button>
          <span class="mr-notif-dot" aria-hidden="true"></span>
        </div>
        <img class="mr-top-nav-avatar" src="https://i.pravatar.cc/72?img=11" alt="" width="36" height="36" loading="lazy" />
      </div>
    </header>

    <div class="mr-greeting">
      <div class="mr-greeting-headline">
        <span class="gradient-text">Plans tonight,</span> Brandon
        <span class="mr-greeting-tail">Wine bar at 8 — 2 friends still to reply 🍷</span>
      </div>
      <div class="mr-greeting-weather">
        <i class="ph-fill ph-moon-stars" aria-hidden="true"></i>
        <span>62° · Clear skies</span>
        <span class="mr-greeting-sep">·</span>
        <span class="mr-greeting-loc">Asheville</span>
      </div>
    </div>


    <div class="mr-banner-stack">
      <div class="mr-banner-stack-inner">
        <div class="mr-banner-stub is-third" aria-hidden="true"></div>
        <div class="mr-banner-stub is-second" aria-hidden="true"></div>
        <div class="mr-banner-single">
          <div class="mr-banner-icon"><i class="ph-fill ph-hand-waving" aria-hidden="true"></i></div>
          <div class="mr-banner-body">
            <div class="mr-banner-title">Welcome to MixedRoutes</div>
            <div class="mr-banner-desc">Let's get you set up in a few quick steps.</div>
          </div>
          <button type="button" class="mr-banner-cta">Start</button>
        </div>
      </div>
    </div>

    <!-- Notification chips. Each chip links to the plans page (or friends page). Chip only renders when its bucket has items. -->
    <div class="mr-inbox-tabs">
      <button type="button" class="mr-inbox-tab is-active">
        <i class="ph-fill ph-envelope-simple-open" aria-hidden="true"></i>
        Invites
        <span class="mr-inbox-tab-count">2</span>
      </button>
      <button type="button" class="mr-inbox-tab is-active">
        <i class="ph-fill ph-user-plus" aria-hidden="true"></i>
        Friend requests
        <span class="mr-inbox-tab-count">3</span>
      </button>
    </div>

    <div style="padding: 8px 0 4px">
      <div class="mr-row-header">
        <span class="mr-row-title">Recent chats</span>
        <span class="mr-row-link">All chats</span>
      </div>
      <div style="padding: 0 16px">
        <div class="mr-chat-row">
          <button type="button" class="mr-chat-card">
            <div class="mr-chat-avatar-wrap">
              <img class="mr-chat-avatar" src="https://i.pravatar.cc/96?img=5" alt="" loading="lazy" />
              <span class="mr-chat-badge">3</span>
            </div>
            <div class="mr-chat-name">Sara</div>
            <div class="mr-chat-preview is-unread">8pm works for me — see you at the wine bar</div>
          </button>
          <button type="button" class="mr-chat-card">
            <div class="mr-chat-avatar-wrap">
              <div class="mr-chat-avatar is-group" aria-hidden="true">🥾</div>
              <span class="mr-chat-badge">2</span>
            </div>
            <div class="mr-chat-name">Trail crew</div>
            <div class="mr-chat-preview is-unread">Lin: 7am sharp at the Craggy Pinnacle lot</div>
          </button>
          <button type="button" class="mr-chat-card">
            <div class="mr-chat-avatar-wrap">
              <img class="mr-chat-avatar" src="https://i.pravatar.cc/96?img=33" alt="" loading="lazy" />
            </div>
            <div class="mr-chat-name">Marcus</div>
            <div class="mr-chat-preview">just sent the pin for Saturday's spot</div>
          </button>
          <button type="button" class="mr-chat-card">
            <div class="mr-chat-avatar-wrap">
              <div class="mr-chat-avatar is-group" aria-hidden="true">🎸</div>
            </div>
            <div class="mr-chat-name">Concerts crew</div>
            <div class="mr-chat-preview">John: tickets just dropped — who's in?</div>
          </button>
          <button type="button" class="mr-chat-card">
            <div class="mr-chat-avatar-wrap">
              <img class="mr-chat-avatar" src="https://i.pravatar.cc/96?img=47" alt="" loading="lazy" />
            </div>
            <div class="mr-chat-name">Devon</div>
            <div class="mr-chat-preview">thanks!</div>
          </button>
          <button type="button" class="mr-chat-all-tile">
            <div class="mr-chat-all-icon"><i class="ph ph-chats-circle" aria-hidden="true"></i></div>
            <div class="mr-chat-all-label">All chats</div>
          </button>
        </div>
      </div>
    </div>

  </div>
</div>
