<link rel="stylesheet" href="../../../../styles/shared.css" />
<link rel="stylesheet" href="../../../../styles/ds.css" />
<link rel="stylesheet" href="../../../../data/design-system/company.css" />

<style>
  .nv-root { background: var(--bg-0); color: var(--text); padding: 32px 24px 80px; }
  .nv-intro { max-width: 720px; margin: 0 auto 24px; }
  .nv-intro h1 { font-size: 1.6rem; font-weight: 800; letter-spacing: -0.02em; margin: 0 0 8px; }
  .nv-intro p { font-size: 0.92rem; color: rgba(255,255,255,0.68); line-height: 1.45; margin: 0; }

  .nv-stage {
    position: relative;
    max-width: 720px; margin: 0 auto;
    height: 360px;
    background: var(--bg-1);
    border-radius: 24px;
    border: 1px solid rgba(255,255,255,0.06);
    overflow: hidden;
  }
  .nv-stage-top {
    height: 56px; display: flex; align-items: center; justify-content: space-between;
    padding: 0 16px;
    background: rgba(6, 8, 14, 0.98);
    border-bottom: 1px solid rgba(255, 255, 255, 0.08);
  }
  .nv-stage-logo { display: flex; align-items: center; gap: 8px; text-decoration: none; color: inherit; }
  .nv-stage-logo img { height: 28px; width: 28px; display: block; }
  .nv-stage-logo-text { font-size: 1.05rem; font-weight: 700; letter-spacing: -0.01em; color: rgba(255,255,255,0.96); }
  .nv-stage-actions { display: flex; align-items: center; gap: 18px; }
  .nv-stage-icon {
    display: inline-flex; align-items: center; justify-content: center;
    color: rgba(255,255,255,0.94); font-size: 22px;
    background: none; border: none; padding: 0; cursor: pointer;
  }
  .nv-stage-notif {
    position: relative; display: inline-flex; align-items: center; justify-content: center;
    color: rgba(255,255,255,0.94); font-size: 22px;
  }
  .nv-stage-notif-dot {
    position: absolute; top: -1px; right: -1px;
    width: 8px; height: 8px; border-radius: 50%;
    background: #e74c3c; border: 2px solid rgba(6, 8, 14, 1);
  }

  .nv-stage-body {
    height: calc(100% - 56px - 92px);
    display: flex; align-items: center; justify-content: center;
    color: rgba(255,255,255,0.18); font-size: 0.78rem; font-weight: 700;
    letter-spacing: 0.12em; text-transform: uppercase;
  }

  .nv-stage-tab {
    position: absolute; left: 12px; right: 12px; bottom: 12px;
    height: 72px; border-radius: 22px;
    background: rgba(6,8,14,0.96);
    border: 1px solid rgba(255,255,255,0.06);
    display: flex; align-items: center; justify-content: space-around;
    padding: 0 8px;
  }
  .nv-tab {
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    flex: 1; padding: 0 4px;
    color: rgba(255,255,255,0.62);
    background: none; border: none; cursor: pointer; min-width: 0;
  }
  .nv-tab i { font-size: 26px; line-height: 1; }
  .nv-tab.is-active { color: #ffffff; }
  .nv-tab.is-active i { color: #ffffff; }

  .nv-tab-avatar {
    width: 36px; height: 36px; border-radius: 50%;
    background-image: url(https://i.pravatar.cc/72?img=11);
    background-size: cover; background-position: center;
    border: 1.5px solid rgba(255,255,255,0.22);
  }
  .nv-tab.is-active .nv-tab-avatar { border-color: var(--neon-teal); }
  .nv-tab-badge {
    position: absolute; top: -2px; right: -2px;
    width: 10px; height: 10px; border-radius: 50%;
    background: #22c55e; border: 2px solid rgba(6,8,14,1);
  }
  .nv-tab-icon-wrap { position: relative; display: inline-flex; align-items: center; justify-content: center; }

  .nv-fab {
    position: absolute; right: 20px; bottom: 100px;
    width: 52px; height: 52px; border-radius: 50%;
    background: linear-gradient(135deg, color-mix(in srgb, #5ba5ff 78%, #020b14), color-mix(in srgb, #20e0cf 72%, #020b14));
    color: #fff; display: flex; align-items: center; justify-content: center;
    font-size: 24px;
    box-shadow: 0 10px 24px rgba(32,224,207,0.32), 0 0 0 1px rgba(255,255,255,0.12) inset;
  }
</style>

<div class="mr-scope nv-root">
  <div class="nv-intro">
    <h1>Final nav direction</h1>
    <p>Bottom: Home · Plans · <b>You</b> · Discover · Chat. No labels — bigger icons carry it. Top right: notifications, people (Friends + invite), settings.</p>
  </div>

  <div class="nv-stage">
    <div class="nv-stage-top">
      <a class="nv-stage-logo" href="#">
        <img src="../../../design-system/mixedroutes-assets/icon-foreground.svg" alt="" />
        <span class="nv-stage-logo-text">MixedRoutes</span>
      </a>
      <div class="nv-stage-actions">
        <span class="nv-stage-notif"><i class="ph ph-bell"></i><span class="nv-stage-notif-dot"></span></span>
        <span class="nv-stage-icon"><i class="ph ph-users"></i></span>
        <span class="nv-stage-icon"><i class="ph ph-gear-six"></i></span>
      </div>
    </div>

    <div class="nv-stage-body">Feed</div>

    <div class="nv-fab"><i class="ph ph-plus"></i></div>

    <div class="nv-stage-tab">
      <button type="button" class="nv-tab is-active" aria-label="Home"><i class="ph-fill ph-house"></i></button>
      <button type="button" class="nv-tab" aria-label="Plans"><i class="ph ph-calendar-blank"></i></button>
      <button type="button" class="nv-tab" aria-label="You">
        <span class="nv-tab-icon-wrap"><span class="nv-tab-avatar"></span></span>
      </button>
      <button type="button" class="nv-tab" aria-label="Discover"><i class="ph ph-compass"></i></button>
      <button type="button" class="nv-tab" aria-label="Chat"><i class="ph ph-chat-teardrop-text"></i></button>
    </div>
  </div>
</div>
