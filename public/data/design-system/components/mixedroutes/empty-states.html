<div class="mr-scope">
  <div style="display: flex; flex-wrap: wrap; gap: 24px">
    <div class="mr-empty-state">
      <div class="mr-empty-state-icon" aria-hidden="true">
        <i class="ph ph-calendar"></i>
      </div>
      <div class="mr-empty-state-title">No plans yet</div>
      <div class="mr-empty-state-desc">Create a plan and invite your friends to start something fun together.</div>
      <button type="button" class="btn btn-primary">Create a plan</button>
    </div>

    <div class="mr-empty-state">
      <div class="mr-empty-state-icon" aria-hidden="true">
        <i class="ph ph-map-pin"></i>
      </div>
      <div class="mr-empty-state-title">No events nearby</div>
      <div class="mr-empty-state-desc">There aren't any events in your area right now. Try expanding your search radius.</div>
      <button type="button" class="btn btn-secondary">Expand search</button>
    </div>

    <div class="mr-empty-state">
      <div class="mr-empty-state-icon" aria-hidden="true">
        <i class="ph ph-chats-circle"></i>
      </div>
      <div class="mr-empty-state-title">No messages</div>
      <div class="mr-empty-state-desc">Start a conversation with a friend or group to coordinate plans.</div>
      <button type="button" class="btn btn-primary btn-sm">Start a chat</button>
    </div>
  </div>
</div>
