<div class="mr-scope">
  <div class="mr-radius-grid">
    <div class="mr-radius-item">
      <div class="mr-radius-box" style="border-radius: var(--radius-sm)"></div>
      <div class="mr-radius-info">
        <span>Small</span>
        <code>10px</code>
      </div>
    </div>
    <div class="mr-radius-item">
      <div class="mr-radius-box" style="border-radius: var(--radius-md)"></div>
      <div class="mr-radius-info">
        <span>Medium</span>
        <code>16px</code>
      </div>
    </div>
    <div class="mr-radius-item">
      <div class="mr-radius-box" style="border-radius: var(--radius-lg)"></div>
      <div class="mr-radius-info">
        <span>Large</span>
        <code>22px</code>
      </div>
    </div>
    <div class="mr-radius-item">
      <div class="mr-radius-box" style="border-radius: var(--radius-xl)"></div>
      <div class="mr-radius-info">
        <span>Extra large</span>
        <code>32px</code>
      </div>
    </div>
    <div class="mr-radius-item">
      <div class="mr-radius-box" style="border-radius: 9999px"></div>
      <div class="mr-radius-info">
        <span>Full</span>
        <code>9999px</code>
      </div>
    </div>
