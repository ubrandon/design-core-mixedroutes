<div class="mr-scope">
  <div style="display:flex;flex-wrap:wrap;gap:24px;align-items:flex-start;">
    <!-- Bottom sheet -->
    <div class="mr-modal-backdrop">
      <div class="mr-bottom-sheet">
        <div class="mr-bottom-sheet-handle"></div>
        <div class="mr-bottom-sheet-title">Share this plan</div>
        <div class="mr-bottom-sheet-desc">Invite friends to join Pizza Night this Friday at 7 PM.</div>
        <div class="mr-bottom-sheet-actions">
          <button type="button" class="btn btn-primary">Copy link</button>
          <button type="button" class="btn btn-secondary">Send to friends</button>
          <button type="button" class="btn" style="background:transparent;color:rgba(255,255,255,0.6);border-color:transparent;">Cancel</button>
        </div>
      </div>
    </div>

    <!-- Dialog: warning -->
    <div class="mr-dialog">
      <div class="mr-dialog-icon mr-dialog-warning">⚠</div>
      <div class="mr-dialog-title">Delete this plan?</div>
      <div class="mr-dialog-body">This will remove "Hiking Trip" and notify all 5 attendees. This can't be undone.</div>
      <div class="mr-dialog-actions">
        <button type="button" class="btn btn-secondary">Cancel</button>
        <button type="button" class="btn" style="background:#ef4444;color:#fff;">Delete</button>
      </div>
    </div>

    <!-- Dialog: success -->
    <div class="mr-dialog">
      <div class="mr-dialog-icon mr-dialog-success">✓</div>
      <div class="mr-dialog-title">You're in!</div>
      <div class="mr-dialog-body">You've joined Game Night. We'll remind you 30 minutes before it starts.</div>
      <div class="mr-dialog-actions">
        <button type="button" class="btn btn-primary" style="flex:1;">Got it</button>
      </div>
    </div>
  </div>
</div>
